name: Publish npm package

# Exact-candidate npm publisher. Version computation, stamping, testing, and
# source publication belong exclusively to release.yml.
on:
  workflow_call:
    inputs:
      package-dir:
        required: true
        type: string
      package-name:
        required: true
        type: string
      needs-build:
        required: false
        type: boolean
        default: false
      version:
        description: 'Exact version already stamped into the tested candidate.'
        required: true
        type: string
      base-sha:
        description: 'Base SHA used to restore the orchestrated candidate bundle.'
        required: true
        type: string
      candidate-sha:
        description: 'Exact tested candidate commit to pack and publish.'
        required: true
        type: string
      source-artifact:
        description: 'Artifact containing the incremental candidate git bundle.'
        required: true
        type: string
      pack-artifact:
        description: 'Optional artifact name for a dry-run package tarball.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Pack and validate without publishing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-sha }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source-artifact }}
          path: .git/release-source

      - name: Restore orchestrated candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ inputs.candidate-sha }}' '${{ inputs.base-sha }}'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify exact candidate version
        working-directory: ${{ inputs.package-dir }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${CURRENT}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Candidate has ${{ inputs.package-name }}@${CURRENT}, expected ${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Build
        if: inputs.needs-build
        working-directory: ${{ inputs.package-dir }}
        run: bun run build

      - name: Pack with Bun
        id: pack
        working-directory: ${{ inputs.package-dir }}
        shell: bash
        run: |
          PACK_DIR="$(mktemp -d)"
          STAGED_LICENSE=0
          if [ ! -e LICENSE ]; then
            cp "${GITHUB_WORKSPACE}/LICENSE" LICENSE
            STAGED_LICENSE=1
          fi
          cleanup_license() {
            if [ "${STAGED_LICENSE}" = '1' ]; then rm -f LICENSE; fi
          }
          trap cleanup_license EXIT
          bun pm pack --destination "${PACK_DIR}" --quiet
          cleanup_license
          trap - EXIT
          mapfile -t TARBALLS < <(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball in ${PACK_DIR}, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"
          echo "Packed: ${TARBALLS[0]}"

      - name: Upload dry-run package
        if: inputs.dry-run && inputs.pack-artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack-artifact }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Publish with npm
        if: inputs.dry-run != true
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA}" != "${CANDIDATE_SHA}" ]; then
            echo "::error::Publishing checkout is ${HEAD_SHA}, expected candidate ${CANDIDATE_SHA}"
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Candidate source was modified after checkout"
            git status --short
            exit 1
          fi

          TAG_ARGS=()
          if [[ "${VERSION}" == *-rc.* ]]; then
            TAG_ARGS=(--tag rc)
          elif [[ "${VERSION}" == *-beta.* ]]; then
            TAG_ARGS=(--tag beta)
          elif [[ "${VERSION}" == *-* ]]; then
            TAG_ARGS=(--tag next)
          fi
          GITHUB_SHA="${HEAD_SHA}" npm publish "${TARBALL}" --provenance --access public "${TAG_ARGS[@]}"
