name: Publish openpalm/paperclip image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Required upstream Paperclip npm version (for example 2026.722.0)."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-paperclip
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # No setup-node: ubuntu-latest ships node+npm, the `npm view` below is the
      # only Node use in this job, and nothing here runs repo JS.
      - name: Verify upstream version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          published=$(npm view "paperclipai@${VERSION}" version)
          if [ "${published}" != "${VERSION}" ]; then
            echo "::error::paperclipai@${VERSION} is not published"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Guard immutable image tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ref="openpalm/paperclip:${VERSION}"
          if output=$(docker manifest inspect "${ref}" 2>&1); then
            echo "::error::${ref} already exists"
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest' <<<"${output}"; then
            echo "::error::Could not verify ${ref}: ${output}"
            exit 1
          fi

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/paperclip
          file: containers/paperclip/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PAPERCLIP_VERSION=${{ inputs.version }}
          tags: openpalm/paperclip:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/paperclipai/paperclip
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=openpalm/paperclip
          cache-to: type=gha,scope=openpalm/paperclip,mode=max

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        run: cosign sign --yes openpalm/paperclip@${{ steps.build.outputs.digest }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/publish-paperclip.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            openpalm/paperclip@${{ steps.build.outputs.digest }}
