name: npm dist-tag repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Restore latest to 0.11.3
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          npm dist-tag add @openpalm/lib@0.11.3 latest
          npm dist-tag add openpalm@0.11.3 latest
          npm dist-tag add @openpalm/ui@0.11.3 latest
