name: Platform release (orchestrator)

# Single manually-dispatched orchestrator for a coordinated platform release.
# It bumps every shipped package to ONE version, runs a fail-fast preflight, and
# publishes the npm layer in dependency order, creating the git tag + GitHub
# release LAST ("tag exists => fully published").
#
# DISPATCH-FROM-MAIN: GitHub only dispatches workflows whose file lives on the
# default branch. This file must be on `main`; supply `ref` to release a release
# branch (e.g. release/0.11.0). The workflow *file* always comes from main; the
# released *content* comes from `ref`.
#
# SCOPE (this increment): version sync + preflight + ALL npm packages + tag-last.
# Docker images, CLI binaries, Electron installers and voice images are still
# produced by release.yml / publish-voice.yml and are folded in next (see
# docs/technical/master-release-workflow-proposal.md, increments 3-5). Run a
# dry_run first: it validates semver, a clean tree, the test gate, the
# independent-version regression guard, an already-published probe, the bump
# plan, and packs every npm package WITHOUT publishing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.11.0 or 0.11.0-rc.18).'
        required: true
        type: string
      ref:
        description: 'Branch/ref to release from (e.g. release/0.11.0).'
        required: true
        type: string
        default: main
      coordinate_independents:
        description: 'Also stamp + publish the independent packages (UI + channel adapters) at this version.'
        required: false
        type: boolean
        default: true
      include_voice:
        description: 'Also (stable only) build + push the voice images. Off by default — voice is normally out-of-band.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate + pack everything but do NOT bump-commit, publish, or tag.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: platform-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (validate, test, guard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate version + resolve prerelease
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const v = process.env.VERSION;
            const re = /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/;
            if (!re.test(v)) { console.error('::error::version must be semver, got ' + v); process.exit(1); }
            const pre = v.includes('-') ? 'true' : 'false';
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\nprerelease=' + pre + '\n');
            console.log('version=' + v + ' prerelease=' + pre);
          "

      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean on ${{ inputs.ref }}."
            git status --porcelain
            exit 1
          fi

      - name: Test gate
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Regression guard + already-published probe
        env:
          VERSION: ${{ inputs.version }}
          COORDINATE: ${{ inputs.coordinate_independents }}
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('node:child_process');
            const groups = JSON.parse(fs.readFileSync('.github/release-package-groups.json', 'utf8'));
            const target = process.env.VERSION;
            const coordinate = process.env.COORDINATE === 'true';

            // semver compare: returns 1 if a>b, -1 if a<b, 0 if equal. Stable > its
            // prerelease; prerelease identifiers compared per semver (numeric dot-parts
            // numerically, so rc.18 > rc.2).
            function parse(v){ const m=String(v).match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/); return m?{ma:+m[1],mi:+m[2],pa:+m[3],pre:m[4]||null}:null; }
            function cmpPre(a,b){ if(a===b) return 0; if(a===null) return 1; if(b===null) return -1;
              const ai=a.split('.'), bi=b.split('.');
              for(let i=0;i<Math.max(ai.length,bi.length);i++){
                if(ai[i]===undefined) return -1; if(bi[i]===undefined) return 1;
                const an=/^[0-9]+$/.test(ai[i]), bn=/^[0-9]+$/.test(bi[i]);
                if(an&&bn){ if(+ai[i]!==+bi[i]) return +ai[i]>+bi[i]?1:-1; }
                else if(ai[i]!==bi[i]) return ai[i]>bi[i]?1:-1;
              }
              return 0; }
            function cmp(a,b){ const x=parse(a),y=parse(b); if(!x||!y) return null;
              for(const k of ['ma','mi','pa']){ if(x[k]!==y[k]) return x[k]>y[k]?1:-1; }
              return cmpPre(x.pre,y.pre); }
            // Highest published version (across all dist-tags), not just 'latest'.
            function maxPublished(name){
              let vs; try { vs=JSON.parse(execSync('npm view ' + name + ' versions --json', {stdio:['ignore','pipe','ignore']}).toString()); } catch { return null; }
              if(!Array.isArray(vs)) vs = vs ? [vs] : [];
              let mx=null; for(const v of vs){ if(mx===null||cmp(v,mx)>0) mx=v; } return mx; }

            const manifests = coordinate ? groups.coordinatedManifests : groups.platformManifests;
            const rows = []; let regressed = false;
            for (const m of manifests) {
              const name = JSON.parse(fs.readFileSync(m, 'utf8')).name;
              const published = maxPublished(name);
              let exact = false;
              if (published !== null) { try { execSync('npm view ' + name + '@' + target + ' version', {stdio:['ignore','pipe','ignore']}); exact = true; } catch {} }
              let status = 'ok';
              if (exact) status = 'ALREADY PUBLISHED (resume: will skip)';
              else if (published !== null) { const c = cmp(target, published); if (c !== null && c <= 0) { status = 'REGRESSION (target <= ' + published + ')'; regressed = true; } }
              rows.push({ name, published: published || '(none)', target, status });
            }
            console.log('\\nPackage'.padEnd(32) + 'published'.padEnd(18) + 'target'.padEnd(18) + 'status');
            for (const r of rows) console.log(r.name.padEnd(32) + r.published.padEnd(18) + r.target.padEnd(18) + r.status);
            const summary = process.env.GITHUB_STEP_SUMMARY;
            if (summary) {
              fs.appendFileSync(summary, '### Release ' + target + ' — package plan\\n\\n');
              fs.appendFileSync(summary, '| package | published | target | status |\\n|---|---|---|---|\\n');
              for (const r of rows) fs.appendFileSync(summary, '| ' + r.name + ' | ' + r.published + ' | ' + r.target + ' | ' + r.status + ' |\\n');
            }
            if (regressed) { console.error('::error::One or more packages would regress (target version <= already-published). Pick a higher version.'); process.exit(1); }
          "

  bump:
    name: Bump + sync versions
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Stamp coordinated manifests + setup scripts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COORDINATE: ${{ inputs.coordinate_independents }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          KEY='platformManifests'
          if [ "${COORDINATE}" = 'true' ]; then KEY='coordinatedManifests'; fi
          mapfile -t MANIFESTS < <(node -p "JSON.parse(require('fs').readFileSync('.github/release-package-groups.json','utf8')).${KEY}.join('\n')")
          for m in "${MANIFESTS[@]}"; do
            node scripts/set-version.mjs "${m}" "${VERSION}"
          done
          sed -i "s/^SCRIPT_VERSION=\".*\"/SCRIPT_VERSION=\"${VERSION}\"/" scripts/setup.sh
          sed -i "s/^\\\$ScriptVersion = '.*'/\$ScriptVersion = '${VERSION}'/" scripts/setup.ps1
          bun install

          if [ "${DRY_RUN}" = 'true' ]; then
            echo "::notice::dry-run — planned version changes (not committed):"
            git --no-pager diff --stat || true
            git checkout -- . 2>/dev/null || true
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet; then
            echo "Already at ${VERSION}; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore(release): set platform version to ${VERSION}"
          git push origin "HEAD:${{ inputs.ref }}"

  npm-lib:
    needs: bump
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/lib
      package-name: '@openpalm/lib'
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-cli:
    needs: npm-lib
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/cli
      package-name: openpalm
      # No build: the CLI npm package is packed as-is (matches release.yml). Its
      # `build` script compiles a native binary (release.yml build-cli-artifacts)
      # and has a broken prebuild; it is not used for the npm publish.
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-sdk:
    needs: npm-lib
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/channels-sdk
      package-name: '@openpalm/channels-sdk'
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-ui:
    needs: bump
    if: ${{ inputs.coordinate_independents }}
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/ui
      package-name: '@openpalm/ui'
      needs-build: true
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-channel-api:
    needs: npm-sdk
    if: ${{ inputs.coordinate_independents }}
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/channel-api
      package-name: '@openpalm/channel-api'
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-channel-discord:
    needs: npm-sdk
    if: ${{ inputs.coordinate_independents }}
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/channel-discord
      package-name: '@openpalm/channel-discord'
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-channel-slack:
    needs: npm-sdk
    if: ${{ inputs.coordinate_independents }}
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/channel-slack
      package-name: '@openpalm/channel-slack'
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  # ── Build layer: runs after npm is green (so a failed npm aborts before any
  # immutable image tag is pushed). Builds happen even on dry_run (push/publish
  # gated off) to validate Dockerfiles/build scripts. ─────────────────────────
  images:
    name: Docker image (${{ matrix.image }})
    needs: [npm-lib, npm-cli, npm-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: core/guardian/Dockerfile
            image: openpalm/guardian
          - dockerfile: core/channel/Dockerfile
            image: openpalm/channel
          - dockerfile: core/assistant/Dockerfile
            image: openpalm/assistant
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
            type=raw,value=v${{ inputs.version }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Dry-run validates the Dockerfile on amd64 only (fast); real cuts go multi-arch.
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  cli:
    name: CLI binary (${{ matrix.artifact }})
    needs: [npm-lib]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            artifact: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            artifact: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            artifact: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            artifact: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI binary
        run: bun run --cwd packages/cli ${{ matrix.script }}
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - packages/cli/dist/${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  electron:
    name: Electron installer (${{ matrix.platform }})
    needs: [npm-lib]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron_flag: --mac
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
          - os: windows-latest
            platform: win
            electron_flag: --win
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI (bundled into the app)
        run: bun run ui:build
      - name: Bundle Electron app
        run: bun run --cwd packages/electron bundle
      - name: Build Electron app
        working-directory: packages/electron
        shell: bash
        run: |
          CLI=$(node -e "console.log(require.resolve('electron-builder/cli.js'))")
          node "$CLI" ${{ matrix.electron_flag }} --publish never
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            packages/electron/dist/packages/*.dmg
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.exe
            packages/electron/dist/packages/*.yml
            packages/electron/dist/packages/*.blockmap

  voice:
    name: Voice image (${{ matrix.tag_suffix }})
    needs: [bump]
    # Stable-only and opt-in; voice is otherwise published out-of-band.
    if: ${{ inputs.include_voice && !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            platforms: linux/amd64,linux/arm64
            tag_suffix: cpu
          - variant: cu121
            platforms: linux/amd64
            tag_suffix: cu121
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Skip heavy build on dry-run
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry-run — would build + push openpalm/voice:{latest,v${{ inputs.version }}}-${{ matrix.tag_suffix }} (${{ matrix.platforms }}); skipping the ~90m build (validated by publish-voice.yml)"
      - uses: docker/setup-qemu-action@v3
        if: ${{ !inputs.dry_run }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.dry_run }}
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        if: ${{ !inputs.dry_run }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: openpalm/voice
          tags: |
            type=raw,value=latest-${{ matrix.tag_suffix }}
            type=raw,value=v${{ inputs.version }}-${{ matrix.tag_suffix }}
      - name: Build and push image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v6
        with:
          context: core/voice
          file: core/voice/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/voice-${{ matrix.variant }}
          cache-to: type=gha,scope=openpalm/voice-${{ matrix.variant }},mode=max

  tag-release:
    name: Tag + GitHub release (LAST)
    needs:
      - preflight
      - npm-lib
      - npm-cli
      - npm-sdk
      - npm-ui
      - npm-channel-api
      - npm-channel-discord
      - npm-channel-slack
      - images
      - cli
      - electron
      - voice
    # Real release only, and only if nothing upstream failed/cancelled (skipped
    # optional jobs — independents off, voice off — are fine).
    if: ${{ !inputs.dry_run && always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build deploy bundle
        run: |
          mkdir -p dist
          tar -czf "dist/openpalm-${{ inputs.version }}-deploy-bundle.tar.gz" \
            .openpalm core packages scripts README.md
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openpalm-cli-*
          path: dist
          merge-multiple: true
      - name: Download Electron artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums-sha256.txt
      - name: Create + push tag (idempotent; refuses to move)
        env:
          TAG: v${{ needs.preflight.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags origin
          HEAD_SHA=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING=$(git rev-list -n1 "${TAG}")
            if [ "${EXISTING}" = "${HEAD_SHA}" ]; then
              echo "Tag ${TAG} already at HEAD — skipping."
            else
              echo "::error::Tag ${TAG} exists at ${EXISTING} but HEAD is ${HEAD_SHA}. Refusing to move it."
              exit 1
            fi
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi
      - name: Delete existing release for clean republish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: OpenPalm v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/openpalm-${{ inputs.version }}-deploy-bundle.tar.gz
            dist/checksums-sha256.txt
            dist/openpalm-cli-linux-x64
            dist/openpalm-cli-linux-arm64
            dist/openpalm-cli-darwin-x64
            dist/openpalm-cli-darwin-arm64
            dist/openpalm-cli-windows-x64.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
