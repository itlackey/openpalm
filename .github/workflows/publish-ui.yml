name: Publish @openpalm/ui
# Standalone release workflow for the independently-versioned UI package.
# Unlike the channel adapters (which use the bare publish-npm-package.yml), the
# UI gets a full release pipeline: unit-test gate -> version bump -> build ->
# npm publish (OIDC provenance) -> GitHub release -> commit the bump back.
#
# NOTE: workflow_dispatch only works when this file exists on the DEFAULT branch
# (main). Dispatching with --ref <branch> runs that branch's copy.
on:
  push:
    branches: [main]
    paths: ['packages/ui/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or bump keyword (major/minor/patch/prerelease). Empty = auto patch-bump only if the current version is already published.'
        required: false
        type: string

permissions:
  contents: write   # commit the version bump + create the GitHub release
  id-token: write   # OIDC provenance for npm publish

# Serialize runs so the bump-commit push can't race another publish.
concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    name: Test, publish, release @openpalm/ui
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Test gate (runs on the current code, BEFORE any bump/publish) ─────────
      # Mirrors ci.yml: vitest includes browser component tests, so chromium must
      # be installed before the unit run. A failure here blocks the publish.
      - name: Install Playwright chromium (for browser component tests)
        run: bun run --cwd packages/ui test:browsers

      - name: Type-check (svelte-check)
        run: bun run ui:check

      - name: Unit tests (vitest)
        run: bun run ui:test:unit

      # ── Resolve version (bump) ───────────────────────────────────────────────
      # Same semantics as the reusable publish-npm-package.yml:
      #   - explicit version or bump keyword (major/minor/patch/prerelease)
      #   - otherwise auto patch-bump ONLY if the current version is already on npm
      #   - otherwise publish the current version as-is
      - name: Resolve version
        working-directory: packages/ui
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          set_version() {
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
              pkg.version = process.argv[1];
              fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            " "$1"
          }

          bump_version() {
            node -e "
              const cur = process.argv[1], type = process.argv[2];
              const m = cur.match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/);
              if (!m) { console.error('Cannot parse version: ' + cur); process.exit(1); }
              let [, ma, mi, pa, pre] = m;
              ma = +ma; mi = +mi; pa = +pa;
              switch (type) {
                case 'major':      console.log(ma+1+'.0.0'); break;
                case 'minor':      console.log(ma+'.'+(mi+1)+'.0'); break;
                case 'patch':      console.log(pre ? ma+'.'+mi+'.'+pa : ma+'.'+mi+'.'+(pa+1)); break;
                case 'prerelease': {
                  if (pre) {
                    const parts = pre.split('.');
                    const last = parseInt(parts[parts.length-1]);
                    if (!isNaN(last)) { parts[parts.length-1] = String(last+1); }
                    else { parts.push('0'); }
                    console.log(ma+'.'+mi+'.'+pa+'-'+parts.join('.'));
                  } else {
                    console.log(ma+'.'+mi+'.'+(pa+1)+'-0');
                  }
                  break;
                }
                default: console.error('Unknown bump type: '+type); process.exit(1);
              }
            " "$1" "$2"
          }

          if [ -n "${EXPLICIT_VERSION}" ]; then
            case "${EXPLICIT_VERSION}" in
              major|minor|patch|prerelease)
                NEW=$(bump_version "${CURRENT}" "${EXPLICIT_VERSION}")
                ;;
              *)
                NEW="${EXPLICIT_VERSION}"
                ;;
            esac
            set_version "${NEW}"
            echo "Set @openpalm/ui from ${CURRENT} to ${NEW}"
            echo "BUMPED=true" >> "$GITHUB_ENV"
          elif npm view "@openpalm/ui@${CURRENT}" version 2>/dev/null; then
            NEW=$(bump_version "${CURRENT}" "patch")
            set_version "${NEW}"
            echo "Bumped @openpalm/ui from ${CURRENT} to ${NEW}"
            echo "BUMPED=true" >> "$GITHUB_ENV"
          else
            NEW="${CURRENT}"
            echo "Publishing current version ${CURRENT} (not yet on npm)"
          fi

          # Export the resolved version + prerelease flag for later steps.
          echo "VERSION=${NEW}" >> "$GITHUB_ENV"
          case "${NEW}" in
            *-*) echo "IS_PRERELEASE=true"  >> "$GITHUB_ENV" ;;
            *)   echo "IS_PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Refresh Bun lockfile workspace metadata
        run: |
          bun update --lockfile-only
          if git diff --quiet -- bun.lock; then
            echo "LOCKFILE_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "LOCKFILE_CHANGED=true" >> "$GITHUB_ENV"
          fi

      # ── Build the adapter-node bundle (files:["build"]) ──────────────────────
      - name: Build UI
        working-directory: packages/ui
        run: bun run build

      - name: Pack with Bun
        working-directory: packages/ui
        run: |
          PACK_DIR="$(mktemp -d)"
          bun pm pack --destination "${PACK_DIR}" --quiet
          mapfile -t TARBALLS < <(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball in ${PACK_DIR}, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "Packed: ${TARBALLS[0]}"

      # ── Publish to npm (OIDC trusted publishing + provenance) ────────────────
      - name: Publish to npm
        working-directory: packages/ui
        run: |
          TAG_ARGS=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            TAG_ARGS="--tag next"
          fi
          npm publish "${TARBALL}" --provenance --access public ${TAG_ARGS} || {
            EXIT_CODE=$?
            # Treat "already published" as success so the bump-commit + release still run.
            if npm view "@openpalm/ui@${VERSION}" version 2>/dev/null; then
              echo "::warning::Version ${VERSION} already published — skipping npm publish"
            else
              exit $EXIT_CODE
            fi
          }

      # ── Commit the version bump back (before tagging the release) ─────────────
      - name: Commit version bump
        if: env.BUMPED == 'true' || env.LOCKFILE_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${BUMPED:-false}" = 'true' ] && [ "${LOCKFILE_CHANGED}" = 'true' ]; then
            MSG="chore(@openpalm/ui): bump to ${VERSION} and sync lockfile"
          elif [ "${BUMPED:-false}" = 'true' ]; then
            MSG="chore(@openpalm/ui): bump to ${VERSION}"
          else
            MSG="chore(@openpalm/ui): sync lockfile for ${VERSION}"
          fi
          git add packages/ui/package.json bun.lock
          git commit -m "${MSG}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "::warning::Version bump commit failed after 5 attempts (package was published successfully)"

      # ── GitHub release (UI-scoped tag, never collides with platform v* tags) ──
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-v${{ env.VERSION }}
          target_commitish: ${{ github.ref_name }}
          name: '@openpalm/ui v${{ env.VERSION }}'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body: |
            `@openpalm/ui@${{ env.VERSION }}` — independently versioned operator UI.

            - **npm:** https://www.npmjs.com/package/@openpalm/ui/v/${{ env.VERSION }} (dist-tag: `${{ env.IS_PRERELEASE == 'true' && 'next' || 'latest' }}`)
            - OpenPalm fetches this build from npm automatically (admin **UI build** picker, or on launch). The attached tarball is for manual/offline use only.
          files: ${{ env.TARBALL }}
          fail_on_unmatched_files: true
