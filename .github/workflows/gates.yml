name: Lean stack gates

on:
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
        default: ''
      candidate_sha:
        required: false
        type: string
        default: ''
      source_artifact:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: Lean stack quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha != '' && inputs.base_sha || github.sha }}
          fetch-depth: 0
      - name: Download release candidate source
        if: inputs.source_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source_artifact }}
          path: .git/release-source
      - name: Restore release candidate
        if: inputs.source_artifact != ''
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ inputs.candidate_sha }}' '${{ inputs.base_sha }}'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the single locked workspace
        run: bun install --frozen-lockfile
      - name: Type check active packages
        run: bun run check
      - name: Test active packages
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build the standalone CLI
        run: bun run --cwd packages/cli build
      - name: Build and validate the optional Claude Desktop extension
        run: bun run --cwd packages/claude-desktop pack
      - name: Verify the embedded lean Skeleton
        run: |
          test "$(tar -tzf packages/cli/embedded/skeleton.tar.gz | wc -l)" = 25
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'system/stack/stack.compose.yml'
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'system/assistant/agents/scheduled.md'
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'config/akm/config.json'
          ! tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -E '(paperclip|voice|core\.compose|services\.compose|portals\.compose)'
      - name: Bundle the optional admin app
        run: bun run --cwd packages/electron bundle
      - name: Validate shell entrypoints
        run: bash -n scripts/dev-setup.sh containers/assistant/entrypoint.lean.sh containers/guardian/entrypoint.lean.sh
      - name: Validate the materialized Compose project
        env:
          OP_HOME: ${{ runner.temp }}/openpalm-ci
          OPENPALM_REPO_ROOT: ${{ github.workspace }}
        run: |
          bun run packages/cli/src/main-lean.ts install --no-start
          docker compose \
            --project-name openpalm-ci \
            --project-directory "${GITHUB_WORKSPACE}" \
            -f "${OP_HOME}/system/stack/stack.compose.yml" \
            -f "${OP_HOME}/config/stack/custom.compose.yml" \
            --env-file "${OP_HOME}/state/stack.env" \
            --profile gateway --profile discord --profile slack \
            config --quiet
      - name: Enforce the lean surface
        run: |
          test "$(jq -r '.workspaces | length' package.json)" = 7
          test "$(find packages/skeleton/system/stack -maxdepth 1 -name 'stack.compose.yml' | wc -l)" = 1
          ! rg -n 'packages/ui|portal-sdk|portal-discord|portal-slack' package.json bun.lock
          ! rg -n '/v1/chat/completions|/v1/messages|/a2a|/oc/' \
            packages/guardian/src/lean-audit.ts \
            packages/guardian/src/lean-content-screen.ts \
            packages/guardian/src/lean-index.ts \
            packages/guardian/src/lean-moderation.ts \
            packages/guardian/src/lean-server.ts \
            packages/guardian/src/mcp-agent.ts
          rg -n -F 'host_ip: "${OP_ASSISTANT_BIND_ADDRESS:-127.0.0.1}"' packages/skeleton/system/stack/stack.compose.yml
          rg -n -F 'host_ip: "${OP_GUARDIAN_BIND_ADDRESS:-127.0.0.1}"' packages/skeleton/system/stack/stack.compose.yml

  images:
    name: Build ${{ matrix.image }} image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: assistant
            file: containers/assistant/Dockerfile.lean
            build_args: PLATFORM_VERSION=ci
          - image: guardian
            file: containers/guardian/Dockerfile
            build_args: GUARDIAN_VERSION=ci
          - image: portal
            file: containers/portal/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha != '' && inputs.base_sha || github.sha }}
      - name: Download release candidate source
        if: inputs.source_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source_artifact }}
          path: .git/release-source
      - name: Restore release candidate
        if: inputs.source_artifact != ''
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ inputs.candidate_sha }}' '${{ inputs.base_sha }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: openpalm/${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=lean-${{ matrix.image }}
          cache-to: type=gha,scope=lean-${{ matrix.image }},mode=max
      - name: Assert a non-root runtime user
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          user="$(docker image inspect "openpalm/${IMAGE}:ci" --format '{{.Config.User}}')"
          test -n "${user}"
          test "${user}" != root
          test "${user}" != 0
