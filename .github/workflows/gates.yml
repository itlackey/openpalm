name: stack gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: stack quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the single locked workspace
        run: bun install --frozen-lockfile
      - name: Audit active application and image dependencies
        run: bun audit
      - name: Type check active packages
        run: bun run check
      - name: Test active packages
        env:
          OPENPALM_SOCKET_TESTS: '1'
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build the standalone CLI
        run: bun run --cwd packages/cli build
      - name: Build and validate the optional Claude Desktop extension
        run: bun run --cwd packages/claude-desktop pack
      - name: Verify the embedded Skeleton
        run: |
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'system/stack/stack.compose.yml'
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'system/assistant/agents/scheduled.md'
          tar -tzf packages/cli/embedded/skeleton.tar.gz | grep -qx 'config/akm/config.json'
      - name: Bundle the optional admin app
        run: bun run --cwd packages/electron bundle
      - name: Validate shell entrypoints
        run: bash -n scripts/dev-setup.sh scripts/setup.sh scripts/smoke-image.sh containers/assistant/entrypoint.sh containers/assistant/healthcheck.sh containers/assistant/opencode-run.sh containers/guardian/entrypoint.sh
      - name: Validate the materialized Compose project
        env:
          OP_HOME: ${{ runner.temp }}/openpalm-ci
          OPENPALM_REPO_ROOT: ${{ github.workspace }}
        run: |
          bun run packages/cli/src/main.ts install --no-start
          docker compose \
            --project-name openpalm-ci \
            --project-directory "${GITHUB_WORKSPACE}" \
            -f "${OP_HOME}/system/stack/stack.compose.yml" \
            -f "${OP_HOME}/config/stack/custom.compose.yml" \
            --env-file "${OP_HOME}/state/stack.env" \
            --profile gateway --profile discord --profile slack \
            config --quiet

  images:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        image: [assistant, guardian, portal]
        include:
          - image: assistant
            file: containers/assistant/Dockerfile
            build_args: PLATFORM_VERSION=ci
          - image: guardian
            file: containers/guardian/Dockerfile
            build_args: GUARDIAN_VERSION=ci
          - image: portal
            file: containers/portal/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: openpalm/${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=OpenPalm-${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=OpenPalm-${{ matrix.image }}-${{ matrix.platform }},mode=max
      - name: Assert a non-root runtime user
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          user="$(docker image inspect "openpalm/${IMAGE}:ci" --format '{{.Config.User}}')"
          test -n "${user}"
          test "${user}" != root
          test "${user}" != 0
      - name: Report all high and critical runtime image advisories
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openpalm/${{ matrix.image }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Reject every critical runtime image advisory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openpalm/${{ matrix.image }}:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Reject fixable high runtime image advisories
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openpalm/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Run image startup and security smoke
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/smoke-image.sh "openpalm/${IMAGE}:ci" "${IMAGE}"
