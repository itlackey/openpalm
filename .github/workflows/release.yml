name: Release

# Single manually-dispatched orchestrator for releasing OpenPalm by deployment UNIT.
#
# Units:
#   platform  — @openpalm/lib + openpalm (CLI) + @openpalm/ui (npm) + admin-tools +
#               CLI native binaries + optional Electron + git tag + GitHub release
#   portals   — openpalm/portal image + openpalm/guardian image (baked adapters,
#               NOT on npm; private packages) + git tag + GitHub release
#   assistant — openpalm/assistant image + git tag + GitHub release
#   guardian  — openpalm/guardian image (standalone; released separately when its own
#               deps need updating) + git tag + GitHub release
#   major     — all units simultaneously, bumps major, resets all to X.0.0 + summary tag
#
# No version input — bump type drives the next version computed from the unit's anchor.
# Tag scheme: platform-X.Y.Z, portals-X.Y.Z, assistant-X.Y.Z, guardian-X.Y.Z, vX.0.0 (major summary).
# Docker images: openpalm/assistant:vX.Y.Z, openpalm/portal:vX.Y.Z, openpalm/guardian:vX.Y.Z
#
# npm OIDC: all npm publishes go through publish-npm-package.yml (single top-level caller).
# Docker-only units (portals/assistant/guardian) skip npm jobs entirely.
#
# TAG-LAST: the git tag + GitHub release are created LAST ("tag exists = fully published").
# Always run with dry_run=true first to validate the plan without committing.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'Unit to release'
        required: true
        type: choice
        options: [platform, portals, assistant, guardian, major]
      bump:
        description: 'Semver increment (ignored for unit=major)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      include_electron:
        description: 'Build and publish Electron installer (platform only; always included for major)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build without publishing, committing, or tagging'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.unit }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Compute the next version from the unit anchor (no writes) ─────────────────
  compute-version:
    name: Compute version (${{ inputs.unit }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      current_version: ${{ steps.bump.outputs.current_version }}
      tag_prefix: ${{ steps.bump.outputs.tag_prefix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compute next version
        id: bump
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'false'
        run: node scripts/bump-unit.mjs

      - name: Resolve prerelease flag
        id: meta
        run: |
          V="${{ steps.bump.outputs.new_version }}"
          if echo "${V}" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regression guard (npm packages)
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const target = process.env.VERSION;
            const unit = process.env.UNIT;

            // Only npm-published units need a regression guard
            if (!['platform', 'major'].includes(unit)) {
              console.log('Docker-only unit — skipping npm regression guard.');
              process.exit(0);
            }

            const npmPackages = {
              platform: ['@openpalm/lib', 'openpalm', '@openpalm/ui'],
              major: ['@openpalm/lib', 'openpalm', '@openpalm/ui'],
            };
            const packages = npmPackages[unit] || [];

            function parse(v) {
              const m = String(v).match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?\$/);
              return m ? { ma: +m[1], mi: +m[2], pa: +m[3], pre: m[4] || null } : null;
            }
            function cmpPre(a, b) {
              if (a === b) return 0; if (a === null) return 1; if (b === null) return -1;
              const ai = a.split('.'), bi = b.split('.');
              for (let i = 0; i < Math.max(ai.length, bi.length); i++) {
                if (ai[i] === undefined) return -1; if (bi[i] === undefined) return 1;
                const an = /^[0-9]+\$/.test(ai[i]), bn = /^[0-9]+\$/.test(bi[i]);
                if (an && bn) { if (+ai[i] !== +bi[i]) return +ai[i] > +bi[i] ? 1 : -1; }
                else if (ai[i] !== bi[i]) return ai[i] > bi[i] ? 1 : -1;
              }
              return 0;
            }
            function cmp(a, b) {
              const x = parse(a), y = parse(b); if (!x || !y) return null;
              for (const k of ['ma', 'mi', 'pa']) { if (x[k] !== y[k]) return x[k] > y[k] ? 1 : -1; }
              return cmpPre(x.pre, y.pre);
            }
            function maxPublished(name) {
              let vs;
              try { vs = JSON.parse(execSync('npm view ' + name + ' versions --json', { stdio: ['ignore', 'pipe', 'ignore'] }).toString()); }
              catch { return null; }
              if (!Array.isArray(vs)) vs = vs ? [vs] : [];
              let mx = null;
              for (const v of vs) { if (mx === null || cmp(v, mx) > 0) mx = v; }
              return mx;
            }

            let regressed = false;
            for (const name of packages) {
              const published = maxPublished(name);
              let status = 'ok';
              if (published !== null) {
                const c = cmp(target, published);
                if (c !== null && c <= 0) { status = 'REGRESSION (target <= ' + published + ')'; regressed = true; }
                else status = 'ok (published: ' + published + ')';
              } else {
                status = 'ok (not yet published)';
              }
              console.log(name.padEnd(28) + target.padEnd(14) + status);
            }
            if (regressed) {
              console.error('::error::One or more packages would regress. The computed next version is <= already-published.');
              process.exit(1);
            }
          "

  # ── Preflight gate (platform + major only) ────────────────────────────────────
  preflight:
    name: Preflight (test gate)
    needs: compute-version
    if: inputs.unit == 'platform' || inputs.unit == 'major'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Working tree must be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean. Commit or stash changes before releasing."
            git status --porcelain
            exit 1
          fi

      - name: Install + test
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run ui:check
          bun run electron:test

  # ── Stamp + commit + push the new version ─────────────────────────────────────
  bump:
    name: Stamp ${{ needs.compute-version.outputs.new_version }}
    needs: [compute-version, preflight]
    if: always() && needs.compute-version.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Stamp unit files
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'true'
        run: |
          node scripts/bump-unit.mjs
          bun install

      - name: Preview (dry-run — no commit)
        if: inputs.dry_run
        run: |
          echo "::notice::dry-run — planned changes (not committed):"
          git --no-pager diff --stat || true
          git checkout -- . 2>/dev/null || true

      - name: Commit + push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet; then
            echo "Already at ${VERSION}; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore(release): stamp ${UNIT} to ${VERSION}"
          # Retry with rebase to handle concurrent pushes to the same branch
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

  # ── npm layer: lib → cli → ui (platform + major only) ────────────────────────
  npm-lib:
    name: npm @openpalm/lib
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'major')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/lib
      package-name: '@openpalm/lib'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-cli:
    name: npm openpalm (CLI)
    needs: [compute-version, bump, npm-lib]
    if: always() && needs.bump.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'major')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/cli
      package-name: openpalm
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-ui:
    name: npm @openpalm/ui
    needs: [compute-version, bump, npm-lib]
    if: always() && needs.bump.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'major')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/ui
      package-name: '@openpalm/ui'
      needs-build: true
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  # ── Docker images ─────────────────────────────────────────────────────────────
  # portal + guardian: built for unit=portals, unit=guardian (guardian standalone),
  #                    and unit=major
  docker-portal:
    name: Docker openpalm/portal
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'major')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/portal
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=v${{ needs.compute-version.outputs.new_version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/portal/Dockerfile
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/portal
          cache-to: type=gha,scope=openpalm/portal,mode=max

  docker-guardian:
    name: Docker openpalm/guardian
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'guardian' || inputs.unit == 'major')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/guardian
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=v${{ needs.compute-version.outputs.new_version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/guardian/Dockerfile
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/guardian
          cache-to: type=gha,scope=openpalm/guardian,mode=max

  docker-assistant:
    name: Docker openpalm/assistant
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'assistant' || inputs.unit == 'major')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/assistant
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=v${{ needs.compute-version.outputs.new_version }}
      - name: Assistant image smoke (amd64 only)
        run: |
          docker build -f containers/assistant/Dockerfile -t openpalm-assistant-smoke:${{ github.run_id }} .
          docker run --rm --entrypoint bash openpalm-assistant-smoke:${{ github.run_id }} \
            -lc 'codex --version && claude --version && pi --version && copilot --version'
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/assistant/Dockerfile
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/assistant
          cache-to: type=gha,scope=openpalm/assistant,mode=max

  # ── CLI native binaries (platform + major) ────────────────────────────────────
  cli:
    name: CLI binary (${{ matrix.artifact }})
    needs: [compute-version, bump, npm-lib, npm-cli, npm-ui]
    if: always() && needs.bump.result == 'success' && needs.npm-lib.result == 'success' && needs.npm-cli.result == 'success' && needs.npm-ui.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'major')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            artifact: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            artifact: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            artifact: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            artifact: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI binary
        run: bun run --cwd packages/cli ${{ matrix.script }}
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - packages/cli/dist/${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  # ── Electron installer (platform/major: gated; major: always) ─────────────────
  electron:
    name: Electron (${{ matrix.platform }})
    needs: [compute-version, bump, npm-lib, npm-cli, npm-ui]
    if: |
      always() &&
      needs.bump.result == 'success' &&
      needs.npm-lib.result == 'success' &&
      needs.npm-cli.result == 'success' &&
      needs.npm-ui.result == 'success' &&
      (inputs.unit == 'major' || (inputs.unit == 'platform' && (inputs.include_electron == true || inputs.bump != 'patch')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron_flag: --mac
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
          - os: windows-latest
            platform: win
            electron_flag: --win
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI
        run: bun run ui:build
      - name: Bundle Electron app
        run: bun run --cwd packages/electron bundle
      - name: Build Electron installer
        working-directory: packages/electron
        shell: bash
        run: |
          CLI=$(node -e "console.log(require.resolve('electron-builder/cli.js'))")
          node "$CLI" ${{ matrix.electron_flag }} --publish never
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip

  # ── Git tag + GitHub release (LAST — tag exists = fully published) ────────────
  tag-release:
    name: Tag + GitHub release (LAST)
    needs:
      - compute-version
      - bump
      - npm-lib
      - npm-cli
      - npm-ui
      - docker-portal
      - docker-guardian
      - docker-assistant
      - cli
      - electron
    if: |
      always() &&
      !inputs.dry_run &&
      needs.bump.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deploy bundle
        run: |
          VERSION="${{ needs.compute-version.outputs.new_version }}"
          UNIT="${{ inputs.unit }}"
          mkdir -p dist
          tar -czf "dist/openpalm-${UNIT}-${VERSION}-deploy-bundle.tar.gz" \
            .openpalm containers packages portals scripts README.md

      - name: Download CLI artifacts
        if: inputs.unit == 'platform' || inputs.unit == 'major'
        uses: actions/download-artifact@v8
        with:
          pattern: openpalm-cli-*
          path: dist
          merge-multiple: true

      - name: Download Electron artifacts
        if: inputs.unit == 'platform' || inputs.unit == 'major'
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          if ls dist/* >/dev/null 2>&1; then
            cd dist && sha256sum * > checksums-sha256.txt
          fi

      - name: Create + push tags
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags origin

          create_tag() {
            local TAG="$1"
            local MSG="$2"
            HEAD_SHA=$(git rev-parse HEAD)
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              EXISTING=$(git rev-list -n1 "${TAG}")
              if [ "${EXISTING}" = "${HEAD_SHA}" ]; then
                echo "Tag ${TAG} already at HEAD — skipping."
              else
                echo "::error::Tag ${TAG} exists at ${EXISTING} but HEAD is ${HEAD_SHA}. Refusing to move it."
                exit 1
              fi
            else
              git tag -a "${TAG}" -m "${MSG}"
              git push origin "${TAG}"
              echo "Created tag: ${TAG}"
            fi
          }

          if [ "${UNIT}" = 'major' ]; then
            # All per-unit prefixed tags + vX.0.0 summary
            for PREFIX in platform portals assistant guardian; do
              create_tag "${PREFIX}-${VERSION}" "Release ${PREFIX} ${VERSION}"
            done
            create_tag "v${VERSION}" "Major release v${VERSION}"
          else
            create_tag "${UNIT}-${VERSION}" "Release ${UNIT} ${VERSION}"
          fi

      - name: Create GitHub releases
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          PRERELEASE: ${{ needs.compute-version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          create_release() {
            local TAG="$1"
            local TITLE="$2"
            # Delete existing draft/release at this tag to allow clean republish
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --yes
            fi
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes \
              $( [ "${PRERELEASE}" = 'true' ] && echo '--prerelease' ) \
              dist/* 2>/dev/null || true
            echo "Created GitHub release: ${TAG}"
          }

          if [ "${UNIT}" = 'major' ]; then
            for PREFIX in platform portals assistant guardian; do
              create_release "${PREFIX}-${VERSION}" "OpenPalm ${PREFIX} ${VERSION}"
            done
            create_release "v${VERSION}" "OpenPalm v${VERSION} (major)"
          else
            create_release "${UNIT}-${VERSION}" "OpenPalm ${UNIT} ${VERSION}"
          fi
