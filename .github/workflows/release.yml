name: Release OpenPalm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-stamped product version (for example 0.14.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-OpenPalm-openpalm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Validate the stamped release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { parseSemver } from './scripts/set-version.mjs';
          const version = process.env.VERSION ?? '';
          const parsed = parseSemver(version);
          if (!parsed) throw new Error(`Invalid version: ${version}`);
          if (process.env.DRY_RUN !== 'true' &&
              process.env.RELEASE_REF !== 'refs/heads/main' &&
              !process.env.RELEASE_REF.startsWith('refs/heads/release/')) {
            throw new Error('Live releases are restricted to main and release/* branches');
          }
          const release = JSON.parse(readFileSync('.github/release-manifest.json', 'utf8'));
          const manifests = release.manifests;
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, 'utf8')).version;
            if (actual !== version) throw new Error(`${manifest} is ${actual}; expected ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${parsed.pre !== null}\n`);
          NODE

  gates:
    needs: validate
    uses: ./.github/workflows/gates.yml

  images:
    name: Publish ${{ matrix.image }} image
    needs: [validate, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: assistant
            file: containers/assistant/Dockerfile
            build_args: PLATFORM_VERSION=${{ needs.validate.outputs.version }}
          - image: guardian
            file: containers/guardian/Dockerfile
            build_args: GUARDIAN_VERSION=${{ needs.validate.outputs.version }}
          - image: portal
            file: containers/portal/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: openpalm/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          build-args: ${{ matrix.build_args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@v4.1.2
        if: inputs.dry_run != true
        with:
          cosign-release: v3.0.6
      - name: Sign the immutable manifest
        if: inputs.dry_run != true
        run: cosign sign --yes openpalm/${{ matrix.image }}@${{ steps.build.outputs.digest }}

  cli:
    name: Build CLI ${{ matrix.asset }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            asset: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            asset: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            asset: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            asset: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            asset: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/cli ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: packages/cli/dist/${{ matrix.asset }}

  admin:
    name: Build optional admin for ${{ matrix.platform }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: build:mac
          - os: ubuntu-latest
            platform: linux
            script: build:linux
          - os: windows-latest
            platform: windows
            script: build:win
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/electron ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-admin-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip
            packages/electron/dist/packages/*.exe

  claude-extension:
    name: Build optional Claude Desktop extension
    needs: [validate, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/claude-desktop pack
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-claude-desktop
          if-no-files-found: error
          path: packages/claude-desktop/artifacts/openpalm-claude-desktop-${{ needs.validate.outputs.version }}.mcpb

  release:
    needs: [validate, images, cli, admin, claude-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: openpalm-*
          path: dist
          merge-multiple: true
      - name: Verify the Claude Desktop extension is present
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: test -f "dist/openpalm-claude-desktop-${VERSION}.mcpb"
      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums-sha256.txt
      - name: Write manifest and validate the complete release
        env:
          RELEASE_ASSETS_DIR: dist
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/validate-release-assets.mjs --write-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPalm-release-assets
          path: dist
      - name: Publish immutable Gitea release
        if: inputs.dry_run != true
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          test -n "${GITEA_TOKEN}"
          payload="$(jq -n \
            --arg tag "${VERSION}" \
            --arg target "${RELEASE_SHA}" \
            --arg name "OpenPalm ${VERSION}" \
            --arg body "OpenPalm ${VERSION}. Verify downloads with checksums-sha256.txt." \
            --argjson prerelease "${PRERELEASE}" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:$prerelease}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${GITEA_SERVER_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases")"
          release_id="$(jq -er '.id' <<<"${response}")"
          for asset in dist/*; do
            name="$(basename "${asset}")"
            encoded_name="$(jq -rn --arg value "${name}" '$value|@uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token ${GITEA_TOKEN}" \
              --form "attachment=@${asset}" \
              "${GITEA_SERVER_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/${release_id}/assets?name=${encoded_name}" \
              >/dev/null
          done

  publish-bootstrap:
    needs: [validate, release]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the zero-dependency CLI bootstrap
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "openpalm@${VERSION}" version >/dev/null 2>&1; then
            echo "openpalm@${VERSION} already exists"
            exit 0
          fi
          tag=latest
          case "${VERSION}" in
            *-beta.*) tag=beta ;;
            *-rc.*) tag=rc ;;
            *-*) tag=next ;;
          esac
          npm publish --provenance --access public --tag "${tag}"
