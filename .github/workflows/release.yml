name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0). Required for real releases; optional for dry runs (defaults to current package.json version).'
        required: false
        type: string
      dry_run:
        description: 'Dry run: build all artifacts but skip version bumping, tag creation, Docker push, GitHub release, and npm publish.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    name: Prepare release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # actions/checkout@v4 extraheader auth is not reliably picked up by
          # subsequent git pull/push in shell steps (manifests as "could not
          # read Username for https://github.com"). Embed the token in the
          # remote URL directly — this is the workaround GitHub itself
          # recommends.
          git remote set-url origin "https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup Bun
        if: github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2

      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${EVENT_NAME}" = 'push' ]; then
            TAG="${REF_NAME}"
            DRY_RUN='false'
          else
            if [ "${DRY_RUN}" = 'true' ]; then
              # Dry run: use branch as checkout ref, fall back to package.json version
              TAG="${GITHUB_REF_NAME}"
              VERSION="${INPUT_VERSION:-$(jq -r .version package.json)}"
            else
              VERSION="${INPUT_VERSION}"
              if [ -z "${VERSION}" ]; then
                echo '::error::version is required for real releases.'
                exit 1
              fi
              if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
                echo 'Invalid version. Must be semver like 1.2.3 or 1.2.3-rc1.'
                exit 1
              fi
              TAG="v${VERSION}"
            fi
          fi

          VERSION="${VERSION:-${TAG#v}}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid version ${VERSION}. Must be semver like 1.2.3 or 1.2.3-rc1."
            exit 1
          fi
          if echo "${VERSION}" | grep -Eq -- '-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$'; then
            PRERELEASE='true'
          else
            PRERELEASE='false'
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Prepare platform release state
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: skipping version bump and tag creation."
            exit 0
          fi

          mapfile -t PLATFORM_MANIFESTS_ARR < <(jq -r '.platformManifests[]' .github/release-package-groups.json)
          PLATFORM_MANIFESTS="${PLATFORM_MANIFESTS_ARR[*]}"

          if [ "${EVENT_NAME}" = 'workflow_dispatch' ]; then
            BRANCH="${GITHUB_REF_NAME}"

            # Ensure we are on the branch (workflow dispatch can start from any ref)
            git checkout "${BRANCH}"
            git pull --ff-only origin "${BRANCH}"

            for pkg in ${PLATFORM_MANIFESTS}; do
              jq --arg v "${VERSION}" '.version = $v' "${pkg}" > "${pkg}.tmp" && mv "${pkg}.tmp" "${pkg}"
              echo "Set ${pkg} to ${VERSION}"
            done

            # Stamp install scripts to the platform release tag.
            sed -i "s/^SCRIPT_VERSION=\".*\"/SCRIPT_VERSION=\"${VERSION}\"/" scripts/setup.sh
            sed -i "s/^\\\$ScriptVersion = '.*'/\$ScriptVersion = '${VERSION}'/" scripts/setup.ps1
            echo "Stamped SCRIPT_VERSION=${VERSION} into setup scripts"

            # Regenerate bun.lock so workspace package versions in the
            # lockfile match the bumped manifests. Without this, downstream
            # jobs running `bun install --frozen-lockfile` fail to resolve.
            bun install

            if git diff --quiet -- ${PLATFORM_MANIFESTS} scripts/setup.sh scripts/setup.ps1 bun.lock; then
              echo "Release files already match ${VERSION}, skipping commit."
              exit 0
            fi

            git add ${PLATFORM_MANIFESTS} scripts/setup.sh scripts/setup.ps1 bun.lock
            git commit -m "chore: bump platform version to ${VERSION}"
            git push origin "${BRANCH}"
            exit 0
          fi

          for pkg in ${PLATFORM_MANIFESTS}; do
            CURRENT=$(jq -r .version "${pkg}")
            if [ "${CURRENT}" != "${VERSION}" ]; then
              echo "${pkg} version ${CURRENT} does not match release ${VERSION}."
              echo 'Create the tag from a commit with synchronized platform versions.'
              exit 1
            fi
          done

          if ! grep -Eq '^SCRIPT_VERSION="'"${VERSION}"'"$' scripts/setup.sh; then
            echo "scripts/setup.sh SCRIPT_VERSION does not match release ${VERSION}."
            exit 1
          fi

          if ! grep -Eq "^\\\$ScriptVersion = '${VERSION}'$" scripts/setup.ps1; then
            echo "scripts/setup.ps1 ScriptVersion does not match release ${VERSION}."
            exit 1
          fi

          echo "Release tag ${VERSION} matches platform manifests and setup scripts."

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git checkout "${BRANCH}"

          # Idempotent for republish: fetch remote tags so we see prior pushes,
          # then skip creation if the tag already points at HEAD. Refuse to
          # silently move a tag that points elsewhere.
          git fetch --tags origin
          HEAD_SHA=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING=$(git rev-list -n1 "${TAG}")
            if [ "${EXISTING}" = "${HEAD_SHA}" ]; then
              echo "Tag ${TAG} already at HEAD (${HEAD_SHA}) — republish, skipping tag creation."
              exit 0
            fi
            echo "::error::Tag ${TAG} exists at ${EXISTING} but HEAD is ${HEAD_SHA}. Refusing to move the tag — delete it manually if you really intend to retag, or pick a new version."
            exit 1
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  push-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - prepare-tag
    strategy:
      # Independent artifacts: one runner's transient failure (registry
      # timeout, flaky index) must not cancel its siblings — re-run only the
      # failed leg. Matches the voice job below.
      fail-fast: false
      matrix:
        include:
          - dockerfile: core/guardian/Dockerfile
            image: openpalm/guardian
          - dockerfile: core/channel/Dockerfile
            image: openpalm/channel
          - dockerfile: core/assistant/Dockerfile
            image: openpalm/assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: needs.prepare-tag.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ needs.prepare-tag.outputs.prerelease != 'true' }}
            type=raw,value=v${{ needs.prepare-tag.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare-tag.outputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  push-voice-images:
    name: Build and push voice Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Voice images are additive — operators can install the rest of the
    # stack even if a voice build fails. This job is intentionally NOT a
    # dependency of `release`, so a voice build failure won't block the
    # GitHub release page or npm publishes.
    needs:
      - prepare-tag
    strategy:
      # Don't let a cu121 failure cancel the cpu build (or vice versa) —
      # operators on Apple Silicon need at least the cpu+arm64 image.
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            platforms: linux/amd64,linux/arm64
            tag_suffix: cpu
          # cu121 is amd64-only: PyTorch CUDA wheels and onnxruntime-gpu
          # do not publish linux/arm64 builds, so an arm64 image would
          # fail at pip install time.
          - variant: cu121
            platforms: linux/amd64
            tag_suffix: cu121

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: needs.prepare-tag.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: openpalm/voice
          tags: |
            type=raw,value=latest-${{ matrix.tag_suffix }},enable=${{ needs.prepare-tag.outputs.prerelease != 'true' }}
            type=raw,value=v${{ needs.prepare-tag.outputs.version }}-${{ matrix.tag_suffix }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: core/voice
          file: core/voice/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ needs.prepare-tag.outputs.dry_run != 'true' }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache scopes are per-variant so cpu and cu121 don't clobber
          # each other's wheel layers (different torch/onnxruntime builds).
          cache-from: type=gha,scope=openpalm/voice-${{ matrix.variant }}
          cache-to: type=gha,scope=openpalm/voice-${{ matrix.variant }},mode=max

  build-ui-artifact:
    name: Build UI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare-tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run ui:build

      - name: Package UI build
        run: tar -czf ui-build.tar.gz -C packages/ui/build .

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui-build.tar.gz

  build-cli-artifacts:
    name: Build CLI artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: prepare-tag
    strategy:
      # Independent artifacts: one runner's transient failure (registry
      # timeout, flaky index) must not cancel its siblings — re-run only the
      # failed leg. Matches the voice job below.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            artifact: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            artifact: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            artifact: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            artifact: openpalm-cli-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binary
        run: bun run --cwd packages/cli ${{ matrix.script }}

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - packages/cli/dist/${{ matrix.artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  build-electron-artifacts:
    name: Build Electron artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: prepare-tag
    strategy:
      # Independent artifacts: one runner's transient failure (registry
      # timeout, flaky index) must not cancel its siblings — re-run only the
      # failed leg. Matches the voice job below.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron_flag: --mac
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
          - os: windows-latest
            platform: win
            electron_flag: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle Electron app
        # bun build --bundle inlines @openpalm/lib and all other deps so
        # electron-builder finds no npm dependencies to install — avoiding
        # the workspace: protocol incompatibility with npm.
        run: bun run --cwd packages/electron bundle

      - name: Build Electron app
        # Must run via node, not bun: electron-builder spawns workers using
        # process.execPath; bun sets that to the ELF binary, causing Node.js
        # to fail when trying to parse the binary as JavaScript.
        # Resolving via require.resolve handles both hoisted (root) and
        # workspace-local installs — newer electron-builder versions are not
        # hoisted by Bun.
        # Use --publish never always: electron-builder's GH publisher 401s
        # on republish (can't read existing release assets with GITHUB_TOKEN),
        # and softprops/action-gh-release in the release job already handles
        # the upload from artifact downloads. Centralizing uploads in one
        # place also avoids electron-builder + softprops asset duplication.
        working-directory: packages/electron
        shell: bash
        run: |
          CLI=$(node -e "console.log(require.resolve('electron-builder/cli.js'))")
          node "$CLI" ${{ matrix.electron_flag }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          # Include installers, auto-update metadata (.yml), and delta files
          # (.blockmap) so the release job can upload everything via softprops.
          path: |
            packages/electron/dist/packages/*.dmg
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.exe
            packages/electron/dist/packages/*.yml
            packages/electron/dist/packages/*.blockmap

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - prepare-tag
      - push-images
      - build-cli-artifacts
      - build-ui-artifact
      - build-electron-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Build release artifact bundle
        run: |
          mkdir -p dist
          tar -czf dist/openpalm-${{ needs.prepare-tag.outputs.version }}-deploy-bundle.tar.gz \
            .openpalm \
            core \
            packages \
            scripts \
            README.md

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openpalm-cli-*
          path: dist
          merge-multiple: true

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: dist

      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt

      # softprops/action-gh-release cannot reliably UPDATE an existing release:
      # on a re-cut (tag moved / job re-run) it aborts finalizing with
      # "already_exists / tag_name" and leaves the release with zero assets.
      # Delete any existing release for this tag first — keeping the git tag
      # (no --cleanup-tag) — so the create below always runs against a clean
      # slate. Idempotent: a no-op on first publish.
      - name: Delete existing release for clean republish
        if: needs.prepare-tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-tag.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Existing release ${TAG} found — deleting (tag preserved) for clean republish…"
            gh release delete "${TAG}" --yes
          else
            echo "No existing release ${TAG} — first publish."
          fi

      - name: Create GitHub release
        if: needs.prepare-tag.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.tag }}
          name: OpenPalm ${{ needs.prepare-tag.outputs.tag }}
          prerelease: ${{ needs.prepare-tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Desktop App

            Download the desktop app for your platform from the release assets below:

            | Platform | Download |
            |---|---|
            | macOS (Apple Silicon) | `OpenPalm-${{ needs.prepare-tag.outputs.version }}-arm64.dmg` |
            | macOS (Intel) | `OpenPalm-${{ needs.prepare-tag.outputs.version }}-x64.dmg` |
            | Linux x64 | `OpenPalm-${{ needs.prepare-tag.outputs.version }}.AppImage` |
            | Linux arm64 | `OpenPalm-${{ needs.prepare-tag.outputs.version }}-arm64.AppImage` |
            | Windows x64 | `OpenPalm Setup ${{ needs.prepare-tag.outputs.version }}.exe` |

            ## Docker Images

            | Image | Pull command |
            |---|---|
            | [openpalm/assistant](https://hub.docker.com/r/openpalm/assistant) | `docker pull openpalm/assistant:v${{ needs.prepare-tag.outputs.version }}` |
            | [openpalm/guardian](https://hub.docker.com/r/openpalm/guardian) | `docker pull openpalm/guardian:v${{ needs.prepare-tag.outputs.version }}` |
            | [openpalm/channel](https://hub.docker.com/r/openpalm/channel) | `docker pull openpalm/channel:v${{ needs.prepare-tag.outputs.version }}` |
            | [openpalm/voice (CPU)](https://hub.docker.com/r/openpalm/voice) | `docker pull openpalm/voice:v${{ needs.prepare-tag.outputs.version }}-cpu` |
            | [openpalm/voice (CUDA 12.1)](https://hub.docker.com/r/openpalm/voice) | `docker pull openpalm/voice:v${{ needs.prepare-tag.outputs.version }}-cu121` |

            ## npm Packages

            ```bash
            bun install -g openpalm@${{ needs.prepare-tag.outputs.version }}
            bun add @openpalm/lib@${{ needs.prepare-tag.outputs.version }}
            bun add @openpalm/channels-sdk@${{ needs.prepare-tag.outputs.version }}
            ```

            ## Quick Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/itlackey/openpalm/v${{ needs.prepare-tag.outputs.version }}/scripts/setup.sh | bash
            ```

            ## Out-of-band UI update

            To update only the admin UI without a full `openpalm update`:
            ```bash
            curl -fsSL https://github.com/itlackey/openpalm/releases/download/v${{ needs.prepare-tag.outputs.version }}/ui-build.tar.gz \
              | tar xz --strip-components=0 -C ~/.openpalm/data/ui/
            ```

            ## What's Changed
          files: |
            dist/openpalm-${{ needs.prepare-tag.outputs.version }}-deploy-bundle.tar.gz
            dist/ui-build.tar.gz
            dist/checksums-sha256.txt
            dist/openpalm-cli-linux-x64
            dist/openpalm-cli-linux-arm64
            dist/openpalm-cli-darwin-x64
            dist/openpalm-cli-darwin-arm64
            dist/openpalm-cli-windows-x64.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  publish-lib-npm:
    name: Publish lib to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare-tag.outputs.dry_run != 'true'
    needs:
      - prepare-tag
      - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack lib
        working-directory: packages/lib
        run: |
          PACK_DIR="$(mktemp -d)"
          bun pm pack --destination "${PACK_DIR}" --quiet
          mapfile -t TARBALLS < <(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "Packed: ${TARBALLS[0]}"

      - name: Publish to npm
        working-directory: packages/lib
        run: |
          VERSION="${{ needs.prepare-tag.outputs.version }}"
          TAG_ARGS=""
          if [ "${{ needs.prepare-tag.outputs.prerelease }}" = "true" ]; then
            TAG_ARGS="--tag next"
          fi
          npm publish "${TARBALL}" --provenance --access public ${TAG_ARGS} || {
            EXIT_CODE=$?
            if npm view "@openpalm/lib@${VERSION}" version 2>/dev/null; then
              echo "::warning::Version ${VERSION} already published — skipping"
            else
              exit $EXIT_CODE
            fi
          }

  publish-cli-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare-tag.outputs.dry_run != 'true'
    needs:
      - prepare-tag
      - release
      - publish-lib-npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify lib version is available on npm
        run: |
          VERSION="${{ needs.prepare-tag.outputs.version }}"
          MAX_ATTEMPTS=5
          DELAY_SECONDS=5
          attempt=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if npm view "@openpalm/lib@${VERSION}" version >/dev/null 2>&1; then
              echo "@openpalm/lib@${VERSION} is available on npm (attempt ${attempt})."
              break
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting for @openpalm/lib@${VERSION} to be available on npm (attempt ${attempt}/${MAX_ATTEMPTS})..."
              sleep "$DELAY_SECONDS"
            fi

            attempt=$((attempt + 1))
          done

          if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
            echo "::error::Expected @openpalm/lib@${VERSION} to be available before publishing CLI after ${MAX_ATTEMPTS} attempts with ${DELAY_SECONDS}s delay."
            exit 1
          fi

      - name: Pack CLI
        working-directory: packages/cli
        run: |
          PACK_DIR="$(mktemp -d)"
          bun pm pack --destination "${PACK_DIR}" --quiet
          mapfile -t TARBALLS < <(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "Packed: ${TARBALLS[0]}"

      - name: Publish to npm
        working-directory: packages/cli
        run: |
          VERSION="${{ needs.prepare-tag.outputs.version }}"
          TAG_ARGS=""
          if [ "${{ needs.prepare-tag.outputs.prerelease }}" = "true" ]; then
            TAG_ARGS="--tag next"
          fi
          npm publish "${TARBALL}" --provenance --access public ${TAG_ARGS} || {
            EXIT_CODE=$?
            if npm view "openpalm@${VERSION}" version 2>/dev/null; then
              echo "::warning::Version ${VERSION} already published — skipping"
            else
              exit $EXIT_CODE
            fi
          }

  publish-channels-sdk-npm:
    name: Publish channels-sdk to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare-tag.outputs.dry_run != 'true'
    needs:
      - prepare-tag
      - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack channels-sdk
        working-directory: packages/channels-sdk
        run: |
          PACK_DIR="$(mktemp -d)"
          bun pm pack --destination "${PACK_DIR}" --quiet
          mapfile -t TARBALLS < <(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz')
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"
          echo "Packed: ${TARBALLS[0]}"

      - name: Publish to npm
        working-directory: packages/channels-sdk
        run: |
          VERSION="${{ needs.prepare-tag.outputs.version }}"
          TAG_ARGS=""
          if [ "${{ needs.prepare-tag.outputs.prerelease }}" = "true" ]; then
            TAG_ARGS="--tag next"
          fi
          npm publish "${TARBALL}" --provenance --access public ${TAG_ARGS} || {
            EXIT_CODE=$?
