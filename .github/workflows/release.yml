name: Release

# Single manually-dispatched orchestrator for releasing OpenPalm by deployment UNIT.
#
# Units. NOTE: every unit EXCEPT `all` is PARTIAL by design — it publishes only
# its own slice. A partial unit will silently leave the other units behind (e.g.
# `platform` does NOT touch the portal image or the discord/slack npm adapters).
# For a complete, coordinated release of the whole platform, use `all`.
#   platform  — @openpalm/skeleton + @openpalm/lib + openpalm (CLI) +
#               @openpalm/ui (npm) + CLI native binaries + git tag + GitHub release
#               + assistant image (include_images defaults to TRUE).
#               PARTIAL: no portal image, no portal npm, no voice.
#   portals   — @openpalm/portal-sdk + @openpalm/discord-portal and
#               @openpalm/slack-portal npm packages, baked into the portal image
#               at build time, plus that portal image
#               (include_images defaults to TRUE) + git tag + GitHub release. PARTIAL.
#   assistant — openpalm/assistant image + git tag + GitHub release. PARTIAL.
#   guardian  — @openpalm/guardian npm package
#               + the guardian Docker image (include_images defaults to TRUE). PARTIAL.
#   images    — Docker-only: rebuilds guardian + assistant + portal images under a
#               required explicit image version. No npm publish.
#               Use to roll out container-level changes (system deps, OpenCode version)
#               without touching npm packages. PARTIAL.
#   electron  — Electron manifests + installers only (mac/linux/win). No npm publish. PARTIAL.
#   all       — COMPLETE coordinated release. Publishes EVERY unit at one version,
#               flag-free:
#                 npm: @openpalm/{lib,ui,guardian,skeleton,portal-sdk} + openpalm
#                      (CLI) + @openpalm/{discord,slack}-portal
#                 images: openpalm/{assistant,guardian,portal}  (+ :latest when stable)
#                 electron installers (mac/linux/win) + CLI native binaries
#                 per-unit tags + bare X.Y.Z summary tag + GitHub release.
#               Accepts any bump type (patch/minor/major) or an explicit version override.
#               Voice ships independently from publish-voice.yml on its own cadence.
#               Prefer `all` for a real release; reach for a partial unit only for a
#               deliberate, isolated hotfix to one slice.
#
# Thin-host decoupling: guardian and platform npm packages CAN be released independently
# of Docker images (npm patches deploy to thin-host deployments without a docker pull) by
# unticking include_images. That is an OPT-OUT, not the default: releases 0.12.43 through
# 0.12.52 shipped npm packages, git tags and GitHub releases with no images at all,
# because include_images defaulted to false and unit=platform silently skipped every
# Docker job. include_images now defaults to TRUE, and tag-release refuses to tag when an
# image job that the unit expected was skipped (see scripts/verify-release-images.mjs).
#
# Optional version override — when set, skips bump computation and uses the explicit version
# (e.g. 0.12.14-rc.1). Pre-release suffixes auto-select the correct npm dist-tag (rc/beta/next).
# When omitted, bump type drives the next version computed from the unit's anchor.
# Tag scheme: platform-X.Y.Z, portals-X.Y.Z, assistant-X.Y.Z, guardian-X.Y.Z,
#             electron-X.Y.Z, images-X.Y.Z, X.Y.Z (all-units/platform summary).
# Docker images: openpalm/assistant:X.Y.Z, openpalm/portal:X.Y.Z, openpalm/guardian:X.Y.Z
#             (bare semver, no `v` prefix as of 0.12.41; reads still tolerate legacy `v`).
#
# npm OIDC: all npm publishes go through publish-npm-package.yml (single top-level caller).
# Docker-only units (assistant/images) skip npm jobs entirely; portals publishes the
# SDK and discord/slack adapter npm packages (its image is on by default).
# Each package manifest has exactly one release owner; `all` composes those disjoint units.
#
# TAG-LAST: the git tag + GitHub release are created LAST ("tag exists = fully published").
# Always run with dry_run=true first to validate the candidate without pushing it.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'Unit to release'
        required: true
        type: choice
        options: [platform, portals, assistant, guardian, images, electron, all]
      bump:
        description: 'Semver increment (ignored for unit=images or when version is set)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version override (e.g. 0.12.14-rc.1). Skips bump computation. Pre-release suffix selects the correct npm dist-tag.'
        required: false
        type: string
        default: ''
      include_images:
        description: 'Rebuild Docker images alongside the npm publish (guardian/platform/portals; images and all always build images). ON by default — untick ONLY for a deliberate npm-only thin-host patch.'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Validate and build the candidate without publishing, pushing, or tagging'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Compute the next version from the unit anchor (no writes) ─────────────────
  compute-version:
    name: Compute version (${{ inputs.unit }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      current_version: ${{ steps.bump.outputs.current_version }}
      tag_prefix: ${{ steps.bump.outputs.tag_prefix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compute next version
        id: bump
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'false'
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: node scripts/bump-unit.mjs

      - name: Validate target version and resolve metadata
        id: meta
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { parseSemver } from './scripts/set-version.mjs';

          const version = process.env.VERSION ?? '';
          const parsed = parseSemver(version);
          if (!parsed) {
            console.error(`::error::Invalid release target version: ${version}`);
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${parsed.pre !== null}\n`);
          NODE

      - name: Regression guard (npm packages)
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          node --input-type=module <<'NODE'
            import { execFileSync } from 'node:child_process';
            import { compareSemver } from './scripts/set-version.mjs';

            const target = process.env.VERSION;
            const unit = process.env.UNIT;

            // Only npm-published units need a regression guard
            if (!['platform', 'portals', 'all', 'guardian'].includes(unit)) {
              console.log('Non-npm unit (' + unit + ') — skipping npm regression guard.');
              process.exit(0);
            }

            const npmPackages = {
              platform: ['@openpalm/lib', 'openpalm', '@openpalm/ui', '@openpalm/skeleton'],
              portals: ['@openpalm/portal-sdk', '@openpalm/discord-portal', '@openpalm/slack-portal'],
              guardian: ['@openpalm/guardian'],
              all: ['@openpalm/lib', 'openpalm', '@openpalm/ui', '@openpalm/skeleton', '@openpalm/guardian', '@openpalm/portal-sdk', '@openpalm/discord-portal', '@openpalm/slack-portal'],
            };
            const packages = npmPackages[unit] || [];

            function maxPublished(name) {
              let vs;
              try { vs = JSON.parse(execFileSync('npm', ['view', name, 'versions', '--json'], { stdio: ['ignore', 'pipe', 'ignore'] }).toString()); }
              catch (error) {
                console.error('::error::Could not query npm versions for ' + name + ': ' + error.message);
                process.exit(1);
              }
              if (!Array.isArray(vs)) vs = vs ? [vs] : [];
              let mx = null;
              for (const v of vs) { if (mx === null || compareSemver(v, mx) > 0) mx = v; }
              return mx;
            }

            let regressed = false;
            for (const name of packages) {
              const published = maxPublished(name);
              let status = 'ok';
              if (published !== null) {
                const comparison = compareSemver(target, published);
                if (comparison <= 0) { status = 'REGRESSION (target <= ' + published + ')'; regressed = true; }
                else status = 'ok (published: ' + published + ')';
              } else status = 'ok (not yet published)';
              console.log(name.padEnd(28) + target.padEnd(14) + status);
            }
            if (regressed) {
              console.error('::error::One or more packages would regress. The computed next version is <= already-published.');
              process.exit(1);
            }
          NODE

      - name: Preflight immutable Git and Docker targets
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          VERSION_INPUT: ${{ inputs.version }}
          INCLUDE_IMAGES: ${{ inputs.include_images }}
        run: |
          set -euo pipefail

          if [ "${UNIT}" = 'images' ] && [ -z "${VERSION_INPUT}" ]; then
            echo "::error::unit=images requires an explicit version because image tags are immutable"
            exit 1
          fi

          tags=()
          case "${UNIT}" in
            all)
              for prefix in platform portals assistant guardian electron; do tags+=("${prefix}-${VERSION}"); done
              tags+=("${VERSION}")
              ;;
            platform) tags+=("platform-${VERSION}" "${VERSION}") ;;
            images) tags+=("images-${VERSION}") ;;
            *) tags+=("${UNIT}-${VERSION}") ;;
          esac
          for tag in "${tags[@]}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Git tag ${tag} already exists"
              exit 1
            fi
          done

          images=()
          if [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'portals' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            images+=(portal)
          fi
          if [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'guardian' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            images+=(guardian)
          fi
          if [ "${UNIT}" = 'assistant' ] || [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'platform' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            images+=(assistant)
          fi
          for image in "${images[@]}"; do
            ref="openpalm/${image}:${VERSION}"
            IMAGE="openpalm/${image}" TARGET_VERSION="${VERSION}" \
              node scripts/assert-docker-tag-monotonic.mjs
            if output=$(docker manifest inspect "${ref}" 2>&1); then
              echo "::error::Docker image ${ref} already exists"
              exit 1
            elif ! grep -qiE 'manifest unknown|no such manifest' <<<"${output}"; then
              echo "::error::Could not verify Docker target ${ref}: ${output}"
              exit 1
            fi
          done

  # ── Prepare one stamped candidate commit without pushing it ────────────────────
  bump:
    name: Prepare candidate ${{ needs.compute-version.outputs.new_version }}
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      source_artifact: ${{ steps.candidate.outputs.source_artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Capture release base
        id: base
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          if [ "${BASE_SHA}" != "${DISPATCH_SHA}" ]; then
            echo "::error::Checked out ${BASE_SHA}, expected dispatch SHA ${DISPATCH_SHA}"
            exit 1
          fi
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Stamp unit files
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'true'
          VERSION_OVERRIDE: ${{ needs.compute-version.outputs.new_version }}
        run: |
          node scripts/bump-unit.mjs
          bun install --lockfile-only

      - name: Commit and bundle candidate
        id: candidate
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c release-candidate
          git add -A
          git commit --allow-empty -m "chore(release): stamp ${UNIT} to ${VERSION}"

          CANDIDATE_SHA=$(git rev-parse HEAD)
          if [ "$(git rev-parse HEAD^)" != "${BASE_SHA}" ]; then
            echo "::error::Candidate is not directly atop recorded base ${BASE_SHA}"
            exit 1
          fi
          git diff --check "${BASE_SHA}" "${CANDIDATE_SHA}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Candidate commit left tracked or untracked release changes behind"
            git status --short
            exit 1
          fi

          SOURCE_ARTIFACT="release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git bundle create "${RUNNER_TEMP}/release-candidate.bundle" release-candidate "^${BASE_SHA}"
          git bundle verify "${RUNNER_TEMP}/release-candidate.bundle"
          echo "candidate_sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_artifact=${SOURCE_ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${CANDIDATE_SHA} atop ${BASE_SHA}"

      - name: Upload candidate source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.candidate.outputs.source_artifact }}
          path: ${{ runner.temp }}/release-candidate.bundle
          compression-level: 0
          retention-days: 7

  # ── Preflight the exact prepared candidate ────────────────────────────────────
  preflight:
    name: Preflight candidate (test gate)
    needs: [compute-version, bump]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.bump.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore candidate source
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.bump.outputs.candidate_sha }}' '${{ needs.bump.outputs.base_sha }}'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Working tree must be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Candidate working tree is not clean."
            git status --porcelain
            exit 1
          fi

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Test (platform / all)
        if: inputs.unit == 'platform' || inputs.unit == 'all'
        run: |
          bun run test
          bun run ui:check
          bun run ui-kit:check
          bun run --cwd packages/ui test:browsers
          bun run ui:test:unit
          bun run electron:test

      - name: Test (electron)
        if: inputs.unit == 'electron'
        run: bun run electron:test

      - name: Test (guardian)
        if: inputs.unit == 'guardian'
        run: bun test packages/guardian

      - name: Test (portals)
        if: inputs.unit == 'portals'
        run: bun test --isolate --no-orphans packages/portal-sdk portals/discord portals/slack

  # ── Publish only the tested candidate to the target branch ────────────────────
  release-source:
    name: Release source gate
    needs: [bump, preflight]
    if: always() && needs.bump.result == 'success' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ needs.bump.outputs.base_sha }}
      candidate_sha: ${{ needs.bump.outputs.candidate_sha }}
      source_artifact: ${{ needs.bump.outputs.source_artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.base_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.bump.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.bump.outputs.candidate_sha }}' '${{ needs.bump.outputs.base_sha }}'

      - name: Dry-run source notice
        if: inputs.dry_run
        run: echo "::notice::dry-run uses candidate ${{ needs.bump.outputs.candidate_sha }} without pushing it"

      - name: Push tested candidate with base lease
        if: ${{ !inputs.dry_run }}
        env:
          BASE_SHA: ${{ needs.bump.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.bump.outputs.candidate_sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${REF_TYPE}" != 'branch' ]; then
            echo "::error::Release must be dispatched from a branch, got ${REF_TYPE}"
            exit 1
          fi

          REMOTE_LINE=$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}")
          REMOTE_SHA=${REMOTE_LINE%%[[:space:]]*}
          if [ "${REMOTE_SHA}" != "${BASE_SHA}" ]; then
            echo "::error::Target branch moved from ${BASE_SHA} to ${REMOTE_SHA}; refusing to push an untested rebase"
            exit 1
          fi

          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${BASE_SHA}" \
            origin "${CANDIDATE_SHA}:refs/heads/${TARGET_BRANCH}"

          PUSHED_LINE=$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}")
          PUSHED_SHA=${PUSHED_LINE%%[[:space:]]*}
          if [ "${PUSHED_SHA}" != "${CANDIDATE_SHA}" ]; then
            echo "::error::Target branch resolved to ${PUSHED_SHA}, expected candidate ${CANDIDATE_SHA}"
            exit 1
          fi

  # ── npm layer ─────────────────────────────────────────────────────────────────
  # skeleton + lib + cli + ui: platform + all
  # guardian: guardian + all
  npm-skeleton:
    name: npm @openpalm/skeleton
    needs: [compute-version, release-source]
    if: always() && needs.release-source.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/skeleton
      package-name: '@openpalm/skeleton'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      pack-artifact: npm-skeleton-${{ github.run_id }}
      dry-run: ${{ inputs.dry_run }}

  npm-lib:
    name: npm @openpalm/lib
    needs: [compute-version, release-source, npm-skeleton]
    if: always() && needs.release-source.result == 'success' && needs.npm-skeleton.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/lib
      package-name: '@openpalm/lib'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      dry-run: ${{ inputs.dry_run }}

  npm-guardian:
    name: npm @openpalm/guardian
    needs: [compute-version, release-source]
    if: always() && needs.release-source.result == 'success' && (inputs.unit == 'guardian' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/guardian
      package-name: '@openpalm/guardian'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      dry-run: ${{ inputs.dry_run }}

  npm-cli:
    name: npm openpalm (CLI)
    needs: [compute-version, release-source, npm-lib]
    if: always() && needs.release-source.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/cli
      package-name: openpalm
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      dry-run: ${{ inputs.dry_run }}

  npm-ui:
    name: npm @openpalm/ui
    needs: [compute-version, release-source, npm-lib]
    if: always() && needs.release-source.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/ui
      package-name: '@openpalm/ui'
      needs-build: true
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      pack-artifact: npm-ui-${{ github.run_id }}
      dry-run: ${{ inputs.dry_run }}

  # Portal SDK: shared base class + OpenCode client the discord/slack adapters
  # depend on via `"@openpalm/portal-sdk": "workspace:*"` in `dependencies`
  # (NOT devDependencies — this is a real runtime dependency, unlike ui-kit's
  # workspace:* into ui). `bun pm pack` resolves workspace:* to the
  # on-disk version of packages/portal-sdk at pack time, so portal-sdk MUST be
  # published in lockstep with the adapters, and published FIRST (C1, review
  # 2026-07-10: portal-sdk was never added to the DAG, leaving the published
  # 0.13.0-beta.1 discord/slack adapters pinned to an unpublished
  # @openpalm/portal-sdk@0.12.52 — uninstallable).
  npm-portal-sdk:
    name: npm @openpalm/portal-sdk
    needs: [compute-version, release-source]
    if: always() && needs.release-source.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/portal-sdk
      package-name: '@openpalm/portal-sdk'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      pack-artifact: npm-portal-sdk-${{ github.run_id }}
      dry-run: ${{ inputs.dry_run }}

  # Portal adapters: baked into the portal image at build time from
  # containers/portal/tools/package.json (image-baked-only, E2/§S2) — a
  # published patch reaches running portals via an image rebuild + stack
  # update, not a runtime install. Published as `src` only (no build).
  npm-discord-portal:
    name: npm @openpalm/discord-portal
    needs: [compute-version, release-source, npm-portal-sdk]
    if: always() && needs.release-source.result == 'success' && needs.npm-portal-sdk.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: portals/discord
      package-name: '@openpalm/discord-portal'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      pack-artifact: npm-discord-portal-${{ github.run_id }}
      dry-run: ${{ inputs.dry_run }}

  npm-slack-portal:
    name: npm @openpalm/slack-portal
    needs: [compute-version, release-source, npm-portal-sdk]
    if: always() && needs.release-source.result == 'success' && needs.npm-portal-sdk.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: portals/slack
      package-name: '@openpalm/slack-portal'
      version: ${{ needs.compute-version.outputs.new_version }}
      base-sha: ${{ needs.release-source.outputs.base_sha }}
      candidate-sha: ${{ needs.release-source.outputs.candidate_sha }}
      source-artifact: ${{ needs.release-source.outputs.source_artifact }}
      pack-artifact: npm-slack-portal-${{ github.run_id }}
      dry-run: ${{ inputs.dry_run }}

  # ── Docker images ─────────────────────────────────────────────────────────────
  # portal:    images | all | portals+include_images
  # guardian:  images | all | guardian+include_images
  # assistant: assistant | images | all | platform+include_images
  docker-portal:
    name: Docker openpalm/portal
    needs: [compute-version, release-source, npm-portal-sdk, npm-discord-portal, npm-slack-portal]
    if: |
      always() &&
      needs.release-source.result == 'success' &&
      (inputs.unit == 'images' || inputs.unit == 'all' || (inputs.unit == 'portals' && inputs.include_images)) &&
      (inputs.unit == 'images' ||
       (needs.npm-portal-sdk.result == 'success' &&
        needs.npm-discord-portal.result == 'success' &&
        needs.npm-slack-portal.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'
      - name: Download portal SDK dry-run package
        if: inputs.dry_run && inputs.unit != 'images'
        uses: actions/download-artifact@v8
        with:
          name: npm-portal-sdk-${{ github.run_id }}
          path: .release-packages
      - name: Download Discord dry-run package
        if: inputs.dry_run && inputs.unit != 'images'
        uses: actions/download-artifact@v8
        with:
          name: npm-discord-portal-${{ github.run_id }}
          path: .release-packages
      - name: Download Slack dry-run package
        if: inputs.dry_run && inputs.unit != 'images'
        uses: actions/download-artifact@v8
        with:
          name: npm-slack-portal-${{ github.run_id }}
          path: .release-packages
      - name: Prepare portal dry-run Dockerfile
        if: inputs.dry_run && inputs.unit != 'images'
        run: |
          cat > .release-packages/portal.Dockerfile <<'DOCKERFILE'
          FROM oven/bun:1.3-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
          COPY .release-packages/*.tgz /tmp/openpalm-packages/
          RUN mkdir -p /opt/openpalm/tools \
              && bun add --cwd /opt/openpalm/tools /tmp/openpalm-packages/*.tgz --production \
              && rm -rf /tmp/openpalm-packages \
              && chmod -R a+rwX /opt/openpalm/tools
          COPY containers/portal/portal-entrypoint.ts /app/portal-entrypoint.ts
          COPY containers/portal/start.sh /app/start.sh
          RUN chmod +x /app/start.sh \
              && mkdir -p /home/bun \
              && chown -R bun:bun /app /home/bun /opt/openpalm/tools
          ENV HOME=/home/bun
          ENV PORT=8080
          ENV PATH="/opt/openpalm/tools/node_modules/.bin:$PATH"
          EXPOSE 8080
          HEALTHCHECK --interval=10s --timeout=3s --start-period=15s --retries=3 \
            CMD curl -sf "http://localhost:${PORT}/health" || exit 1
          USER bun
          CMD ["/app/start.sh"]
          DOCKERFILE
      - name: Validate existing exact portal pins (image-only release)
        if: inputs.unit == 'images'
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const { dependencies } = JSON.parse(readFileSync('containers/portal/tools/package.json', 'utf8'));
          for (const [name, version] of Object.entries(dependencies)) {
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`${name} must use an exact published pin, got ${version}`);
            }
            execFileSync('npm', ['view', `${name}@${version}`, 'version'], { stdio: 'inherit' });
          }
          NODE
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: openpalm/portal:${{ needs.compute-version.outputs.new_version }}
        run: |
          set -euo pipefail
          if output=$(docker manifest inspect "${IMAGE_REF}" 2>&1); then
            echo "::error::${IMAGE_REF} already exists on Docker Hub. Refusing to overwrite."
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest' <<<"${output}"; then
            echo "::error::Could not verify Docker target ${IMAGE_REF}: ${output}"
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/portal
          tags: |
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-source.outputs.candidate_sha }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dry_run && inputs.unit != 'images' && '.release-packages/portal.Dockerfile' || 'containers/portal/Dockerfile' }}
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/portal
          cache-to: type=gha,scope=openpalm/portal,mode=max
      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image (cosign keyless)
        if: ${{ !inputs.dry_run }}
        # Sign by immutable digest (not by tag) so the signature binds to the
        # exact pushed manifest even as `latest` moves. Keyless: uses the
        # job's GitHub OIDC token (id-token: write, set at workflow level) to
        # get a short-lived Fulcio cert; the signature + cert are recorded in
        # the public Rekor transparency log. No secret key involved.
        run: cosign sign --yes openpalm/portal@${{ steps.build.outputs.digest }}
      - name: Verify image signature (fail loudly on a broken signer)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            openpalm/portal@${{ steps.build.outputs.digest }}

  docker-guardian:
    name: Docker openpalm/guardian
    needs: [compute-version, release-source, npm-guardian, npm-skeleton]
    if: |
      always() &&
      needs.release-source.result == 'success' &&
      (inputs.unit == 'images' ||
       ((inputs.unit == 'all' ||
          (inputs.unit == 'guardian' && inputs.include_images)) &&
         needs.npm-guardian.result == 'success' &&
         (inputs.unit != 'all' || needs.npm-skeleton.result == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'
      - name: Resolve Guardian and skeleton package versions
        id: package_versions
        env:
          UNIT: ${{ inputs.unit }}
          TARGET_VERSION: ${{ needs.compute-version.outputs.new_version }}
        run: |
          if [ "${UNIT}" = 'guardian' ] || [ "${UNIT}" = 'all' ]; then
            GUARDIAN_VERSION="${TARGET_VERSION}"
          else
            GUARDIAN_VERSION=$(node -p "require('./packages/guardian/package.json').version")
          fi
          if [ "${UNIT}" = 'all' ]; then
            SKELETON_VERSION="${TARGET_VERSION}"
          else
            SKELETON_VERSION=$(node -p "require('./packages/skeleton/package.json').version")
          fi
          echo "guardian_version=${GUARDIAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "skeleton_version=${SKELETON_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Preflight registry-backed Guardian packages
        env:
          UNIT: ${{ inputs.unit }}
          DRY_RUN: ${{ inputs.dry_run }}
          GUARDIAN_VERSION: ${{ steps.package_versions.outputs.guardian_version }}
          SKELETON_VERSION: ${{ steps.package_versions.outputs.skeleton_version }}
        run: |
          if ! { [ "${DRY_RUN}" = 'true' ] && { [ "${UNIT}" = 'guardian' ] || [ "${UNIT}" = 'all' ]; }; }; then
            npm view "@openpalm/guardian@${GUARDIAN_VERSION}" version >/dev/null
          fi
          if ! { [ "${DRY_RUN}" = 'true' ] && [ "${UNIT}" = 'all' ]; }; then
            npm view "@openpalm/skeleton@${SKELETON_VERSION}" version >/dev/null
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: openpalm/guardian:${{ needs.compute-version.outputs.new_version }}
        run: |
          set -euo pipefail
          if output=$(docker manifest inspect "${IMAGE_REF}" 2>&1); then
            echo "::error::${IMAGE_REF} already exists on Docker Hub. Refusing to overwrite."
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest' <<<"${output}"; then
            echo "::error::Could not verify Docker target ${IMAGE_REF}: ${output}"
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/guardian
          tags: |
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-source.outputs.candidate_sha }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/guardian/Dockerfile
          build-args: |
            GUARDIAN_VERSION=${{ steps.package_versions.outputs.guardian_version }}
            SKELETON_VERSION=${{ steps.package_versions.outputs.skeleton_version }}
            GUARDIAN_USE_LOCAL_SOURCE=${{ inputs.dry_run && (inputs.unit == 'guardian' || inputs.unit == 'all') && 'true' || 'false' }}
            SKELETON_USE_LOCAL_SOURCE=${{ inputs.dry_run && inputs.unit == 'all' && 'true' || 'false' }}
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/guardian
          cache-to: type=gha,scope=openpalm/guardian,mode=max
      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image (cosign keyless)
        if: ${{ !inputs.dry_run }}
        # Sign by immutable digest (not by tag) so the signature binds to the
        # exact pushed manifest even as `latest` moves. Keyless: uses the
        # job's GitHub OIDC token (id-token: write, set at workflow level) to
        # get a short-lived Fulcio cert; the signature + cert are recorded in
        # the public Rekor transparency log. No secret key involved.
        run: cosign sign --yes openpalm/guardian@${{ steps.build.outputs.digest }}
      - name: Verify image signature (fail loudly on a broken signer)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            openpalm/guardian@${{ steps.build.outputs.digest }}

  # unit=assistant is IMAGE-ONLY: its compute-version anchor is
  # containers/assistant/VERSION, a version scheme entirely independent of the
  # platform npm version — bumping it produces e.g. "0.13.1" whether or not
  # @openpalm/skeleton@0.13.1 has ever been published. Pre-I1-fix, that
  # unit-local anchor was baked directly into the image as PLATFORM_VERSION,
  # which the entrypoint uses for `npm install @openpalm/skeleton@$PLATFORM_VERSION`
  # at every container boot — a 404 there bricks the stack silently (I1, review
  # 2026-07-10). npm-skeleton ordering + the preflight below close that gap.
  #
  # The image also bakes @openpalm/ui@$PLATFORM_VERSION (the offline UI floor,
  # Dockerfile ~L191). So this job MUST also wait for npm-ui: on a platform/all
  # cut, @openpalm/ui@$PLATFORM_VERSION is published by npm-ui *within this same
  # run*, and the assistant smoke/build's `npm install @openpalm/ui@$PLATFORM_VERSION`
  # 404s (ETARGET) if it races ahead of that publish (C, run 29955888007:
  # docker-assistant depended only on npm-skeleton and started while npm-ui was
  # still queued). npm-ui is `skipped` for unit=assistant/images (not published
  # in-run), where the registry preflight below covers the existing platform pin.
  docker-assistant:
    name: Docker openpalm/assistant
    needs: [compute-version, release-source, npm-skeleton, npm-ui]
    if: |
      always() &&
      needs.release-source.result == 'success' &&
      ((inputs.unit == 'assistant' || inputs.unit == 'images') ||
       ((inputs.unit == 'all' || (inputs.unit == 'platform' && inputs.include_images)) &&
        needs.npm-skeleton.result == 'success' &&
        needs.npm-ui.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'
      - name: Download skeleton dry-run package
        if: inputs.dry_run && (inputs.unit == 'platform' || inputs.unit == 'all')
        uses: actions/download-artifact@v8
        with:
          name: npm-skeleton-${{ github.run_id }}
          path: .release-packages
      - name: Download UI dry-run package
        if: inputs.dry_run && (inputs.unit == 'platform' || inputs.unit == 'all')
        uses: actions/download-artifact@v8
        with:
          name: npm-ui-${{ github.run_id }}
          path: .release-packages
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: openpalm/assistant:${{ needs.compute-version.outputs.new_version }}
        run: |
          set -euo pipefail
          if output=$(docker manifest inspect "${IMAGE_REF}" 2>&1); then
            echo "::error::${IMAGE_REF} already exists on Docker Hub. Refusing to overwrite."
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest' <<<"${output}"; then
            echo "::error::Could not verify Docker target ${IMAGE_REF}: ${output}"
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/assistant
          tags: |
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-source.outputs.candidate_sha }}
      - name: Resolve platform version for baked skeleton (I1)
        id: platform_version
        env:
          UNIT: ${{ inputs.unit }}
          ANCHOR_VERSION: ${{ needs.compute-version.outputs.new_version }}
        run: |
          if [ "${UNIT}" = 'assistant' ] || [ "${UNIT}" = 'images' ]; then
            # Image-only version tags have no relationship to the platform npm
            # version. Resolve the exact UI/skeleton version baked into the
            # Assistant from the root manifest instead.
            V=$(node -p "require('./package.json').version")
            echo "unit=${UNIT}: PLATFORM_VERSION resolved from root package.json (${V}), not image target ${ANCHOR_VERSION}"
          else
            V="${ANCHOR_VERSION}"
          fi
          echo "platform_version=${V}" >> "$GITHUB_OUTPUT"
      - name: Preflight — baked skeleton + ui must exist on npm (I1)
        if: ${{ !inputs.dry_run || inputs.unit == 'assistant' || inputs.unit == 'images' }}
        env:
          PLATFORM_VERSION: ${{ steps.platform_version.outputs.platform_version }}
        run: |
          V="${PLATFORM_VERSION}"
          fail=0
          # The assistant image bakes BOTH packages at PLATFORM_VERSION: skeleton
          # (installed at every container boot) and ui (the offline UI floor,
          # Dockerfile ~L191). Both must be published or the smoke/build's
          # `npm install @openpalm/<pkg>@$PLATFORM_VERSION` 404s (ETARGET).
          for PKG in @openpalm/skeleton @openpalm/ui; do
            if npm view "${PKG}@${V}" version >/dev/null 2>&1; then
              echo "OK: ${PKG}@${V} is published"
            else
              echo "::error::${PKG}@${V} is not published on npm — building this image would bake a PLATFORM_VERSION with no installable ${PKG} (I1). Publish it first (unit=platform/all) or pass an explicit --version matching a published release." >&2
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
      # IMG-6: build the amd64 smoke image on the SAME buildx builder and gha
      # cache scope as "Build and push" below, so the release builds this image
      # once instead of twice — the push step then restores these layers from
      # cache rather than rebuilding ~3.5 GB. Still runs BEFORE the push, so it
      # keeps gating the release exactly as it did.
      - name: Assistant image smoke (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/assistant/Dockerfile
          build-args: |
            PLATFORM_VERSION=${{ (!inputs.dry_run || inputs.unit == 'assistant' || inputs.unit == 'images') && steps.platform_version.outputs.platform_version || '' }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: openpalm-assistant-smoke:${{ github.run_id }}
          cache-from: type=gha,scope=openpalm/assistant
          cache-to: type=gha,scope=openpalm/assistant,mode=max
      - name: Bake candidate npm packages into dry-run image
        if: inputs.dry_run && (inputs.unit == 'platform' || inputs.unit == 'all')
        env:
          PLATFORM_VERSION: ${{ steps.platform_version.outputs.platform_version }}
        run: |
          docker build \
            --file containers/assistant/Dockerfile.local-packages \
            --build-arg "BASE_IMAGE=openpalm-assistant-smoke:${GITHUB_RUN_ID}" \
            --build-arg "PLATFORM_VERSION=${PLATFORM_VERSION}" \
            --tag "openpalm-assistant-smoke:${GITHUB_RUN_ID}" \
            .release-packages
      - name: Assistant image smoke — baked packages and tools present
        run: |
          docker run --rm --entrypoint bash openpalm-assistant-smoke:${{ github.run_id }} \
            -lc 'test -f /opt/openpalm/ui/node_modules/@openpalm/ui/package.json && test -f /opt/openpalm/skeleton/node_modules/@openpalm/skeleton/package.json && opencode --version && akm --version && gh --version && jq --version && sqlite3 --version && uv --version'
      - name: Build and push
        id: build
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/assistant/Dockerfile
          build-args: |
            PLATFORM_VERSION=${{ steps.platform_version.outputs.platform_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/assistant
          cache-to: type=gha,scope=openpalm/assistant,mode=max
      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image (cosign keyless)
        if: ${{ !inputs.dry_run }}
        # Sign by immutable digest (not by tag) so the signature binds to the
        # exact pushed manifest even as `latest` moves. Keyless: uses the
        # job's GitHub OIDC token (id-token: write, set at workflow level) to
        # get a short-lived Fulcio cert; the signature + cert are recorded in
        # the public Rekor transparency log. No secret key involved.
        run: cosign sign --yes openpalm/assistant@${{ steps.build.outputs.digest }}
      - name: Verify image signature (fail loudly on a broken signer)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            openpalm/assistant@${{ steps.build.outputs.digest }}

  # ── CLI native binaries (platform + all) ─────────────────────────────────────
  cli:
    name: CLI binary (${{ matrix.artifact }})
    needs: [compute-version, release-source, npm-skeleton, npm-lib, npm-cli]
    if: always() && needs.release-source.result == 'success' && needs.npm-skeleton.result == 'success' && needs.npm-lib.result == 'success' && needs.npm-cli.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # B4: windows-arm64 is marked experimental below — Bun's ability to
    # --compile a bun-windows-arm64 target is unverified in this era (the
    # build script exists, but cross-compiling this target has not been
    # confirmed to succeed in CI). continue-on-error scoped to just that
    # matrix leg means a real Bun limitation there fails visibly in the run
    # summary without blocking the rest of the platform release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            artifact: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            artifact: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            artifact: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            artifact: openpalm-cli-windows-x64.exe
          - os: windows-latest
            script: build:windows-arm64
            artifact: openpalm-cli-windows-arm64.exe
            experimental: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI binary
        run: bun run --cwd packages/cli ${{ matrix.script }}
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - packages/cli/dist/${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  # ── Electron installer ────────────────────────────────────────────────────────
  # Standalone: unit=electron (npm jobs are skipped)
  # Coordinated: unit=all
  electron:
    name: Electron (${{ matrix.platform }})
    needs: [compute-version, release-source, npm-skeleton, npm-lib, npm-cli, npm-ui, npm-guardian]
    if: |
      always() &&
      needs.release-source.result == 'success' &&
      (
        inputs.unit == 'electron' ||
        (
          needs.npm-skeleton.result == 'success' &&
          needs.npm-lib.result == 'success' &&
          needs.npm-cli.result == 'success' &&
          needs.npm-ui.result == 'success' &&
          needs.npm-guardian.result == 'success' &&
          inputs.unit == 'all'
        )
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron_flag: --mac
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
          - os: windows-latest
            platform: win
            electron_flag: --win
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI
        run: bun run ui:build
      - name: Bundle Electron app
        run: bun run --cwd packages/electron bundle
      - name: Build Electron installer
        working-directory: packages/electron
        shell: bash
        run: |
          CLI=$(node -e "console.log(require.resolve('electron-builder/cli.js'))")
          node "$CLI" ${{ matrix.electron_flag }} --publish never
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip

  # ── Git tag + GitHub release (LAST — tag exists = fully published) ────────────
  tag-release:
    name: Tag + GitHub release (LAST)
    needs:
      - compute-version
      - release-source
      - npm-skeleton
      - npm-lib
      - npm-guardian
      - npm-cli
      - npm-ui
      - npm-portal-sdk
      - npm-discord-portal
      - npm-slack-portal
      - docker-portal
      - docker-guardian
      - docker-assistant
      - cli
      - electron
    if: |
      always() &&
      !inputs.dry_run &&
      needs.release-source.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.base_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-source.outputs.source_artifact }}
          path: .git/release-source
      - name: Restore tested candidate
        shell: bash
        run: bash scripts/restore-release-candidate.sh .git/release-source/release-candidate.bundle '${{ needs.release-source.outputs.candidate_sha }}' '${{ needs.release-source.outputs.base_sha }}'

      # TAG-LAST means "tag exists = fully published". The job-level `if:` above
      # only rejects 'failure'/'cancelled' — a SKIPPED docker job sails through
      # it, which is how 0.12.43 and 0.12.45–0.12.52 got tags and GitHub
      # releases with no images. Fail here, LOUDLY, before any tag is created;
      # a job-level condition would skip tag-release and stay green instead.
      - name: Verify expected release jobs succeeded
        env:
          UNIT: ${{ inputs.unit }}
          INCLUDE_IMAGES: ${{ inputs.include_images }}
          RESULT_NPM_SKELETON: ${{ needs.npm-skeleton.result }}
          RESULT_NPM_LIB: ${{ needs.npm-lib.result }}
          RESULT_NPM_GUARDIAN: ${{ needs.npm-guardian.result }}
          RESULT_NPM_CLI: ${{ needs.npm-cli.result }}
          RESULT_NPM_UI: ${{ needs.npm-ui.result }}
          RESULT_NPM_PORTAL_SDK: ${{ needs.npm-portal-sdk.result }}
          RESULT_NPM_DISCORD_PORTAL: ${{ needs.npm-discord-portal.result }}
          RESULT_NPM_SLACK_PORTAL: ${{ needs.npm-slack-portal.result }}
          RESULT_DOCKER_PORTAL: ${{ needs.docker-portal.result }}
          RESULT_DOCKER_GUARDIAN: ${{ needs.docker-guardian.result }}
          RESULT_DOCKER_ASSISTANT: ${{ needs.docker-assistant.result }}
          RESULT_CLI: ${{ needs.cli.result }}
          RESULT_ELECTRON: ${{ needs.electron.result }}
        run: node scripts/verify-release-images.mjs

      - uses: docker/setup-buildx-action@v3
        if: |
          needs.compute-version.outputs.prerelease == 'false' &&
          (inputs.unit == 'assistant' || inputs.unit == 'images' || inputs.unit == 'all' ||
           ((inputs.unit == 'platform' || inputs.unit == 'guardian' || inputs.unit == 'portals') && inputs.include_images))

      - name: Login to Docker Hub for stable promotion
        if: |
          needs.compute-version.outputs.prerelease == 'false' &&
          (inputs.unit == 'assistant' || inputs.unit == 'images' || inputs.unit == 'all' ||
           ((inputs.unit == 'platform' || inputs.unit == 'guardian' || inputs.unit == 'portals') && inputs.include_images))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote stable Docker tags
        if: needs.compute-version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          INCLUDE_IMAGES: ${{ inputs.include_images }}
          PORTAL_DIGEST: ${{ needs.docker-portal.outputs.digest }}
          GUARDIAN_DIGEST: ${{ needs.docker-guardian.outputs.digest }}
          ASSISTANT_DIGEST: ${{ needs.docker-assistant.outputs.digest }}
        run: |
          set -euo pipefail
          promote() {
            local image="$1"
            local digest="$2"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid build digest for openpalm/${image}: ${digest}"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "openpalm/${image}:latest" \
              "openpalm/${image}@${digest}"
            docker buildx imagetools inspect "openpalm/${image}:latest" >/dev/null
          }

          if [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'portals' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            promote portal "${PORTAL_DIGEST}"
          fi
          if [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'guardian' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            promote guardian "${GUARDIAN_DIGEST}"
          fi
          if [ "${UNIT}" = 'assistant' ] || [ "${UNIT}" = 'images' ] || [ "${UNIT}" = 'all' ] || { [ "${UNIT}" = 'platform' ] && [ "${INCLUDE_IMAGES}" = 'true' ]; }; then
            promote assistant "${ASSISTANT_DIGEST}"
          fi

      - name: Build deploy bundle
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          mkdir -p dist
          tar -czf "dist/openpalm-${UNIT}-${VERSION}-deploy-bundle.tar.gz" \
            containers packages portals scripts LICENSE README.md

      - name: Download CLI artifacts
        if: inputs.unit == 'platform' || inputs.unit == 'all'
        uses: actions/download-artifact@v8
        with:
          pattern: openpalm-cli-*
          path: dist
          merge-multiple: true

      - name: Download Electron artifacts
        if: inputs.unit == 'all' || inputs.unit == 'electron'
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          if ls dist/* >/dev/null 2>&1; then
            cd dist && sha256sum -- * > checksums-sha256.txt
          fi

      - name: Create + push tags
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags origin

          create_tag() {
            local TAG="$1"
            local MSG="$2"
            HEAD_SHA=$(git rev-parse HEAD)
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              EXISTING=$(git rev-list -n1 "${TAG}")
              if [ "${EXISTING}" = "${HEAD_SHA}" ]; then
                echo "Tag ${TAG} already at HEAD — skipping."
              else
                echo "::error::Tag ${TAG} exists at ${EXISTING} but HEAD is ${HEAD_SHA}. Refusing to move it."
                exit 1
              fi
            else
              git tag -a "${TAG}" -m "${MSG}"
              git push origin "${TAG}"
              echo "Created tag: ${TAG}"
            fi
          }

          if [ "${UNIT}" = 'all' ]; then
            # All per-unit prefixed tags + bare X.Y.Z summary (no `v` as of 0.12.41)
            for PREFIX in platform portals assistant guardian electron; do
              create_tag "${PREFIX}-${VERSION}" "Release ${PREFIX} ${VERSION}"
            done
            create_tag "${VERSION}" "All-units release ${VERSION}"
          elif [ "${UNIT}" = 'platform' ]; then
            # Platform releases also create the bare X.Y.Z summary — asset download URLs use this tag
            create_tag "platform-${VERSION}" "Release platform ${VERSION}"
            create_tag "${VERSION}" "Platform release ${VERSION}"
          elif [ "${UNIT}" = 'images' ]; then
            # Docker-only release: tag as images-X.Y.Z (no bare X.Y.Z alias)
            create_tag "images-${VERSION}" "Release images ${VERSION}"
          else
            create_tag "${UNIT}-${VERSION}" "Release ${UNIT} ${VERSION}"
          fi

      - name: Create GitHub releases
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          PRERELEASE: ${{ needs.compute-version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          create_release() {
            local TAG="$1"
            local TITLE="$2"
            local MAKE_LATEST="$3"
            local PRERELEASE_ARGS=()
            local LATEST_ARGS=(--latest=false)
            if [ "${PRERELEASE}" = 'true' ]; then
              PRERELEASE_ARGS+=(--prerelease)
            elif [ "${MAKE_LATEST}" = 'true' ]; then
              LATEST_ARGS=(--latest)
            fi

            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              gh release edit "${TAG}" "${LATEST_ARGS[@]}"
              echo "Updated existing GitHub release: ${TAG}"
            else
              gh release create "${TAG}" \
                --title "${TITLE}" \
                --generate-notes \
                "${PRERELEASE_ARGS[@]}" \
                "${LATEST_ARGS[@]}" \
                dist/*
              echo "Created GitHub release: ${TAG}"
            fi
          }

          if [ "${UNIT}" = 'all' ]; then
            for PREFIX in platform portals assistant guardian electron; do
              create_release "${PREFIX}-${VERSION}" "OpenPalm ${PREFIX} ${VERSION}" false
            done
            create_release "${VERSION}" "OpenPalm ${VERSION} (all units)" true
          elif [ "${UNIT}" = 'platform' ]; then
            # Mirror the tag step: platform also publishes the bare X.Y.Z release —
            # setup.sh / setup.ps1 download CLI assets from the bare-tag release.
            create_release "platform-${VERSION}" "OpenPalm platform ${VERSION}" false
            create_release "${VERSION}" "OpenPalm platform ${VERSION}" true
          elif [ "${UNIT}" = 'images' ]; then
            create_release "images-${VERSION}" "OpenPalm images ${VERSION}" false
          else
            create_release "${UNIT}-${VERSION}" "OpenPalm ${UNIT} ${VERSION}" false
          fi
