name: Release

# Single manually-dispatched orchestrator for releasing OpenPalm by deployment UNIT.
#
# Units. NOTE: every unit EXCEPT `all` is PARTIAL by design — it publishes only
# its own slice. A partial unit will silently leave the other units behind (e.g.
# `platform` does NOT touch the portal image or the discord/slack npm adapters).
# For a complete, coordinated release of the whole platform, use `all`.
#   platform  — @openpalm/lib + openpalm (CLI) + @openpalm/ui (npm) +
#               admin-tools + CLI native binaries + optional Electron + git tag + GitHub release
#               (add include_images=true to also rebuild guardian + assistant images).
#               PARTIAL: no portal image, no portal npm, no voice.
#   portals   — @openpalm/discord-portal + @openpalm/slack-portal npm packages
#               (the portal image bun-installs these at runtime, so they update via
#               `bun update` without an image rebuild) + optional portal image
#               (include_images=true) + git tag + GitHub release. PARTIAL.
#   assistant — openpalm/assistant image + git tag + GitHub release. PARTIAL.
#   guardian  — @openpalm/guardian + @openpalm/skeleton npm packages only
#               (add include_images=true to also rebuild the guardian Docker image). PARTIAL.
#   images    — Docker-only: rebuilds guardian + assistant + portal images at the
#               current (or explicitly overridden) platform version. No npm publish.
#               Use to roll out container-level changes (system deps, OpenCode version)
#               without touching npm packages. PARTIAL.
#   electron  — Electron installers only (mac/linux/win). No npm publish. Use when
#               only the desktop harness has changed and other units are already published.
#               Always pass version explicitly (the version the existing npm packages are at). PARTIAL.
#   all       — COMPLETE coordinated release. Publishes EVERY unit at one version,
#               flag-free (no include_images / include_electron needed):
#                 npm: @openpalm/{lib,ui,guardian,skeleton} + openpalm (CLI)
#                      + @openpalm/{discord,slack}-portal
#                 images: openpalm/{assistant,guardian,portal}  (+ :latest when stable)
#                 electron installers (mac/linux/win) + CLI native binaries
#                 per-unit tags + bare X.Y.Z summary tag + GitHub release.
#               Accepts any bump type (patch/minor/major) or an explicit version override.
#               THE ONLY thing `all` does NOT build is the voice image — voice ships
#               from publish-voice.yml on its own cadence (GPU cpu/cu121 variants).
#               Prefer `all` for a real release; reach for a partial unit only for a
#               deliberate, isolated hotfix to one slice.
#
# Thin-host decoupling: guardian and platform npm packages can be released independently
# of Docker images. npm patches deploy instantly to thin-host deployments without a
# docker pull. Use unit=images (or include_images=true) only when the container itself
# needs to change.
#
# Optional version override — when set, skips bump computation and uses the explicit version
# (e.g. 0.12.14-rc.1). Pre-release suffixes auto-select the correct npm dist-tag (rc/beta/next).
# When omitted, bump type drives the next version computed from the unit's anchor.
# Tag scheme: platform-X.Y.Z, portals-X.Y.Z, assistant-X.Y.Z, guardian-X.Y.Z,
#             electron-X.Y.Z, images-X.Y.Z, X.Y.Z (all-units/platform summary).
# Docker images: openpalm/assistant:X.Y.Z, openpalm/portal:X.Y.Z, openpalm/guardian:X.Y.Z
#             (bare semver, no `v` prefix as of 0.12.41; reads still tolerate legacy `v`).
#
# npm OIDC: all npm publishes go through publish-npm-package.yml (single top-level caller).
# Docker-only units (assistant/images) skip npm jobs entirely; portals publishes the
# discord/slack adapter npm packages (its image is opt-in via include_images).
# unit=guardian publishes @openpalm/guardian + @openpalm/skeleton (thin-host needs both at runtime).
#
# TAG-LAST: the git tag + GitHub release are created LAST ("tag exists = fully published").
# Always run with dry_run=true first to validate the plan without committing.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'Unit to release'
        required: true
        type: choice
        options: [platform, portals, assistant, guardian, images, electron, all]
      bump:
        description: 'Semver increment (ignored for unit=images or when version is set)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version override (e.g. 0.12.14-rc.1). Skips bump computation. Pre-release suffix selects the correct npm dist-tag.'
        required: false
        type: string
        default: ''
      include_electron:
        description: 'Build and publish Electron installer alongside platform release (use unit=electron for standalone)'
        required: false
        type: boolean
        default: false
      include_images:
        description: 'Also rebuild Docker images (guardian/platform only; images and all always build images)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build without publishing, committing, or tagging'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.unit }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Compute the next version from the unit anchor (no writes) ─────────────────
  compute-version:
    name: Compute version (${{ inputs.unit }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      current_version: ${{ steps.bump.outputs.current_version }}
      tag_prefix: ${{ steps.bump.outputs.tag_prefix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compute next version
        id: bump
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'false'
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: node scripts/bump-unit.mjs

      - name: Resolve prerelease flag
        id: meta
        run: |
          V="${{ steps.bump.outputs.new_version }}"
          if echo "${V}" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regression guard (npm packages)
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const target = process.env.VERSION;
            const unit = process.env.UNIT;

            // Only npm-published units need a regression guard
            if (!['platform', 'all', 'guardian'].includes(unit)) {
              console.log('Non-npm unit (' + unit + ') — skipping npm regression guard.');
              process.exit(0);
            }

            // skeleton + guardian are dual-owned: published by BOTH the platform
            // unit (the CLI hard-pins skeleton to the platform version) AND the
            // independent guardian unit. They MUST be in the platform guard so a
            // platform release can never compute a next version at or below an
            // already-published skeleton/guardian, which npm rejects.
            const npmPackages = {
              platform: ['@openpalm/lib', 'openpalm', '@openpalm/ui', '@openpalm/skeleton', '@openpalm/guardian'],
              all: ['@openpalm/lib', 'openpalm', '@openpalm/ui', '@openpalm/skeleton', '@openpalm/guardian'],
              guardian: ['@openpalm/guardian', '@openpalm/skeleton'],
            };
            const packages = npmPackages[unit] || [];

            function parse(v) {
              const m = String(v).match(/^(\d+)\.(\d+)\.(\d+)(?:-(.+))?\$/);
              return m ? { ma: +m[1], mi: +m[2], pa: +m[3], pre: m[4] || null } : null;
            }
            function cmpPre(a, b) {
              if (a === b) return 0; if (a === null) return 1; if (b === null) return -1;
              const ai = a.split('.'), bi = b.split('.');
              for (let i = 0; i < Math.max(ai.length, bi.length); i++) {
                if (ai[i] === undefined) return -1; if (bi[i] === undefined) return 1;
                const an = /^[0-9]+\$/.test(ai[i]), bn = /^[0-9]+\$/.test(bi[i]);
                if (an && bn) { if (+ai[i] !== +bi[i]) return +ai[i] > +bi[i] ? 1 : -1; }
                else if (ai[i] !== bi[i]) return ai[i] > bi[i] ? 1 : -1;
              }
              return 0;
            }
            function cmp(a, b) {
              const x = parse(a), y = parse(b); if (!x || !y) return null;
              for (const k of ['ma', 'mi', 'pa']) { if (x[k] !== y[k]) return x[k] > y[k] ? 1 : -1; }
              return cmpPre(x.pre, y.pre);
            }
            function maxPublished(name) {
              let vs;
              try { vs = JSON.parse(execSync('npm view ' + name + ' versions --json', { stdio: ['ignore', 'pipe', 'ignore'] }).toString()); }
              catch { return null; }
              if (!Array.isArray(vs)) vs = vs ? [vs] : [];
              let mx = null;
              for (const v of vs) { if (mx === null || cmp(v, mx) > 0) mx = v; }
              return mx;
            }

            let regressed = false;
            for (const name of packages) {
              const published = maxPublished(name);
              let status = 'ok';
              if (published !== null) {
                const c = cmp(target, published);
                if (c !== null && c <= 0) { status = 'REGRESSION (target <= ' + published + ')'; regressed = true; }
                else status = 'ok (published: ' + published + ')';
              } else {
                status = 'ok (not yet published)';
              }
              console.log(name.padEnd(28) + target.padEnd(14) + status);
            }
            if (regressed) {
              console.error('::error::One or more packages would regress. The computed next version is <= already-published.');
              process.exit(1);
            }
          "

  # ── Preflight gate (platform + all + guardian + electron) ───────────────────
  preflight:
    name: Preflight (test gate)
    needs: compute-version
    if: inputs.unit == 'platform' || inputs.unit == 'all' || inputs.unit == 'guardian' || inputs.unit == 'electron'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Working tree must be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean. Commit or stash changes before releasing."
            git status --porcelain
            exit 1
          fi

      - name: Install + test (platform / all)
        if: inputs.unit == 'platform' || inputs.unit == 'all'
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run ui:check
          bun run ui-kit:check
          bun run --cwd packages/ui test:browsers
          bun run ui:test:unit
          bun run electron:test

      - name: Install + test (electron)
        if: inputs.unit == 'electron'
        run: |
          bun install --frozen-lockfile
          bun run electron:test

      - name: Install + test (guardian)
        if: inputs.unit == 'guardian'
        run: |
          bun install --frozen-lockfile
          bun test packages/guardian

  # ── Stamp + commit + push the new version ─────────────────────────────────────
  bump:
    name: Stamp ${{ needs.compute-version.outputs.new_version }}
    needs: [compute-version, preflight]
    if: always() && needs.compute-version.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Stamp unit files
        env:
          UNIT: ${{ inputs.unit }}
          BUMP: ${{ inputs.bump }}
          STAMP: 'true'
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          node scripts/bump-unit.mjs
          bun install

      - name: Preview (dry-run — no commit)
        if: inputs.dry_run
        run: |
          echo "::notice::dry-run — planned changes (not committed):"
          git --no-pager diff --stat || true
          git checkout -- . 2>/dev/null || true

      - name: Commit + push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet; then
            echo "Already at ${VERSION}; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore(release): stamp ${UNIT} to ${VERSION}"
          # Retry with rebase to handle concurrent pushes to the same branch
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

  # ── npm layer ─────────────────────────────────────────────────────────────────
  # skeleton + guardian: published for unit=guardian (thin-host needs both at runtime)
  #                      and unit=platform + unit=all (full coordinated release)
  # lib + cli + ui: platform + all only (guardian npm pkg has no lib dep)
  # NOTE: guardian and skeleton are published independently of lib to avoid
  # blocking the platform regression guard. lib is platform-managed.
  npm-skeleton:
    name: npm @openpalm/skeleton
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'guardian' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/skeleton
      package-name: '@openpalm/skeleton'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      # skeleton is dual-owned (platform + guardian units). If the guardian unit
      # already published this exact version in a coordinated cut, tolerate it
      # instead of failing the whole platform release.
      allow-existing: true
      dry-run: ${{ inputs.dry_run }}

  npm-lib:
    name: npm @openpalm/lib
    needs: [compute-version, bump, npm-skeleton]
    if: always() && needs.bump.result == 'success' && needs.npm-skeleton.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/lib
      package-name: '@openpalm/lib'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-guardian:
    name: npm @openpalm/guardian
    needs: [compute-version, bump, npm-skeleton]
    if: always() && needs.bump.result == 'success' && needs.npm-skeleton.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'guardian' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/guardian
      package-name: '@openpalm/guardian'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      # guardian npm pkg is dual-owned (platform + guardian units). Tolerate an
      # already-published exact version from a coordinated guardian cut.
      allow-existing: true
      dry-run: ${{ inputs.dry_run }}

  npm-cli:
    name: npm openpalm (CLI)
    needs: [compute-version, bump, npm-lib]
    if: always() && needs.bump.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/cli
      package-name: openpalm
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-ui:
    name: npm @openpalm/ui
    needs: [compute-version, bump, npm-lib]
    if: always() && needs.bump.result == 'success' && needs.npm-lib.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/ui
      package-name: '@openpalm/ui'
      needs-build: true
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  # Portal SDK: shared base class + OpenCode client the discord/slack adapters
  # depend on via `"@openpalm/portal-sdk": "workspace:*"` in `dependencies`
  # (NOT devDependencies — this is a real runtime dependency, unlike ui-kit's
  # workspace:* into ui). `bun pm pack` resolves workspace:* to the
  # on-disk version of packages/portal-sdk at pack time, so portal-sdk MUST be
  # published in lockstep with the adapters, and published FIRST (C1, review
  # 2026-07-10: portal-sdk was never added to the DAG, leaving the published
  # 0.13.0-beta.1 discord/slack adapters pinned to an unpublished
  # @openpalm/portal-sdk@0.12.52 — uninstallable).
  npm-portal-sdk:
    name: npm @openpalm/portal-sdk
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: packages/portal-sdk
      package-name: '@openpalm/portal-sdk'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  # Portal adapters: the portal image bun-installs these from npm at runtime
  # (data/portal/tools/package.json + bun update), so a published patch reaches
  # running portals without an image rebuild. Published as `src` only (no build).
  npm-discord-portal:
    name: npm @openpalm/discord-portal
    needs: [compute-version, bump, npm-portal-sdk]
    if: always() && needs.bump.result == 'success' && needs.npm-portal-sdk.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: portals/discord
      package-name: '@openpalm/discord-portal'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  npm-slack-portal:
    name: npm @openpalm/slack-portal
    needs: [compute-version, bump, npm-portal-sdk]
    if: always() && needs.bump.result == 'success' && needs.npm-portal-sdk.result == 'success' && (inputs.unit == 'portals' || inputs.unit == 'all')
    uses: ./.github/workflows/publish-npm-package.yml
    secrets: inherit
    with:
      package-dir: portals/slack
      package-name: '@openpalm/slack-portal'
      version: ${{ needs.compute-version.outputs.new_version }}
      ref: ${{ github.ref_name }}
      exact-version: true
      dry-run: ${{ inputs.dry_run }}

  # ── Docker images ─────────────────────────────────────────────────────────────
  # portal:    images | all | portals+include_images
  # guardian:  images | all | guardian+include_images | platform+include_images
  # assistant: assistant | images | all | platform+include_images
  docker-portal:
    name: Docker openpalm/portal
    needs: [compute-version, bump]
    if: always() && needs.bump.result == 'success' && (inputs.unit == 'images' || inputs.unit == 'all' || (inputs.unit == 'portals' && inputs.include_images))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Stamp local guardian/skeleton sources for dry-run image build
        if: ${{ inputs.dry_run }}
        run: |
          node scripts/set-version.mjs packages/guardian/package.json "${{ needs.compute-version.outputs.new_version }}"
          node scripts/set-version.mjs packages/skeleton/package.json "${{ needs.compute-version.outputs.new_version }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          if docker manifest inspect openpalm/portal:${{ needs.compute-version.outputs.new_version }} > /dev/null 2>&1; then
            echo "ERROR: openpalm/portal:${{ needs.compute-version.outputs.new_version }} already exists on Docker Hub. Refusing to overwrite." >&2
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/portal
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/portal/Dockerfile
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/portal
          cache-to: type=gha,scope=openpalm/portal,mode=max

  docker-guardian:
    name: Docker openpalm/guardian
    needs: [compute-version, bump, npm-guardian, npm-skeleton]
    if: |
      always() &&
      needs.bump.result == 'success' &&
      (inputs.unit == 'images' || inputs.unit == 'all' ||
       ((inputs.unit == 'guardian' || inputs.unit == 'platform') && inputs.include_images)) &&
      needs.npm-guardian.result != 'failure' &&
      needs.npm-skeleton.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Stamp local guardian/skeleton sources for dry-run image build
        if: ${{ inputs.dry_run }}
        run: |
          node scripts/set-version.mjs packages/guardian/package.json "${{ needs.compute-version.outputs.new_version }}"
          node scripts/set-version.mjs packages/skeleton/package.json "${{ needs.compute-version.outputs.new_version }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          if docker manifest inspect openpalm/guardian:${{ needs.compute-version.outputs.new_version }} > /dev/null 2>&1; then
            echo "ERROR: openpalm/guardian:${{ needs.compute-version.outputs.new_version }} already exists on Docker Hub. Refusing to overwrite." >&2
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/guardian
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/guardian/Dockerfile
          build-args: |
            GUARDIAN_VERSION=${{ needs.compute-version.outputs.new_version }}
            GUARDIAN_USE_LOCAL_SOURCE=${{ inputs.dry_run && 'true' || 'false' }}
            SKELETON_USE_LOCAL_SOURCE=${{ inputs.dry_run && 'true' || 'false' }}
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/guardian
          cache-to: type=gha,scope=openpalm/guardian,mode=max

  # unit=assistant is IMAGE-ONLY: its compute-version anchor is
  # containers/assistant/VERSION, a version scheme entirely independent of the
  # platform npm version — bumping it produces e.g. "0.13.1" whether or not
  # @openpalm/skeleton@0.13.1 has ever been published. Pre-I1-fix, that
  # unit-local anchor was baked directly into the image as PLATFORM_VERSION,
  # which the entrypoint uses for `npm install @openpalm/skeleton@$PLATFORM_VERSION`
  # at every container boot — a 404 there bricks the stack silently (I1, review
  # 2026-07-10). npm-skeleton ordering + the preflight below close that gap.
  #
  # The image also bakes @openpalm/ui@$PLATFORM_VERSION (the offline UI floor,
  # Dockerfile ~L191). So this job MUST also wait for npm-ui: on a platform/all
  # cut, @openpalm/ui@$PLATFORM_VERSION is published by npm-ui *within this same
  # run*, and the assistant smoke/build's `npm install @openpalm/ui@$PLATFORM_VERSION`
  # 404s (ETARGET) if it races ahead of that publish (C, run 29955888007:
  # docker-assistant depended only on npm-skeleton and started while npm-ui was
  # still queued). npm-ui is `skipped` for unit=assistant/images (not published
  # in-run), so gate on `!= 'failure'` — the preflight below covers those units.
  docker-assistant:
    name: Docker openpalm/assistant
    needs: [compute-version, bump, npm-skeleton, npm-ui]
    if: |
      always() &&
      needs.bump.result == 'success' &&
      needs.npm-skeleton.result != 'failure' &&
      needs.npm-ui.result != 'failure' &&
      (inputs.unit == 'assistant' || inputs.unit == 'images' || inputs.unit == 'all' || (inputs.unit == 'platform' && inputs.include_images))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Guard — fail if image tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          if docker manifest inspect openpalm/assistant:${{ needs.compute-version.outputs.new_version }} > /dev/null 2>&1; then
            echo "ERROR: openpalm/assistant:${{ needs.compute-version.outputs.new_version }} already exists on Docker Hub. Refusing to overwrite." >&2
            exit 1
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: openpalm/assistant
          tags: |
            type=raw,value=latest,enable=${{ needs.compute-version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.compute-version.outputs.new_version }}
      - name: Resolve platform version for baked skeleton (I1)
        id: platform_version
        env:
          UNIT: ${{ inputs.unit }}
          ANCHOR_VERSION: ${{ needs.compute-version.outputs.new_version }}
        run: |
          if [ "${UNIT}" = 'assistant' ]; then
            # unit=assistant's own anchor (containers/assistant/VERSION) has no
            # relationship to the platform npm version — resolve the actual
            # last-stamped platform version from the root manifest instead
            # (platform releases stamp + publish package.json in lockstep).
            V=$(node -p "require('./package.json').version")
            echo "unit=assistant: PLATFORM_VERSION resolved from root package.json (${V}), NOT the assistant unit anchor (${ANCHOR_VERSION})"
          else
            V="${ANCHOR_VERSION}"
          fi
          echo "platform_version=${V}" >> "$GITHUB_OUTPUT"
      - name: Preflight — baked skeleton + ui must exist on npm (I1)
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ steps.platform_version.outputs.platform_version }}"
          fail=0
          # The assistant image bakes BOTH packages at PLATFORM_VERSION: skeleton
          # (installed at every container boot) and ui (the offline UI floor,
          # Dockerfile ~L191). Both must be published or the smoke/build's
          # `npm install @openpalm/<pkg>@$PLATFORM_VERSION` 404s (ETARGET).
          for PKG in @openpalm/skeleton @openpalm/ui; do
            if npm view "${PKG}@${V}" version >/dev/null 2>&1; then
              echo "OK: ${PKG}@${V} is published"
            else
              echo "::error::${PKG}@${V} is not published on npm — building this image would bake a PLATFORM_VERSION with no installable ${PKG} (I1). Publish it first (unit=platform/all) or pass an explicit --version matching a published release." >&2
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
      # PLATFORM_VERSION is empty on dry-run (rather than the freshly-bumped,
      # never-published-yet version): the preflight above is skipped in
      # dry-run too, so baking the raw version here would still hit the
      # assistant entrypoint's `npm install @openpalm/skeleton@$PLATFORM_VERSION`
      # and fail with an opaque E404 (F13 follow-up, review 2026-07-11). An unset
      # PLATFORM_VERSION is a documented no-op for that entrypoint step.
      - name: Assistant image smoke (amd64 only)
        run: |
          docker build -f containers/assistant/Dockerfile \
            --build-arg PLATFORM_VERSION=${{ !inputs.dry_run && steps.platform_version.outputs.platform_version || '' }} \
            -t openpalm-assistant-smoke:${{ github.run_id }} .
          docker run --rm --entrypoint bash openpalm-assistant-smoke:${{ github.run_id }} \
            -lc 'codex --version && claude --version && pi --version && copilot --version'
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/assistant/Dockerfile
          build-args: |
            PLATFORM_VERSION=${{ !inputs.dry_run && steps.platform_version.outputs.platform_version || '' }}
          platforms: ${{ inputs.dry_run && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ !inputs.dry_run }}
          # Provenance/SBOM attestations add extra manifests + blobs that make
          # Docker Hub's CDN intermittently 400 on large multi-blob pushes.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openpalm/assistant
          cache-to: type=gha,scope=openpalm/assistant,mode=max

  # ── CLI native binaries (platform + all) ─────────────────────────────────────
  cli:
    name: CLI binary (${{ matrix.artifact }})
    needs: [compute-version, bump, npm-skeleton, npm-lib, npm-cli]
    if: always() && needs.bump.result == 'success' && needs.npm-skeleton.result == 'success' && needs.npm-lib.result == 'success' && needs.npm-cli.result == 'success' && (inputs.unit == 'platform' || inputs.unit == 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            artifact: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            artifact: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            artifact: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            artifact: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            artifact: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI binary
        run: bun run --cwd packages/cli ${{ matrix.script }}
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - packages/cli/dist/${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}

  # ── Electron installer ────────────────────────────────────────────────────────
  # Standalone: unit=electron (npm jobs are skipped — condition gates on unit instead)
  # Bundled:    unit=platform with include_electron=true or non-patch bump
  # Always:     unit=all
  electron:
    name: Electron (${{ matrix.platform }})
    needs: [compute-version, bump, npm-skeleton, npm-lib, npm-cli, npm-ui, npm-guardian]
    if: |
      always() &&
      needs.bump.result == 'success' &&
      (
        inputs.unit == 'electron' ||
        (
          needs.npm-skeleton.result == 'success' &&
          needs.npm-lib.result == 'success' &&
          needs.npm-cli.result == 'success' &&
          needs.npm-ui.result == 'success' &&
          needs.npm-guardian.result == 'success' &&
          (inputs.unit == 'all' || (inputs.unit == 'platform' && (inputs.include_electron == true || inputs.bump != 'patch')))
        )
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron_flag: --mac
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
          - os: windows-latest
            platform: win
            electron_flag: --win
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI
        run: bun run ui:build
      - name: Bundle Electron app
        run: bun run --cwd packages/electron bundle
      - name: Build Electron installer
        working-directory: packages/electron
        shell: bash
        run: |
          CLI=$(node -e "console.log(require.resolve('electron-builder/cli.js'))")
          node "$CLI" ${{ matrix.electron_flag }} --publish never
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip

  # ── Git tag + GitHub release (LAST — tag exists = fully published) ────────────
  tag-release:
    name: Tag + GitHub release (LAST)
    needs:
      - compute-version
      - bump
      - npm-skeleton
      - npm-lib
      - npm-guardian
      - npm-cli
      - npm-ui
      - npm-portal-sdk
      - npm-discord-portal
      - npm-slack-portal
      - docker-portal
      - docker-guardian
      - docker-assistant
      - cli
      - electron
    if: |
      always() &&
      !inputs.dry_run &&
      needs.bump.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deploy bundle
        run: |
          VERSION="${{ needs.compute-version.outputs.new_version }}"
          UNIT="${{ inputs.unit }}"
          mkdir -p dist
          tar -czf "dist/openpalm-${UNIT}-${VERSION}-deploy-bundle.tar.gz" \
            containers packages portals scripts README.md

      - name: Download CLI artifacts
        if: inputs.unit == 'platform' || inputs.unit == 'all'
        uses: actions/download-artifact@v8
        with:
          pattern: openpalm-cli-*
          path: dist
          merge-multiple: true

      - name: Download Electron artifacts
        if: inputs.unit == 'platform' || inputs.unit == 'all' || inputs.unit == 'electron'
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          if ls dist/* >/dev/null 2>&1; then
            cd dist && sha256sum * > checksums-sha256.txt
          fi

      - name: Create + push tags
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags origin

          create_tag() {
            local TAG="$1"
            local MSG="$2"
            HEAD_SHA=$(git rev-parse HEAD)
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              EXISTING=$(git rev-list -n1 "${TAG}")
              if [ "${EXISTING}" = "${HEAD_SHA}" ]; then
                echo "Tag ${TAG} already at HEAD — skipping."
              else
                echo "::error::Tag ${TAG} exists at ${EXISTING} but HEAD is ${HEAD_SHA}. Refusing to move it."
                exit 1
              fi
            else
              git tag -a "${TAG}" -m "${MSG}"
              git push origin "${TAG}"
              echo "Created tag: ${TAG}"
            fi
          }

          if [ "${UNIT}" = 'all' ]; then
            # All per-unit prefixed tags + bare X.Y.Z summary (no `v` as of 0.12.41)
            for PREFIX in platform portals assistant guardian electron; do
              create_tag "${PREFIX}-${VERSION}" "Release ${PREFIX} ${VERSION}"
            done
            create_tag "${VERSION}" "All-units release ${VERSION}"
          elif [ "${UNIT}" = 'platform' ]; then
            # Platform releases also create the bare X.Y.Z summary — asset download URLs use this tag
            create_tag "platform-${VERSION}" "Release platform ${VERSION}"
            create_tag "${VERSION}" "Platform release ${VERSION}"
          elif [ "${UNIT}" = 'images' ]; then
            # Docker-only release: tag as images-X.Y.Z (no bare X.Y.Z alias)
            create_tag "images-${VERSION}" "Release images ${VERSION}"
          else
            create_tag "${UNIT}-${VERSION}" "Release ${UNIT} ${VERSION}"
          fi

      - name: Create GitHub releases
        env:
          VERSION: ${{ needs.compute-version.outputs.new_version }}
          UNIT: ${{ inputs.unit }}
          PRERELEASE: ${{ needs.compute-version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          create_release() {
            local TAG="$1"
            local TITLE="$2"
            # Delete existing draft/release at this tag to allow clean republish
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --yes
            fi
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes \
              $( [ "${PRERELEASE}" = 'true' ] && echo '--prerelease' ) \
              dist/* 2>/dev/null || true
            echo "Created GitHub release: ${TAG}"
          }

          if [ "${UNIT}" = 'all' ]; then
            for PREFIX in platform portals assistant guardian electron; do
              create_release "${PREFIX}-${VERSION}" "OpenPalm ${PREFIX} ${VERSION}"
            done
            create_release "${VERSION}" "OpenPalm ${VERSION} (all units)"
          elif [ "${UNIT}" = 'platform' ]; then
            # Mirror the tag step: platform also publishes the bare X.Y.Z release —
            # setup.sh / setup.ps1 download CLI assets from the bare-tag release.
            create_release "platform-${VERSION}" "OpenPalm platform ${VERSION}"
            create_release "${VERSION}" "OpenPalm platform ${VERSION}"
          elif [ "${UNIT}" = 'images' ]; then
            create_release "images-${VERSION}" "OpenPalm images ${VERSION}"
          else
            create_release "${UNIT}-${VERSION}" "OpenPalm ${UNIT} ${VERSION}"
          fi
