name: Release lean OpenPalm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-stamped product version (for example 0.14.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-lean-openpalm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Validate the stamped release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { parseSemver } from './scripts/set-version.mjs';
          const version = process.env.VERSION ?? '';
          const parsed = parseSemver(version);
          if (!parsed) throw new Error(`Invalid version: ${version}`);
          if (process.env.DRY_RUN !== 'true' &&
              process.env.RELEASE_REF !== 'refs/heads/main' &&
              !process.env.RELEASE_REF.startsWith('refs/heads/release/')) {
            throw new Error('Live releases are restricted to main and release/* branches');
          }
          const groups = JSON.parse(readFileSync('.github/release-package-groups.json', 'utf8'));
          const manifests = [...new Set(Object.values(groups.units).flat())];
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, 'utf8')).version;
            if (actual !== version) throw new Error(`${manifest} is ${actual}; expected ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${parsed.pre !== null}\n`);
          NODE

  gates:
    needs: validate
    uses: ./.github/workflows/gates.yml

  images:
    name: Publish ${{ matrix.image }} image
    needs: [validate, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: assistant
            file: containers/assistant/Dockerfile.lean
            build_args: PLATFORM_VERSION=${{ needs.validate.outputs.version }}
          - image: guardian
            file: containers/guardian/Dockerfile
            build_args: GUARDIAN_VERSION=${{ needs.validate.outputs.version }}
          - image: portal
            file: containers/portal/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: openpalm/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          build-args: ${{ matrix.build_args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@v4.1.2
        if: inputs.dry_run != true
        with:
          cosign-release: v3.0.6
      - name: Sign the immutable manifest
        if: inputs.dry_run != true
        run: cosign sign --yes openpalm/${{ matrix.image }}@${{ steps.build.outputs.digest }}

  cli:
    name: Build CLI ${{ matrix.asset }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            asset: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            asset: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            asset: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            asset: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            asset: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/cli ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: packages/cli/dist/${{ matrix.asset }}

  admin:
    name: Build optional admin for ${{ matrix.platform }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: build:mac
          - os: ubuntu-latest
            platform: linux
            script: build:linux
          - os: windows-latest
            platform: windows
            script: build:win
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/electron ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-admin-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip
            packages/electron/dist/packages/*.exe

  claude-extension:
    name: Build optional Claude Desktop extension
    needs: [validate, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/claude-desktop pack
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-claude-desktop
          if-no-files-found: error
          path: packages/claude-desktop/artifacts/openpalm-claude-desktop-${{ needs.validate.outputs.version }}.mcpb

  release:
    needs: [validate, images, cli, admin, claude-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: openpalm-*
          path: dist
          merge-multiple: true
      - name: Verify the Claude Desktop extension is present
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: test -f "dist/openpalm-claude-desktop-${VERSION}.mcpb"
      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lean-release-assets
          path: dist
      - name: Publish immutable GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(release create "${VERSION}" dist/* --title "OpenPalm ${VERSION}" --generate-notes)
          if [ "${PRERELEASE}" = true ]; then args+=(--prerelease --latest=false); fi
          gh "${args[@]}"

  publish-bootstrap:
    needs: [validate, release]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the zero-dependency CLI bootstrap
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "openpalm@${VERSION}" version >/dev/null 2>&1; then
            echo "openpalm@${VERSION} already exists"
            exit 0
          fi
          tag=latest
          case "${VERSION}" in
            *-beta.*) tag=beta ;;
            *-rc.*) tag=rc ;;
            *-*) tag=next ;;
          esac
          npm publish --provenance --access public --tag "${tag}"
