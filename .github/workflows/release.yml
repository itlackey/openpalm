name: Release OpenPalm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-stamped product version (for example 0.14.0-beta.1)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-OpenPalm-openpalm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Validate the stamped release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
          ACTIONS_ORIGIN: ${{ github.server_url }}
          ACTIONS_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { parseSemver } from './scripts/set-version.mjs';
          const version = process.env.VERSION ?? '';
          if (process.env.ACTIONS_ORIGIN !== 'https://github.com' ||
              process.env.ACTIONS_REPOSITORY !== 'itlackey/openpalm') {
            throw new Error('Releases build and publish only on GitHub itlackey/openpalm');
          }
          const parsed = parseSemver(version);
          if (!parsed) throw new Error(`Invalid version: ${version}`);
          if (process.env.DRY_RUN !== 'true' &&
              process.env.RELEASE_REF !== 'refs/heads/main' &&
              !process.env.RELEASE_REF.startsWith('refs/heads/release/') &&
              !(parsed.pre !== null && process.env.RELEASE_REF === 'refs/heads/refactor/lean-stack')) {
            throw new Error('Live stable releases require main/release/*; lean-stack may publish prereleases');
          }
          const release = JSON.parse(readFileSync('.github/release-manifest.json', 'utf8'));
          const manifests = release.manifests;
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, 'utf8')).version;
            if (actual !== version) throw new Error(`${manifest} is ${actual}; expected ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${parsed.pre !== null}\n`);
          NODE

  gates:
    needs: validate
    uses: ./.github/workflows/gates.yml

  images:
    name: Publish ${{ matrix.image }} image
    needs: [validate, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: assistant
            file: containers/assistant/Dockerfile
            build_args: PLATFORM_VERSION=${{ needs.validate.outputs.version }}
          - image: guardian
            file: containers/guardian/Dockerfile
            build_args: GUARDIAN_VERSION=${{ needs.validate.outputs.version }}
          - image: portal
            file: containers/portal/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: existing
        name: Reuse only an immutable image from this commit
        if: inputs.dry_run != true
        env:
          IMAGE: openpalm/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}" > image-manifest.txt 2> image-error.txt; then
            docker pull --platform linux/amd64 "${IMAGE}"
            revision="$(docker image inspect "${IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "${revision}" = "${RELEASE_SHA}" || { echo 'Image tag belongs to another commit; use a new version'; exit 1; }
            digest="$(docker buildx imagetools inspect "${IMAGE}" --format '{{.Manifest.Digest}}')"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif ! grep -qiE 'manifest unknown|not found' image-error.txt; then
            echo 'Cannot determine image tag availability; refusing to overwrite'
            exit 1
          fi
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: openpalm/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          build-args: ${{ matrix.build_args }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@v4.1.2
        if: inputs.dry_run != true
        with:
          cosign-release: v3.0.6
      - name: Sign the immutable manifest
        if: inputs.dry_run != true
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: cosign sign --yes openpalm/${{ matrix.image }}@${DIGEST}

  cli:
    name: Build CLI ${{ matrix.asset }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux-x64
            asset: openpalm-cli-linux-x64
          - os: ubuntu-latest
            script: build:linux-arm64
            asset: openpalm-cli-linux-arm64
          - os: macos-latest
            script: build:darwin-x64
            asset: openpalm-cli-darwin-x64
          - os: macos-latest
            script: build:darwin-arm64
            asset: openpalm-cli-darwin-arm64
          - os: windows-latest
            script: build:windows-x64
            asset: openpalm-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/cli ${{ matrix.script }}
      - name: Smoke the fresh native CLI artifact
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          arch="$(node -p 'process.arch')"
          case "${ASSET}" in
            *"${arch}"|*"${arch}".exe)
              actual="$("./packages/cli/dist/${ASSET}" --version)"
              test "${actual}" = "${VERSION}"
              "./packages/cli/dist/${ASSET}" --help
              ;;
            *) echo "Cross-compiled artifact; native startup covered by the matching runner" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: packages/cli/dist/${{ matrix.asset }}

  admin:
    name: Build optional admin for ${{ matrix.platform }}
    needs: [validate, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: build:mac
          - os: ubuntu-latest
            platform: linux
            script: build:linux
          - os: windows-latest
            platform: windows
            script: build:win
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/electron ${{ matrix.script }}
      - name: Smoke the fresh native Admin package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/smoke-admin-artifact.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-admin-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            packages/electron/dist/packages/*.AppImage
            packages/electron/dist/packages/*.zip
            packages/electron/dist/packages/*.exe

  claude-extension:
    name: Build optional Claude Desktop extension
    needs: [validate, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/claude-desktop pack
      - uses: actions/upload-artifact@v7
        with:
          name: openpalm-claude-desktop
          if-no-files-found: error
          path: packages/claude-desktop/artifacts/openpalm-claude-desktop-${{ needs.validate.outputs.version }}.mcpb

  release:
    needs: [validate, images, cli, admin, claude-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: openpalm-*
          path: dist
          merge-multiple: true
      - name: Verify the Claude Desktop extension is present
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: test -f "dist/openpalm-claude-desktop-${VERSION}.mcpb"
      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums-sha256.txt
      - name: Write manifest and validate the complete release
        env:
          RELEASE_ASSETS_DIR: dist
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/validate-release-assets.mjs --write-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPalm-release-assets
          path: dist
      - name: Publish the verified GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Published versions are immutable; never overwrite their assets.
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version rather than replacing downloads.' >&2
            exit 1
          fi
          args=(release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" --title "OpenPalm ${VERSION}" --generate-notes --draft)
          if [ "${PRERELEASE}" = true ]; then args+=(--prerelease --latest=false); fi
          gh "${args[@]}" dist/*
          # Verify the uploaded files before making the release public.
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir verified-assets
          (cd verified-assets && sha256sum --check --strict checksums-sha256.txt)
          RELEASE_ASSETS_DIR=verified-assets node scripts/validate-release-assets.mjs
          gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

  publish-bootstrap:
    needs: [validate, release]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the zero-dependency CLI bootstrap
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node ../../scripts/publish-bootstrap.mjs
