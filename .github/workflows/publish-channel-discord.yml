name: Publish @openpalm/channel-discord
# Auto-publish-on-merge removed (0.11.0): publishing is explicit — via this
# workflow_dispatch for a standalone patch, or via the platform-release
# orchestrator (workflow_call) for a coordinated release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.0, minor, prerelease). Leave empty for auto patch bump.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (passed by the platform-release orchestrator).'
        required: false
        type: string
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package-dir: packages/channel-discord
      package-name: '@openpalm/channel-discord'
      version: ${{ inputs.version || '' }}
