name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint
