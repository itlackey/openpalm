name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked API keys
        # CI has no real secrets, so varlock scan has nothing to resolve.
        # Use grep patterns on the PR diff for provider-specific key formats.
        # Developers get full varlock scan coverage via the pre-commit hook
        # (install with ./scripts/install-hooks.sh + openpalm install).
        # Patterns: OpenAI (sk-*), Groq (gsk_*), Google (AIza*), 64-char hex tokens.
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            git fetch origin "${BASE_REF}" --depth=1
            DIFF_RANGE="origin/${BASE_REF}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE="${BEFORE}...${SHA}"
            else
              # Initial commit or force-push with no 'before' — scan last commit
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                DIFF_RANGE="HEAD~1...HEAD"
              else
                echo "Single-commit history — scanning full HEAD"
                DIFF_RANGE="HEAD"
              fi
            fi
          fi

          if git diff "$DIFF_RANGE" --unified=0 \
              | grep '^+' | grep -v '^+++' \
              | grep -viE 'sha256|sha_256|checksum|digest|\.tar\.gz|VARLOCK_CHECKSUMS' \
              | grep -qE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{30,}|AIza[A-Za-z0-9_-]{35}|(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$))'; then
            echo "::error::Potential API key or secret detected in PR diff"
            exit 1
          fi
          echo "No obvious API key patterns found."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Type check admin UI
        run: cd packages/ui && bun run check

      - name: Test (sdk + guardian + channels)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bun run test; then
              exit 0
            fi

            if [ "${attempt}" -eq 2 ]; then
              echo "::error::bun run test failed after ${attempt} attempts"
              exit 1
            fi

            echo "::warning::bun run test failed on attempt ${attempt}. Retrying..."
          done

      - name: Validate Docker Compose manifests
        env:
          ADMIN_TOKEN: ci-placeholder
          OP_HOME: ${{ github.workspace }}/.op-home
        run: |
          set -euo pipefail
          mkdir -p "${OP_HOME}/config/stack" "${OP_HOME}/stash/vaults" "${OP_HOME}/state" "${OP_HOME}/cache"
          docker compose -f .openpalm/config/stack/core.compose.yml -f compose.dev.yml config -q

      - name: Assert deleted scripts are absent
        run: |
          set -euo pipefail
          # start.sh was deleted in P1-5 (0.10.0 cleanup). Prevent reintroduction.
          if [ -f ".openpalm/stack/start.sh" ]; then
            echo "::error file=.openpalm/stack/start.sh::.openpalm/stack/start.sh must not exist — deleted in P1-5 cleanup"
            exit 1
          fi
          echo "Deleted script assertion passed"

      - name: Validate shipped addon catalog and automations
        run: |
          set -euo pipefail

          # Full addon validation (compose.yml + .env.schema + conventions)
          ./scripts/validate-registry.sh

          # Also validate catalog automation YAML files are well-formed
          pip install --quiet PyYAML
          errors=0
          for f in .openpalm/state/registry/automations/*.yml; do
            if [ ! -f "$f" ]; then continue; fi
            if ! python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid YAML: $f"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors catalog file(s) failed validation"
            exit 1
          fi
          echo "All stack files validated successfully"

      - name: Validate AKM_CLI_VERSION sync between base and guardian Dockerfiles
        run: |
          set -euo pipefail
          # Guardian uses oven/bun:1.3-slim and pins akm-cli independently from
          # core/base/Dockerfile (the assistant + admin base). The two pins
          # MUST stay in lockstep so a bump to the base image isn't silently
          # left behind in guardian. See finding from 0.11.0 final review.
          BASE_VERSION=$(grep -oP '^ARG AKM_CLI_VERSION=\K\S+' core/base/Dockerfile || true)
          GUARDIAN_VERSION=$(grep -oP '^ARG AKM_CLI_VERSION=\K\S+' core/guardian/Dockerfile || true)
          if [ -z "$BASE_VERSION" ]; then
            echo "::error file=core/base/Dockerfile::Could not extract AKM_CLI_VERSION ARG"
            exit 1
          fi
          if [ -z "$GUARDIAN_VERSION" ]; then
            echo "::error file=core/guardian/Dockerfile::Could not extract AKM_CLI_VERSION ARG"
            exit 1
          fi
          if [ "$BASE_VERSION" != "$GUARDIAN_VERSION" ]; then
            echo "::error::AKM_CLI_VERSION mismatch: core/base/Dockerfile=$BASE_VERSION vs core/guardian/Dockerfile=$GUARDIAN_VERSION — bump both together"
            exit 1
          fi
          echo "AKM_CLI_VERSION matches across base + guardian: $BASE_VERSION"

      - name: Validate OPENCODE_VERSION is declared only in base Dockerfile
        run: |
          set -euo pipefail
          # core/base/Dockerfile is the single source of truth for OPENCODE_VERSION.
          # Admin and assistant images derive from openpalm-base and MUST NOT
          # redeclare ARG OPENCODE_VERSION (which would shadow the base value
          # silently). See finding from 0.11.0 audit #2.
          errors=0
          for df in core/assistant/Dockerfile; do
            if grep -qP '^ARG OPENCODE_VERSION' "$df"; then
              echo "::error file=$df::OPENCODE_VERSION must only be declared in core/base/Dockerfile (single source of truth)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          BASE_OC=$(grep -oP '^ARG OPENCODE_VERSION=\K\S+' core/base/Dockerfile || true)
          if [ -z "$BASE_OC" ]; then
            echo "::error file=core/base/Dockerfile::Could not extract OPENCODE_VERSION ARG"
            exit 1
          fi
          echo "OPENCODE_VERSION pinned only in base: $BASE_OC"

      - name: Validate BUN_VERSION sync between base and guardian/channel Dockerfiles
        run: |
          set -euo pipefail
          # core/base/Dockerfile sets BUN_VERSION (e.g. bun-v1.3.10). Guardian
          # and channel use the official oven/bun:<MAJOR.MINOR>-slim image
          # tag — keep the major.minor in lockstep so a bump in base is not
          # silently left behind in guardian/channel.
          BASE_BUN=$(grep -oP '^ARG BUN_VERSION=\K\S+' core/base/Dockerfile || true)
          if [ -z "$BASE_BUN" ]; then
            echo "::error file=core/base/Dockerfile::Could not extract BUN_VERSION ARG"
            exit 1
          fi
          # bun-v1.3.10 → 1.3
          BASE_MM=$(echo "$BASE_BUN" | sed -E 's/^bun-v//; s/^([0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_MM" ]; then
            echo "::error::Could not parse major.minor from BUN_VERSION=$BASE_BUN"
            exit 1
          fi
          errors=0
          for df in core/guardian/Dockerfile core/channel/Dockerfile; do
            TAG=$(grep -oP '^FROM oven/bun:\K[^ ]+' "$df" || true)
            if [ -z "$TAG" ]; then
              echo "::error file=$df::Could not extract oven/bun image tag"
              errors=$((errors + 1))
              continue
            fi
            # Strip -slim or other suffix to get the version
            TAG_MM=$(echo "$TAG" | sed -E 's/-.*//')
            if [ "$TAG_MM" != "$BASE_MM" ]; then
              echo "::error file=$df::Bun version mismatch: image tag $TAG (major.minor=$TAG_MM) vs base BUN_VERSION major.minor=$BASE_MM — bump together"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "BUN_VERSION major.minor matches across base + guardian + channel: $BASE_MM"

      - name: Validate platform version sync
        run: |
          set -euo pipefail
          ROOT_VERSION=$(jq -r .version package.json)
          mapfile -t PLATFORM_MANIFESTS_ARR < <(jq -r '.platformManifests[]' .github/release-package-groups.json)
          PLATFORM_MANIFESTS="${PLATFORM_MANIFESTS_ARR[*]}"
          errors=0

          for pkg in ${PLATFORM_MANIFESTS}; do
            PKG_VERSION=$(jq -r .version "${pkg}")
            if [ "${PKG_VERSION}" != "${ROOT_VERSION}" ]; then
              echo "::error file=${pkg}::${pkg} version ${PKG_VERSION} does not match root ${ROOT_VERSION}"
              errors=$((errors + 1))
            fi
          done

          # Validate setup script versions match
          SCRIPT_VERSION=$(grep -oP '^SCRIPT_VERSION="\K[^"]+' scripts/setup.sh || true)
          if [ -n "${SCRIPT_VERSION}" ] && [ "${SCRIPT_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error file=scripts/setup.sh::setup.sh SCRIPT_VERSION ${SCRIPT_VERSION} does not match root ${ROOT_VERSION}"
            errors=$((errors + 1))
          fi

          PS1_VERSION=$(grep -oP "^\\\$ScriptVersion = '\K[^']+" scripts/setup.ps1 || true)
          if [ -n "${PS1_VERSION}" ] && [ "${PS1_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error file=scripts/setup.ps1::setup.ps1 ScriptVersion ${PS1_VERSION} does not match root ${ROOT_VERSION}"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::${errors} platform version(s) out of sync with root ${ROOT_VERSION}"
            exit 1
          fi
          echo "All platform versions match: ${ROOT_VERSION}"

  ui-unit-tests:
    name: UI unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (for Vitest browser mode)
        run: npx playwright install --with-deps chromium

      - name: Run UI unit tests
        run: bun run ui:test:unit

  ui-e2e-mocked:
    name: UI mocked E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run mocked Playwright E2E tests
        run: bun run ui:test:e2e:mocked || true
