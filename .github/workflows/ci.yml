name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-hygiene:
    name: Stack hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gate host bind safety defaults
        run: |
          set -euo pipefail
          published=$(grep -nE '^[[:space:]]+- ".*\$\{OP_[A-Z0-9_]+PORT.*:[0-9]+"' packages/skeleton/system/stack/*.yml || true)

          if [ -z "$published" ]; then
            echo "::error::No published port bindings found to validate"
            exit 1
          fi

          violations=$(printf '%s\n' "$published" | grep -vE '127\.0\.0\.1:|:-127\.0\.0\.1\}|:-\$\{OP_BIND_ADDRESS:-127\.0\.0\.1\}' || true)
          if [ -n "$violations" ]; then
            echo "::error::Host port bindings must keep a loopback literal or an innermost :-127.0.0.1 default"
            printf '%s\n' "$violations"
            exit 1
          fi

          echo "All published host binds keep the required loopback defaults."

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # This job builds three Docker images (the assistant image alone bakes a
      # multi-GB tool node_modules — see containers/assistant/Dockerfile) and
      # then boots them with volumes whose entrypoints install more tools at
      # runtime. That footprint has outgrown the stock ubuntu-latest runner:
      # run 29520797034 hit "Free space left: 0 MB" mid-smoke and the guardian
      # died on ENOSPC installing opencode. Reclaim the big preinstalled
      # bundles this job never uses (~20+ GB) before the heavy steps.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          sudo docker image prune -af >/dev/null
          echo "Disk after cleanup:"; df -h /

      - name: Scan for leaked API keys
        # CI has no real secrets, so varlock scan has nothing to resolve.
        # Use grep patterns on the PR diff for provider-specific key formats.
        # Developers get full varlock scan coverage via the pre-commit hook
        # (install with ./scripts/install-hooks.sh + openpalm install).
        # Patterns: OpenAI (sk-*), Groq (gsk_*), Google (AIza*), 64-char hex tokens.
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            git fetch origin "${BASE_REF}" --depth=1
            DIFF_RANGE="origin/${BASE_REF}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE="${BEFORE}...${SHA}"
            else
              # Initial commit or force-push with no 'before' — scan last commit
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                DIFF_RANGE="HEAD~1...HEAD"
              else
                echo "Single-commit history — scanning full HEAD"
                DIFF_RANGE="HEAD"
              fi
            fi
          fi

          if git diff "$DIFF_RANGE" --unified=0 \
              | grep '^+' | grep -v '^+++' \
              | grep -viE 'sha256|sha_256|checksum|digest|\.tar\.gz|VARLOCK_CHECKSUMS' \
              | grep -qE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{30,}|AIza[A-Za-z0-9_-]{35}|(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$))'; then
            echo "::error::Potential API key or secret detected in PR diff"
            exit 1
          fi
          echo "No obvious API key patterns found."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Type check admin UI
        run: cd packages/ui && bun run check

      - name: Type check UI kit
        run: cd packages/ui-kit && bun run check

      - name: Type check CLI
        run: cd packages/cli && bun run typecheck

      - name: Test (sdk + guardian + portals)
        run: bun run test

      - name: Validate Docker Compose manifests
        env:
          OP_HOME: ${{ github.workspace }}/.op-home
        run: |
          set -euo pipefail
          mkdir -p "${OP_HOME}/system/stack" "${OP_HOME}/config/stack" "${OP_HOME}/knowledge/env" "${OP_HOME}/knowledge/secrets" "${OP_HOME}/data"
          docker compose -f packages/skeleton/system/stack/core.compose.yml -f compose.dev.yml config -q

      - name: Validate current rootless non-regression guardrails
        run: ./scripts/validate-rootless-guardrails.sh

      # Build UI + assistant/guardian/portal images ONCE, then run all three
      # rootless smokes against the shared openpalm/*:dev images (each script
      # skips its own build via OP_ROOTLESS_SMOKE_SKIP_BUILD). Previously each
      # smoke rebuilt UI + images, tripling the build wall-clock.
      - name: Build rootless smoke images (once)
        run: |
          source scripts/rootless-smoke-fixture.sh
          smoke_build_images assistant guardian portal

      # The assistant image's intermediate build stages (toolbuild's ~3.5 GB
      # npm tree, the model bundle) stay behind as BuildKit cache after the
      # :dev images are tagged — dead weight that roughly doubles the build's
      # disk cost while the smokes below need room for container volumes.
      # Pruning build cache never touches tagged images.
      - name: Drop Docker build cache before smokes
        run: |
          set -euo pipefail
          docker builder prune -af >/dev/null
          df -h /

      - name: Rootless ownership smoke (assistant+guardian)
        env:
          OP_ROOTLESS_SMOKE_SKIP_BUILD: '1'
        run: ./scripts/rootless-ownership-smoke.sh stack

      - name: Rootless ownership smoke (portal-discord)
        env:
          OP_ROOTLESS_SMOKE_SKIP_BUILD: '1'
        run: ./scripts/rootless-ownership-smoke.sh portal-discord

      - name: Rootless host-swap smoke
        env:
          OP_ROOTLESS_SMOKE_SKIP_BUILD: '1'
        run: ./scripts/rootless-host-swap-smoke.sh

      # S.4: the guardian is the trust boundary, and it must boot with ZERO
      # registry access from its baked packages. This existed but ran nowhere,
      # so its assertions silently rotted (they matched a log line #584
      # reworded) and reported failure on every run with nobody watching.
      - name: Guardian offline-boot smoke (--network none)
        run: ./scripts/guardian-image-offline-smoke.sh

      # Upgrades an install that already exists — the case every other suite
      # misses, because they all build homes from the CURRENT skeleton. Seeds
      # from PUBLISHED skeleton versions on npm, so the set of testable eras
      # grows with each release and nothing has to be maintained by hand.
      # Needs npm; no images (it exercises the home + Docker volumes only).
      - name: Upgrade-path smoke (historical homes + retired-volume reap)
        run: ./scripts/upgrade-path-smoke.sh

      - name: Assert deleted scripts are absent
        run: |
          set -euo pipefail
          # start.sh was deleted in P1-5 (0.10.0 cleanup). Prevent reintroduction.
          if [ -f "packages/skeleton/stack/start.sh" ]; then
            echo "::error file=packages/skeleton/stack/start.sh::packages/skeleton/stack/start.sh must not exist — deleted in P1-5 cleanup"
            exit 1
          fi
          for path in scripts/migrate-0.10-to-0.11.sh scripts/migrate-0.10-to-0.11.ps1; do
            if [ -f "$path" ]; then
              echo "::error file=$path::$path must not exist — use 'openpalm migrate' instead"
              exit 1
            fi
          done
          echo "Deleted script assertion passed"

      - name: Validate shipped catalog automations
        run: |
          set -euo pipefail

          # Catalog automation YAML files are well-formed
          pip install --quiet PyYAML
          errors=0
          for f in packages/skeleton/knowledge/tasks/*.yml; do
            if [ ! -f "$f" ]; then continue; fi
            if ! python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid YAML: $f"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors catalog file(s) failed validation"
            exit 1
          fi
          echo "All stack files validated successfully"

      - name: Validate BUN_VERSION sync between assistant and guardian/portal Dockerfiles
        run: |
          set -euo pipefail
          # Assistant sets BUN_VERSION (e.g. bun-v1.3.10) explicitly. Guardian
          # and portal use the official oven/bun:<MAJOR.MINOR>-slim image
          # tag — keep the major.minor in lockstep across all three.
          ASSISTANT_BUN=$(grep -oP '^ARG BUN_VERSION=\K\S+' containers/assistant/Dockerfile || true)
          if [ -z "$ASSISTANT_BUN" ]; then
            echo "::error file=containers/assistant/Dockerfile::Could not extract BUN_VERSION ARG"
            exit 1
          fi
          # bun-v1.3.10 → 1.3
          ASSISTANT_MM=$(echo "$ASSISTANT_BUN" | sed -E 's/^bun-v//; s/^([0-9]+\.[0-9]+).*/\1/')
          if [ -z "$ASSISTANT_MM" ]; then
            echo "::error::Could not parse major.minor from BUN_VERSION=$ASSISTANT_BUN"
            exit 1
          fi
          errors=0
          for df in containers/guardian/Dockerfile containers/portal/Dockerfile; do
            TAG=$(grep -oP '^FROM oven/bun:\K[^ ]+' "$df" || true)
            if [ -z "$TAG" ]; then
              echo "::error file=$df::Could not extract oven/bun image tag"
              errors=$((errors + 1))
              continue
            fi
            TAG_MM=$(echo "$TAG" | sed -E 's/-.*//')
            if [ "$TAG_MM" != "$ASSISTANT_MM" ]; then
              echo "::error file=$df::Bun version mismatch: image tag $TAG (major.minor=$TAG_MM) vs assistant BUN_VERSION major.minor=$ASSISTANT_MM — bump together"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "BUN_VERSION major.minor matches across assistant + guardian + portal: $ASSISTANT_MM"

      - name: Validate per-unit version sync
        run: |
          set -euo pipefail
          # Releases are by deployment UNIT (release-package-groups.json -> units).
          # Each unit's manifests must share ONE version; units may drift from each
          # other (a host-only or portals-only release is legitimate). The host
          # unit lists package.json (root) first, so the host base == root version,
          # and the setup-script versions are anchored to root.
          ROOT_VERSION=$(jq -r .version package.json)
          errors=0

          for unit in $(jq -r '.units | keys[]' .github/release-package-groups.json); do
            mapfile -t MANS < <(jq -r --arg u "$unit" '.units[$u][]' .github/release-package-groups.json)
            base=""
            for m in "${MANS[@]}"; do
              if [ ! -f "${m}" ]; then
                echo "::error::unit '${unit}' lists missing manifest ${m}"
                errors=$((errors + 1)); continue
              fi
              v=$(jq -r .version "${m}")
              if [ -z "${base}" ]; then base="${v}"; fi
              if [ "${v}" != "${base}" ]; then
                echo "::error file=${m}::${m} version ${v} != unit '${unit}' base ${base}"
                errors=$((errors + 1))
              fi
            done
            echo "unit ${unit} @ ${base:-(image-only)}"
          done

          # Setup scripts track root (root is the first member of the host unit).
          SCRIPT_VERSION=$(grep -oP '^SCRIPT_VERSION="\K[^"]+' scripts/setup.sh || true)
          if [ -n "${SCRIPT_VERSION}" ] && [ "${SCRIPT_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error file=scripts/setup.sh::setup.sh SCRIPT_VERSION ${SCRIPT_VERSION} does not match root ${ROOT_VERSION}"
            errors=$((errors + 1))
          fi

          PS1_VERSION=$(grep -oP "^\\\$ScriptVersion = '\K[^']+" scripts/setup.ps1 || true)
          if [ -n "${PS1_VERSION}" ] && [ "${PS1_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error file=scripts/setup.ps1::setup.ps1 ScriptVersion ${PS1_VERSION} does not match root ${ROOT_VERSION}"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::${errors} version(s) out of sync (intra-unit / setup scripts vs root ${ROOT_VERSION})"
            exit 1
          fi
          echo "All units internally consistent; setup scripts match root ${ROOT_VERSION}"

  ui-unit-tests:
    name: UI unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (for Vitest browser mode)
        # Run through the package where `playwright` is a devDependency so the
        # binary resolves (npx at the repo root can't find the workspace bin → exit 127).
        run: bun run --cwd packages/ui test:browsers

      - name: Run UI unit tests
        run: bun run ui:test:unit

      - name: Run client-only PWA acceptance tests (production build + Chromium)
        run: bun run ui:test:pwa

      - name: Validate thin-harness boundary (design §6.1/§6.6)
        # Asserts every packages/electron/src/*.ts file imports only the
        # @openpalm/lib bootstrap allowlist — a source-level import check, not
        # a grep of the built dist/main.js bundle (removed; see
        # bullshit-claude-wrote.md §5). No build step needed first.
        run: ./scripts/validate-thin-harness-boundary.sh

  electron-tests:
    name: Electron unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build admin-tools
        run: bun run --cwd packages/electron/admin-tools build

      - name: Run Electron unit tests
        run: bun run --cwd packages/electron test
