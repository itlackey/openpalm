schedule: '0 5 * * 0'
enabled: true
description: Compact memory database and remove stale temporary files
tags:
  - openpalm
  - maintenance
timeoutMs: 60000
command:
  - /bin/bash
  - -c
  - |
    DATA_DIR="${OP_HOME:?OP_HOME is required}/data"

    DB="$DATA_DIR/memory/memory.db"
    if [ -f "$DB" ]; then
      sqlite3 "$DB" "VACUUM;" 2>/dev/null || true
    fi

    if [ -d "$OP_HOME/backups" ]; then
      find "$OP_HOME/backups" -type f -mtime +30 -delete 2>/dev/null || true
    fi

    for bdir in "$DATA_DIR"/*/backups; do
      [ -d "$bdir" ] || continue
      find "$bdir" -type f -mtime +30 -delete 2>/dev/null || true
    done
