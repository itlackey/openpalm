# Addon overlay: voice-gpu — opt-in GPU passthrough for the voice service
# defined in compose.yml of this same directory.
#
# Operators include this file in addition to compose.yml when the host has
# nvidia-container-toolkit installed. It flips the image tag to the cu121
# variant and adds a GPU device reservation. Without nvidia-container-toolkit
# on the host, Docker Compose will refuse to start the service with a clear
# error — the base CPU overlay stays usable, just enable it on its own.
#
# Two separate overlays (rather than conditional YAML) keep the assembly
# strictly file-drop per core-principles.md "no template rendering" rule.
services:
  voice:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_IMAGE_TAG:-${OP_IMAGE_TAG:-v0.11.0}-cu121}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
