# Addon: voice — bundled Kokoro TTS + Whisper STT in one container
# (openpalm/voice image). OpenAI-compatible /v1/audio/speech and
# /v1/audio/transcriptions. LAN-only — no host port binding. Other
# services reach it as http://voice:8880 on assistant_net. CPU variant
# by default; layer gpu.compose.yml (same directory) on top to flip to
# the CUDA-12.1 build.
services:
  voice:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_IMAGE_TAG:-${OP_IMAGE_TAG:-v0.11.0}-cpu}
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
    # Loopback-only host binding. The UI server runs on the host (via
    # Electron or `bun run ui serve`) and proxies STT/TTS through
    # /api/transcribe + the chat endpoint; both reach the voice
    # container as http://127.0.0.1:8880. Override the host port via
    # OP_VOICE_PORT_HOST if 8880 is taken; the bind address stays on
    # loopback (no LAN exposure) by default — mirrors the assistant
    # container's pattern.
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-127.0.0.1}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/state/voice/models:/models
    networks: [assistant_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.name: OpenPalm Voice
      openpalm.description: Local Kokoro TTS + Whisper STT (OpenAI-compatible)
      openpalm.icon: mic
      openpalm.category: voice
      openpalm.healthcheck: http://voice:8880/health
