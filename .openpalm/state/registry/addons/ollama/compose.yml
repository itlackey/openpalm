# Addon: Ollama — Local LLM inference server
#
# Hardware variants are exposed as addon-scoped Docker Compose profiles.
# The UI auto-selects the best profile based on GPU detection during setup.
# The chosen profile is persisted to OP_OLLAMA_PROFILE in stack.env.
# composeUp passes --profile $OP_OLLAMA_PROFILE so exactly one variant
# runs at a time. All variants share the network alias "ollama", so
# dependents inside Docker reach the service as http://ollama:11434
# regardless of which profile is active.
#
# No host port binding — the assistant reaches Ollama via Docker network.
# This avoids conflicts with a host Ollama instance.
services:
  ollama:
    profiles: ["addon.ollama.cpu"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OLLAMA_MODELS: /data/models
    volumes:
      - ${OP_HOME}/state/ollama:/data
    networks: [assistant_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server for running AI models
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  ollama-cuda:
    profiles: ["addon.ollama.cuda"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      OLLAMA_MODELS: /data/models
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${OP_HOME}/state/ollama:/data
    networks:
      assistant_net:
        aliases: [ollama]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server on NVIDIA CUDA
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: NVIDIA (CUDA)
      openpalm.profile.requires: nvidia-container-toolkit

  ollama-rocm:
    profiles: ["addon.ollama.rocm"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OLLAMA_MODELS: /data/models
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    volumes:
      - ${OP_HOME}/state/ollama:/data
    networks:
      assistant_net:
        aliases: [ollama]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server on AMD ROCm
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: AMD (ROCm)
      openpalm.profile.requires: amdgpu kernel module
