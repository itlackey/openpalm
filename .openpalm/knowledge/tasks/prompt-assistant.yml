schedule: '0 8 * * *'
enabled: false
description: Example scheduled prompt routed through the optional chat addon
tags:
  - openpalm
  - example
timeoutMs: 60000
command:
  - sh
  - -c
  - >-
    curl -fsS -X POST 'http://replace-me/v1/chat/completions' -H 'Content-Type:
    application/json' -d
    '{"model":"default","messages":[{"role":"user","content":"Good morning. Give me a brief summary of system health and any open tasks."}]}'
