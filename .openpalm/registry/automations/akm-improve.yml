# akm-improve.yml — Periodic AKM stash maintenance pass
#
# Runs `akm improve` daily at 03:00 UTC. The `improve` command performs the
# slow LLM maintenance work that AKM 0.8.0 split out of `akm index`:
#
#   - Memory inference (turns pending memories into structured entries)
#   - Graph extraction (links related notes)
#   - SM-2 reflect/distill cooldowns
#   - Schema repair and consolidation
#
# Plain `akm index` no longer needs its own automation: it runs as a fast
# post-step inside `improve`, and on every `akm remember` / import call.
#
# Toggle enrichment without removing this file by editing the akm config:
#   akm config set index.infer false   # disables memory inference
#   akm config set index.graph false   # disables graph extraction
#
# This automation is seeded at install time into ~/.openpalm/config/automations/
# and is preserved across re-installs (existing user edits are never overwritten).
#
# TODO: remove `--auto-accept safe` and the AKM_CONFIG_DIR/config.json seeding
# step once akm-cli ships `AKM_LLM_PROXY_CMD` (see #345 / akm-cli upstream).
# When the upstream proxy hook lands, akm can borrow the OpenCode host's
# existing provider connection and this automation will need no LLM wiring.

name: akm-improve
description: Run akm improve to consolidate memories, run inference, and update graph extraction
schedule: "0 3 * * *"
enabled: true

action:
  type: shell
  command:
    - akm
    - improve
    - --auto-accept
    - safe
    - --timeout-ms
    - "3600000"
  # 1h cap; akm's default is 2h but unattended runs should fail fast and retry
  # tomorrow rather than block the scheduler for hours on a hung LLM call.
  timeout: 3600000

on_failure: log
