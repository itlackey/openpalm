# OpenPalm first-party channel services.
# Services are gated by Compose profiles (addon.chat, addon.api,
# addon.discord, addon.slack). Enable profiles through the OpenPalm CLI/UI or
# by passing --profile manually.

services:
  guardian-api:
    profiles: ["addon.chat", "addon.api"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:${OP_GUARDIAN_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "${OP_CHAT_BIND_ADDRESS:-${OP_BIND_ADDRESS:-127.0.0.1}}:${OP_CHAT_PORT:-3820}:8182"
      - "${OP_API_BIND_ADDRESS:-${OP_BIND_ADDRESS:-127.0.0.1}}:${OP_API_PORT:-3821}:8182"
    environment:
      PORT: "8182"
      GUARDIAN_SERVICE_MODE: openai-api
      GUARDIAN_URL: http://guardian:8080
      OPENCODE_BASE_URL: ${API_OPENCODE_BASE_URL:-http://guardian:8080/oc}
      PRINCIPAL_ID: ${API_PRINCIPAL_ID:-api}
      PRINCIPAL_SECRET_FILE: ${API_PRINCIPAL_SECRET_FILE:-/run/secrets/channel_api_secret}
    secrets: [channel_api_secret]
    networks: [portal_net]
    depends_on:
      guardian:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  discord:
    profiles: ["addon.discord"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/portal:${OP_PORTAL_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      PORT: "8184"
      PORTAL_NAME: "Discord Bot"
      OPENCODE_BASE_URL: ${DISCORD_OPENCODE_BASE_URL:-http://guardian:8080/oc}
      PRINCIPAL_ID: ${DISCORD_PRINCIPAL_ID:-discord}
      PRINCIPAL_SECRET_FILE: ${DISCORD_PRINCIPAL_SECRET_FILE:-/run/secrets/channel_discord_secret}
      CHANNEL_PACKAGE: "@openpalm/discord-portal"
      # Rich-UX streaming (live tokens + tool reactions + interactive prompts via
      # the guardian /oc proxy) is ON by default. Set DISCORD_STREAMING=false to
      # fall back to the buffered single-response path.
      DISCORD_STREAMING: "${DISCORD_STREAMING:-true}"
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_ALLOWED_GUILDS: ${DISCORD_ALLOWED_GUILDS:-}
      DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_BLOCKED_USERS: ${DISCORD_BLOCKED_USERS:-}
      DISCORD_REGISTER_COMMANDS: ${DISCORD_REGISTER_COMMANDS:-}
      DISCORD_THREAD_TTL_HOURS: ${DISCORD_THREAD_TTL_HOURS:-}
      DISCORD_FORWARD_TIMEOUT_MS: ${DISCORD_FORWARD_TIMEOUT_MS:-}
    secrets: [channel_discord_secret, discord_bot_token]
    networks: [portal_net]
    depends_on:
      guardian:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8184' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  slack:
    profiles: ["addon.slack"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/portal:${OP_PORTAL_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      PORT: "8185"
      PORTAL_NAME: "Slack Bot"
      OPENCODE_BASE_URL: ${SLACK_OPENCODE_BASE_URL:-http://guardian:8080/oc}
      PRINCIPAL_ID: ${SLACK_PRINCIPAL_ID:-slack}
      PRINCIPAL_SECRET_FILE: ${SLACK_PRINCIPAL_SECRET_FILE:-/run/secrets/channel_slack_secret}
      CHANNEL_PACKAGE: "@openpalm/slack-portal"
      # Rich-UX streaming is ON by default. Set SLACK_STREAMING=false to fall
      # back to the buffered single-response path.
      SLACK_STREAMING: "${SLACK_STREAMING:-true}"
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      SLACK_BLOCKED_USERS: ${SLACK_BLOCKED_USERS:-}
    secrets: [channel_slack_secret, slack_bot_token, slack_app_token]
    networks: [portal_net]
    depends_on:
      guardian:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8185' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  guardian:
    profiles: ["addon.chat", "addon.api", "addon.discord", "addon.slack", "addon.gateway"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:${OP_GUARDIAN_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      HOME: /opt/openpalm/guardian
      PORT: "8080"
      GUARDIAN_DIRECT_PORT: "3830"
      GUARDIAN_ADMIN_PORT: "3831"
      OP_ASSISTANT_URL: http://assistant:4096
      OPENCODE_TIMEOUT_MS: "0"
      # OpenCode global config (opencode.jsonc) lives in OP_HOME/config/guardian,
      # bind-mounted at /etc/opencode below.
      OPENCODE_CONFIG_DIR: /etc/opencode
      # Content validation (LLM-assisted moderation of inbound messages).
      # OFF by default: fail-closed policy means an unreachable moderator blocks
      # suspicious traffic, so enabling it requires a configured moderation model
      # in config/guardian/opencode.jsonc. The moderator runs on loopback :4097.
      GUARDIAN_CONTENT_VALIDATION: ${GUARDIAN_CONTENT_VALIDATION:-0}
      GUARDIAN_MODERATION_URL: http://127.0.0.1:4097
      GUARDIAN_MODERATION_PORT: "4097"
      GUARDIAN_MODERATION_TIMEOUT_MS: ${GUARDIAN_MODERATION_TIMEOUT_MS:-4000}
      GUARDIAN_MODERATION_THRESHOLD: ${GUARDIAN_MODERATION_THRESHOLD:-3}
      GUARDIAN_AUDIT_PATH: /opt/openpalm/logs/guardian-audit.log
      GUARDIAN_REQUIRE_CHANNEL_SECRETS: "true"
      GUARDIAN_DIRECT_INGRESS: ${GUARDIAN_DIRECT_INGRESS:-false}
      GUARDIAN_MCP: ${GUARDIAN_MCP:-false}
      GUARDIAN_ADMIN_TOKEN_FILE: /run/secrets/op_guardian_admin_token
      GUARDIAN_MCP_TOKEN_FILE: /run/secrets/op_guardian_mcp_token
      CHANNEL_CHAT_SECRET_FILE: /run/secrets/channel_chat_secret
      CHANNEL_API_SECRET_FILE: /run/secrets/channel_api_secret
      CHANNEL_DISCORD_SECRET_FILE: /run/secrets/channel_discord_secret
      CHANNEL_SLACK_SECRET_FILE: /run/secrets/channel_slack_secret
    ports:
      - "${OP_BIND_ADDRESS:-127.0.0.1}:${OP_GUARDIAN_PORT:-3830}:3830"
      - "127.0.0.1:${OP_GUARDIAN_ADMIN_PORT:-3831}:3831"
    volumes:
      - ${OP_HOME}/data/guardian:/opt/openpalm/guardian
      - ${OP_HOME}/data/logs:/opt/openpalm/logs
      # OpenCode global config (opencode.jsonc, instructions). Operator-managed,
      # bind-mounted as the OPENCODE_CONFIG_DIR for guardian OpenCode instances.
      - ${OP_HOME}/config/guardian:/etc/opencode
      # Shared OpenCode provider credentials (read-only). Same file the
      # assistant mounts, so any OpenCode instance in the guardian uses the
      # same provider configuration. HOME=/opt/openpalm/guardian, so OpenCode
      # resolves auth.json under $HOME/.local/share/opencode/.
      - ${OP_HOME}/knowledge/secrets/auth.json:/opt/openpalm/guardian/.local/share/opencode/auth.json:ro
    secrets:
      - channel_chat_secret
      - channel_api_secret
      - channel_discord_secret
      - channel_slack_secret
      - op_guardian_admin_token
      - op_guardian_mcp_token
    networks: [portal_net, channel_lan, assistant_net]
    depends_on:
      assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  channel_chat_secret:
    file: ${OP_HOME}/knowledge/secrets/channel_chat_secret
  channel_api_secret:
    file: ${OP_HOME}/knowledge/secrets/channel_api_secret
  channel_discord_secret:
    file: ${OP_HOME}/knowledge/secrets/channel_discord_secret
  discord_bot_token:
    file: ${OP_HOME}/knowledge/secrets/discord_bot_token
  channel_slack_secret:
    file: ${OP_HOME}/knowledge/secrets/channel_slack_secret
  slack_bot_token:
    file: ${OP_HOME}/knowledge/secrets/slack_bot_token
  slack_app_token:
    file: ${OP_HOME}/knowledge/secrets/slack_app_token
  op_guardian_admin_token:
    file: ${OP_HOME}/knowledge/secrets/op_guardian_admin_token
  op_guardian_mcp_token:
    file: ${OP_HOME}/knowledge/secrets/op_guardian_mcp_token
