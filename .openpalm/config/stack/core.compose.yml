# OpenPalm — Core Services
#
# This file defines the core infrastructure. Addon services are added
# via compose overlays in config/stack/addons/.
#
# Docker Compose reads variable values via --env-file for two env files:
#   config/stack/stack.env    — system config (admin token, ports, image tag)
#   config/stack/guardian.env — channel HMAC secrets (loaded by guardian)
#
# User-managed env secrets live in the akm `vault:user` store at
# stash/vaults/user.env (akm-cli >= 0.8.0 layout). The assistant
# entrypoint sources that file at startup via `akm vault path vault:user`.
#
# Directory model:
#   ~/.openpalm/config/       — user-editable + system config (stack.env, auth.json, akm/)
#   ~/.openpalm/cache/        — regenerable data (akm cache, rollback)
#   ~/.openpalm/state/        — persistent service data (assistant, guardian, logs, registry)
#   ~/.openpalm/stash/        — akm knowledge (skills, vaults, agents) — vault:user lives here
#   ~/.openpalm/workspace/    — shared work area
#   ~/.openpalm/config/stack/ — compose runtime (core.compose.yml, addons/, env files)

services:
  # ── Assistant (opencode runtime — NO docker socket) ────────────────
  assistant:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/assistant:${OP_IMAGE_TAG:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # OpenCode reads project config (opencode.jsonc) and user config (opencode.json)
      # from OPENCODE_CONFIG_DIR. Use the /etc/openpalm/assistant path because
      # /etc/openpalm is a top-level bind mount that works on all Docker variants.
      # The old /home/opencode/.config/opencode mount was nested inside the home
      # bind mount and silently failed on snap Docker's userns-remap setup.
      OPENCODE_CONFIG_DIR: /etc/openpalm/assistant
      OPENCODE_PORT: "4096"
      # Auth is disabled because the assistant is only reachable via the
      # internal assistant_net Docker network and the host port binding
      # defaults to 127.0.0.1 (loopback-only). Guardian communicates with
      # the assistant over assistant_net without credentials, and the
      # scheduler now runs as a co-process inside this container so it
      # reaches OpenCode via http://localhost:4096.
      # If you change OP_ASSISTANT_BIND_ADDRESS to 0.0.0.0, you MUST set
      # OP_OPENCODE_PASSWORD in stack.env and set OPENCODE_AUTH to "true".
      # NON-CHANGE (#388 §B.1): OP_OPENCODE_PASSWORD compose plumbing
      # is intentional for the LAN-exposed assistant case. Do NOT strip
      # it as part of vault cleanup.
      OPENCODE_AUTH: "false"
      OPENCODE_ENABLE_SSH: ${OPENCODE_ENABLE_SSH:-0}
      TERM: xterm-256color
      HOME: /home/opencode
      OP_HOME: /openpalm
      # akm-cli XDG layout (AKM 0.8.0+). akm does NOT derive .data/.state/.config
      # from AKM_STASH_DIR — each path resolves independently against XDG/HOME
      # fallbacks. We pin all four explicitly so admin and assistant share the
      # same stash root AND the same index/state/config (otherwise they would
      # silently diverge into per-container HOME-based defaults). Cache is
      # separately bind-mounted so registry artifacts survive container
      # recreate (regenerable but expensive to refetch).
      AKM_STASH_DIR: /akm
      AKM_CONFIG_DIR: /etc/openpalm/akm
      AKM_DATA_DIR: /akm-op/data
      AKM_STATE_DIR: /akm-op/state
      AKM_CACHE_DIR: /akm-cache
      OP_ASSISTANT_TOKEN: ${OP_ASSISTANT_TOKEN:-}
      OP_UID: ${OP_UID:-1000}
      OP_GID: ${OP_GID:-1000}
      OPENCODE_API_URL: http://localhost:4096
      # Provider credentials live in OpenCode's auth.json (bind-mounted
      # below) — NOT in this env block. The Connections tab and the setup
      # wizard both call OpenCode's PUT /auth/{providerID}; ai-sdk picks
      # the key up via OpenCode at call time.
    ports:
      - "${OP_ASSISTANT_BIND_ADDRESS:-127.0.0.1}:${OP_ASSISTANT_PORT:-3800}:4096"
      # SSH port (2222 → :22) is published only when the `ssh` addon is
      # enabled. The overlay at registry/addons/ssh/compose.yml adds the
      # port binding and flips OPENCODE_ENABLE_SSH=1 so sshd starts
      # inside the container. See registry/addons/ssh/README.md for the
      # security implications (passwordless sudo, key-only auth).
    volumes:
      - ${OP_HOME}/config:/etc/openpalm
      - ${OP_HOME}/config/auth.json:/home/opencode/.local/share/opencode/auth.json
      - ${OP_HOME}/state/assistant:/home/opencode
      # AKM mount paths. Defaults to OP_HOME-relative dirs; override via
      # OP_AKM_STASH/DATA/STATE/CACHE/CONFIG in stack.env to share the
      # host's own akm environment with the assistant container.
      - ${OP_AKM_STASH:-${OP_HOME}/stash}:/akm
      - ${OP_AKM_DATA:-${OP_HOME}/state/akm}:/akm-op/data
      - ${OP_AKM_STATE:-${OP_HOME}/state/akm}:/akm-op/state
      - ${OP_AKM_CACHE:-${OP_HOME}/cache/akm}:/akm-cache
      - ${OP_AKM_CONFIG:-${OP_HOME}/config/akm}:/etc/openpalm/akm
      - ${OP_HOME}/workspace:/work
      - ${OP_HOME}/state/logs/opencode:/home/opencode/.local/state/opencode
      - ${OP_HOME}/state/logs:/openpalm/logs
      # Persistent install prefix. Survives `docker compose up --force-recreate`
      # and image upgrades, unlike apt installs which go to the container's
      # writable layer. Anything installed with a prefix (cargo install --root,
      # go install with GOBIN, make install PREFIX=…, curl-to-/opt/persistent/bin)
      # persists here. The Dockerfile puts /opt/persistent/bin on PATH.
      - assistant-persistent:/opt/persistent
    networks: [ assistant_net ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4096/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Guardian ────────────────────────────────────────────────────────
  # Channel HMAC secrets are loaded via env_file so newly installed
  # channels automatically receive their credentials without modifying
  # this file. Installing a channel triggers a guardian recreate (~2 s).
  guardian:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:${OP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: ${OP_HOME}/config/stack/guardian.env
        required: false
    environment:
      HOME: /app/data
      PORT: "8080"
      OP_ASSISTANT_URL: http://assistant:4096
      OPENCODE_TIMEOUT_MS: "0"
      GUARDIAN_AUDIT_PATH: /app/audit/guardian-audit.log
      GUARDIAN_SECRETS_PATH: /app/secrets/guardian.env
      OPENCODE_AUTH_JSON: /etc/openpalm/auth.json
    ports:
      - "${OP_GUARDIAN_BIND_ADDRESS:-127.0.0.1}:${OP_GUARDIAN_PORT:-8180}:8080"
    volumes:
      - ${OP_HOME}/state/guardian:/app/data
      - ${OP_HOME}/state/logs:/app/audit
      - ${OP_HOME}/config/stack/guardian.env:/app/secrets/guardian.env:ro
      - ${OP_HOME}/config/auth.json:/etc/openpalm/auth.json:ro
    networks: [ channel_lan, assistant_net ]
    depends_on:
      assistant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Channel networks: services join channel_lan (LAN-restricted) to reach
# the guardian. Public exposure is opt-in per-service via host port bindings.
networks:
  channel_lan:
  assistant_net:

volumes:
  # Persistent install prefix for assistant-managed tools. See the comment
  # on the assistant service for usage.
  assistant-persistent:
