# OpenPalm first-party optional services.
# Services are gated by Compose profiles (addon.ollama.*, addon.voice.*, addon.ssh).

services:
  ollama:
    profiles: ["addon.ollama.cpu"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OLLAMA_MODELS: /data/models
    volumes:
      - ${OP_HOME}/data/ollama:/data
    networks: [assistant_net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server for running AI models
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  ollama-cuda:
    profiles: ["addon.ollama.cuda"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      OLLAMA_MODELS: /data/models
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${OP_HOME}/data/ollama:/data
    networks:
      assistant_net:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server on NVIDIA CUDA
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: NVIDIA (CUDA)
      openpalm.profile.requires: nvidia-container-toolkit

  ollama-rocm:
    profiles: ["addon.ollama.rocm"]
    image: ollama/ollama:latest
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OLLAMA_MODELS: /data/models
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    volumes:
      - ${OP_HOME}/data/ollama:/data
    networks:
      assistant_net:
        aliases: [ollama]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.name: Ollama
      openpalm.description: Local LLM inference server on AMD ROCm
      openpalm.icon: cpu
      openpalm.category: ai
      openpalm.profile.label: AMD (ROCm)
      openpalm.profile.requires: amdgpu kernel module

  voice:
    profiles: ["addon.voice.cpu"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}-cpu}
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-127.0.0.1}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    networks: [assistant_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.name: OpenPalm Voice
      openpalm.description: Local Kokoro TTS + Whisper STT (OpenAI-compatible)
      openpalm.icon: mic
      openpalm.category: voice
      openpalm.healthcheck: http://voice:8880/health
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  voice-cuda:
    profiles: ["addon.voice.cuda"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}-cu121}
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-127.0.0.1}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    networks:
      assistant_net:
        aliases: [voice]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.name: OpenPalm Voice
      openpalm.description: Kokoro TTS + Whisper STT on NVIDIA CUDA 12.1
      openpalm.icon: mic
      openpalm.category: voice
      openpalm.healthcheck: http://voice:8880/health
      openpalm.profile.label: NVIDIA (CUDA 12.1)
      openpalm.profile.requires: nvidia-container-toolkit

  voice-rocm:
    profiles: ["addon.voice.rocm"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_IMAGE_TAG:-${OP_IMAGE_TAG:-latest}-rocm6}
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-127.0.0.1}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    networks:
      assistant_net:
        aliases: [voice]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.name: OpenPalm Voice
      openpalm.description: Kokoro TTS + Whisper STT on AMD ROCm 6.x
      openpalm.icon: mic
      openpalm.category: voice
      openpalm.healthcheck: http://voice:8880/health
      openpalm.profile.label: AMD (ROCm 6.x)
      openpalm.profile.requires: amdgpu kernel module
