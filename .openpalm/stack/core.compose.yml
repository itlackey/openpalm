# OpenPalm — Core Services
#
# This file defines the core infrastructure. Addon services are added
# via compose overlays in stack/addons/.
#
# Docker Compose reads variable values via --env-file for two env files:
#   vault/stack/stack.env    — system config, API keys, OP_CAP_* capabilities
#   vault/stack/guardian.env  — channel HMAC secrets (loaded by guardian)
#
# User-managed env secrets live in the akm `vault:user` store at
# data/stash/vaults/user.env (akm-cli >= 0.8.0 layout). The assistant
# entrypoint sources that file at startup via `akm vault path vault:user`
# — see Phase 2 of #388 / closed by #406. The legacy
# vault/user/user.env compose env_file was retired; on upgrade it is
# migrated into akm and deleted.
#
# Directory model (v0.11.0):
#   ~/.openpalm/config/       — user-editable, non-secret configuration
#   ~/.openpalm/vault/stack/   — system-managed secrets (stack.env, guardian.env)
#   ~/.openpalm/vault/user/    — operational files only (apprise.yml, gws/gcloud/mgc auth dirs)
#   ~/.openpalm/data/stash/   — akm-cli stash (skills, vaults, etc.) — vault:user lives here
#   ~/.openpalm/data/          — service-managed persistent data
#   ~/.openpalm/logs/          — consolidated audit/debug output

services:
  # ── Init (pre-create data directories with correct ownership) ──────
  # Ensures all data/ and logs/ subdirectories exist before services
  # start, preventing Docker from creating them as root.
  # Core dirs are listed explicitly; addon dirs are discovered
  # dynamically from stack/addons/.
  init:
    image: busybox:latest
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    restart: "no"
    command: ["sh", "-c",
      "umask 077 && mkdir -p /data/guardian-stash /data/guardian-stash/.data /data/guardian-stash/.state /data/guardian-stash/.config /data/guardian-cache && umask 022 && mkdir -p /data/assistant /data/guardian /data/scheduler /data/scheduler/triggers /data/stash /data/stash/.data /data/stash/.state /data/stash/.config /data/akm-cache /data/workspace /logs/opencode && ls /addons 2>/dev/null | xargs -I{} mkdir -p /data/{}"]
    volumes:
      - ${OP_HOME}/data:/data
      - ${OP_HOME}/logs:/logs
      - ${OP_HOME}/stack/addons:/addons:ro

  # ── Assistant (opencode runtime — NO docker socket) ────────────────
  assistant:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/assistant:${OP_IMAGE_TAG:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OPENCODE_CONFIG_DIR: /etc/opencode
      OPENCODE_PORT: "4096"
      # Auth is disabled because the assistant is only reachable via the
      # internal assistant_net Docker network and the host port binding
      # defaults to 127.0.0.1 (loopback-only). Guardian communicates with
      # the assistant over assistant_net without credentials, and the
      # scheduler now runs as a co-process inside this container so it
      # reaches OpenCode via http://localhost:4096.
      # If you change OP_ASSISTANT_BIND_ADDRESS to 0.0.0.0, you MUST set
      # OP_OPENCODE_PASSWORD in stack.env and set OPENCODE_AUTH to "true".
      # NON-CHANGE (#388 §B.1): OP_OPENCODE_PASSWORD compose plumbing
      # is intentional for the LAN-exposed assistant case. Do NOT strip
      # it as part of vault cleanup.
      OPENCODE_AUTH: "false"
      OPENCODE_ENABLE_SSH: ${OPENCODE_ENABLE_SSH:-0}
      TERM: xterm-256color
      HOME: /home/opencode
      OP_HOME: /openpalm
      # akm-cli XDG layout (AKM 0.8.0+). akm does NOT derive .data/.state/.config
      # from AKM_STASH_DIR — each path resolves independently against XDG/HOME
      # fallbacks. We pin all four explicitly so admin and assistant share the
      # same stash root AND the same index/state/config (otherwise they would
      # silently diverge into per-container HOME-based defaults). Cache is
      # separately bind-mounted so registry artifacts survive container
      # recreate (regenerable but expensive to refetch).
      AKM_STASH_DIR: /akm
      AKM_DATA_DIR: /akm/.data
      AKM_STATE_DIR: /akm/.state
      AKM_CACHE_DIR: /akm-cache
      AKM_CONFIG_DIR: /akm/.config
      OP_ADMIN_API_URL: ${OP_ADMIN_API_URL:-}
      OP_ASSISTANT_TOKEN: ${OP_ASSISTANT_TOKEN:-}
      OP_UID: ${OP_UID:-1000}
      OP_GID: ${OP_GID:-1000}
      # Scheduler co-process — runs inside this container, reads
      # automations from /openpalm/config/automations and watches sentinels
      # in /openpalm/data/scheduler/triggers. Uses OP_HOME from above.
      OPENCODE_API_URL: http://localhost:4096
      # Provider API keys (resolved from stack.env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Capability resolution (used by entrypoint.sh to drop unused provider keys).
      OP_CAP_LLM_PROVIDER: ${OP_CAP_LLM_PROVIDER:-}
      # Google Cloud credentials (file lives in vault/user, mounted at /etc/vault).
      # NOTE: the /etc/vault mount no longer carries `user.env` (Phase 2 of #388
      # routed that through akm `vault:user`). The mount remains because gws and
      # gcloud rely on it for their auth directories below.
      GOOGLE_APPLICATION_CREDENTIALS: /etc/vault/gcloud-credentials.json
      CLOUDSDK_CONFIG: /etc/vault/.gcloud
      # Google Workspace CLI (gws) — config dir persists OAuth tokens across restarts.
      # Only set CONFIG_DIR here. Do NOT set CREDENTIALS_FILE — if it points to a
      # missing plaintext JSON, gws fails even when encrypted creds exist in the
      # config dir. Letting gws discover creds via CONFIG_DIR works for all methods.
      GOOGLE_WORKSPACE_CLI_CONFIG_DIR: /etc/vault/.gws
      GOOGLE_WORKSPACE_PROJECT_ID: ${GOOGLE_WORKSPACE_PROJECT_ID:-}
    ports:
      - "${OP_ASSISTANT_BIND_ADDRESS:-127.0.0.1}:${OP_ASSISTANT_PORT:-3800}:4096"
      # SSH port (2222 → :22) is published only when the `ssh` addon is
      # enabled. The overlay at registry/addons/ssh/compose.yml adds the
      # port binding and flips OPENCODE_ENABLE_SSH=1 so sshd starts
      # inside the container. See registry/addons/ssh/README.md for the
      # security implications (passwordless sudo, key-only auth).
    volumes:
      - ${OP_HOME}/config:/etc/openpalm
      - ${OP_HOME}/config/assistant:/home/opencode/.config/opencode
      - ${OP_HOME}/vault/stack/auth.json:/home/opencode/.local/share/opencode/auth.json
      - ${OP_HOME}/vault/user:/etc/vault
      - ${OP_HOME}/vault/user/apprise.yml:/etc/apprise/apprise.yml
      - ${OP_HOME}/data/assistant:/home/opencode
      # Shared akm stash: assistant and admin both mount this rw so they
      # can read/write the same skills, commands, memories, and vaults.
      - ${OP_HOME}/data/stash:/akm
      # Persistent akm cache (registry index, downloaded artifacts). Shared
      # with admin since both query the same registries.
      - ${OP_HOME}/data/akm-cache:/akm-cache
      - ${OP_HOME}/data/workspace:/work
      - ${OP_HOME}/logs/opencode:/home/opencode/.local/state/opencode
      # Scheduler co-process needs read-only access to automation
      # definitions and read/write access to its trigger sentinels.
      - ${OP_HOME}/config:/openpalm/config:ro
      - ${OP_HOME}/data/scheduler:/openpalm/data/scheduler
      - ${OP_HOME}/logs:/openpalm/logs
    working_dir: /work
    networks: [ assistant_net ]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4096/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Guardian ────────────────────────────────────────────────────────
  # Channel HMAC secrets are loaded via env_file so newly installed
  # channels automatically receive their credentials without modifying
  # this file. Installing a channel triggers a guardian recreate (~2 s).
  guardian:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:${OP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: ${OP_HOME}/vault/stack/guardian.env
        required: false
    environment:
      HOME: /app/data
      PORT: "8080"
      OP_ASSISTANT_URL: http://assistant:4096
      OPENCODE_TIMEOUT_MS: "0"
      GUARDIAN_AUDIT_PATH: /app/audit/guardian-audit.log
      GUARDIAN_SECRETS_PATH: /app/secrets/guardian.env
      # Guardian has its own isolated akm stash for operator-only artifacts
      # (channel HMAC vaults, audit notes). NOT shared with admin/assistant.
      # See assistant block for the rationale behind pinning all four dirs.
      AKM_STASH_DIR: /akm-guardian
      AKM_DATA_DIR: /akm-guardian/.data
      AKM_STATE_DIR: /akm-guardian/.state
      AKM_CACHE_DIR: /akm-cache
      AKM_CONFIG_DIR: /akm-guardian/.config
    volumes:
      - ${OP_HOME}/data/guardian:/app/data
      - ${OP_HOME}/logs:/app/audit
      - ${OP_HOME}/vault/stack/guardian.env:/app/secrets/guardian.env:ro
      # Operator-only akm stash (NOT shared with admin or assistant).
      - ${OP_HOME}/data/guardian-stash:/akm-guardian
      # Operator-only akm cache (isolated from the shared admin/assistant cache).
      - ${OP_HOME}/data/guardian-cache:/akm-cache
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    networks: [ channel_lan, assistant_net ]
    depends_on:
      assistant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Channel networks: services join channel_lan (LAN-restricted) to reach
# the guardian. Public exposure is opt-in per-service via host port bindings.
networks:
  channel_lan:
  assistant_net:
