# Voice LAN-access overlay — grants the voice addon assistant_net.
#
# Opt-in, default OFF: included only when the operator turns on
# OP_VOICE_LAN_ACCESS (state/stack.env), checked by discoverStackOverlays
# (packages/lib/src/control-plane/config-persistence.ts) via
# isVoiceLanAccessEnabled (packages/lib/src/control-plane/
# voice-host-probes.ts). Applied on EVERY compose invocation once the
# setting is on — `openpalm start`, an update, the settings-save recreate —
# not just the voice addon's own bring-up. See config-persistence.ts's
# comment at the discoverStackOverlays call site for why it has to live
# there and not in the voice bring-up engine's one-off file list.
#
# ── Why this does not weaken the addon trust boundary ──────────────────
# services.compose.yml states the rule: addon services join addon_net, NOT
# assistant_net, "so a compromised addon image cannot reach the assistant's
# OpenCode API (:4096)" — with one stated per-service exception: ollama,
# granted assistant_net because "that inference path needs shared-network
# reachability" (S.6b / D3(b)). Voice was excluded on the stated grounds
# that it "needs no assistant reachability at all" — true for the LOOPBACK
# topology, where the UI host process reaches voice over 127.0.0.1 and
# never through a container network at all.
#
# THAT premise is what changes here, and only on explicit operator opt-in:
# the container-served UI (containers/assistant) has no loopback path to a
# sibling container — it can only reach voice over a shared Docker network —
# so serving /voice to LAN browsers through that co-process needs exactly
# the reachability ollama already has. Granting it follows the boundary's
# own per-service-exception rule; it does not bypass it. Voice is also a
# FIRST-PARTY image (containers/voice/), where ollama — already granted the
# same exception — is third-party. No other addon's network membership
# changes, and voice's DEFAULT posture (this file absent from the compose
# invocation) stays addon_net-only.
#
# ── Why every service restates its COMPLETE network set ────────────────
# `voice` uses short-form `networks: [addon_net]`; `voice-cuda` and
# `voice-rocm` use long-form with `aliases: [voice]` (services.compose.yml).
# Compose's merge semantics for a service whose network field is a sequence
# in one file and a mapping in another are not something this repo can
# verify without Docker (no environment here runs `docker compose config`
# against this overlay). Restating the full set — the original network(s)
# plus assistant_net, with the original alias carried over where one
# existed — makes the result correct whether Compose merges the two files'
# maps or the last file simply wins.
services:
  voice:
    networks: [addon_net, assistant_net]
  voice-cuda:
    networks:
      addon_net:
        aliases: [voice]
      assistant_net:
        aliases: [voice]
  voice-rocm:
    networks:
      addon_net:
        aliases: [voice]
      assistant_net:
        aliases: [voice]
