# OpenPalm first-party optional services.
# Services are gated by Compose profiles (addon.ollama.*, addon.voice.*).
#
# Addon trust boundary (S.6b / D3(b)): addon services join addon_net, NOT
# assistant_net, so a compromised addon image cannot reach the assistant's
# OpenCode API (:4096) over a shared bridge. The only exception is ollama, which
# the assistant reaches as its LLM provider over the Docker DNS name ollama:11434
# — that inference path needs shared-network reachability, so ollama is granted
# assistant_net per service. voice needs no assistant reachability at all: the UI
# host process reaches it over its published loopback port (127.0.0.1:8880), so
# voice stays on addon_net only.

services:
  ollama:
    profiles: ["addon.ollama.cpu"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      # Bind the data dir at ollama's native data path ($HOME/.ollama), not a
      # generic /data root. HOME drives that path; ollama persists its models,
      # blobs, manifests, and server key there. The host dir is created owned by
      # the operator UID (the container's `user:`), so the non-root process can
      # write — incl. on OrbStack, which preserves real UIDs (issue #452).
      HOME: /home/ollama
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    # Per-service exception: the assistant reaches ollama as its LLM provider over
    # ollama:11434, so ollama needs assistant_net reachability (S.6b / D3(b)).
    networks: [assistant_net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  ollama-cuda:
    profiles: ["addon.ollama.cuda"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      # Native data path ($HOME/.ollama), not a generic /data root — HOME drives
      # it so models + server key persist in the bind mount (issue #452).
      HOME: /home/ollama
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    networks:
      assistant_net:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: NVIDIA (CUDA)
      openpalm.profile.requires: nvidia-container-toolkit

  ollama-rocm:
    profiles: ["addon.ollama.rocm"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      # Native data path ($HOME/.ollama), not a generic /data root — HOME drives
      # it so models + server key persist in the bind mount (issue #452).
      HOME: /home/ollama
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    networks:
      assistant_net:
        aliases: [ollama]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: AMD (ROCm)
      openpalm.profile.requires: amdgpu kernel module

  voice:
    profiles: ["addon.voice.cpu"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-cpu
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-${OP_BIND_ADDRESS:-127.0.0.1}}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network: voice is reached only by the UI
    # host over its published loopback port (127.0.0.1:8880), never in-container by
    # the assistant, so it needs no assistant reachability (S.6b / D3(b)).
    networks: [addon_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  voice-cuda:
    profiles: ["addon.voice.cuda"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-cu121
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-${OP_BIND_ADDRESS:-127.0.0.1}}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network (S.6b / D3(b)); reached only by the
    # UI host over the published loopback port 127.0.0.1:8880.
    networks:
      addon_net:
        aliases: [voice]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: NVIDIA (CUDA 12.1)
      openpalm.profile.requires: nvidia-container-toolkit

  voice-rocm:
    profiles: ["addon.voice.rocm"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-rocm6
    restart: unless-stopped
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-${OP_BIND_ADDRESS:-127.0.0.1}}:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network (S.6b / D3(b)); reached only by the
    # UI host over the published loopback port 127.0.0.1:8880.
    networks:
      addon_net:
        aliases: [voice]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: AMD (ROCm 6.x)
      openpalm.profile.requires: amdgpu kernel module
