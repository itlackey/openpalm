# OpenPalm first-party optional services.
# Services are gated by Compose profiles (addon.ollama.*, addon.voice.*, addon.paperclip).
#
# Addon trust boundary (S.6b / D3(b)): addon services join addon_net, NOT
# assistant_net, so a compromised addon image cannot reach the assistant's
# OpenCode API (:4096) over a shared bridge. The exceptions are ollama and
# tunnel. ollama is reached by the assistant as its LLM provider over the
# Docker DNS name ollama:11434 — that inference path needs shared-network
# reachability, so ollama is granted assistant_net per service. tunnel is not
# a general addon at all: it is an INGRESS PATH for the two first-party
# services it fronts (assistant, guardian), so it gets the same per-service
# exception for the same reason — see the tunnel service below. Be precise
# about what that exception costs, though: tunnel runs THIRD-PARTY CODE (the
# upstream tailscale/tailscale image), so this puts a non-OpenPalm process on
# the same bridge as the assistant's OpenCode API. It is first-party-CHOSEN,
# not first-party-written, and what bounds the risk is blast radius rather
# than authorship — the image is digest-pinned (no floating tag can re-point
# it), it runs rootless with zero added capabilities and zero device mounts,
# it publishes no host port, and it receives exactly one secret (ts_authkey,
# delegated). Same caveat applies to ollama's exception above. voice needs no assistant reachability at all BY DEFAULT: the
# UI host process reaches it over its published loopback port (127.0.0.1:8880),
# so voice stays on addon_net only here. An operator who turns on
# OP_VOICE_LAN_ACCESS opts into the same per-service exception ollama has —
# see voice.compose.lan.yml (this directory) for why that is not a boundary
# weakening.

services:
  # Upstream cannot cold-start its embedded Postgres in its own image, and this
  # one-shot repairs that before paperclip runs.
  #
  # `embedded-postgres` hardcodes `--lc-messages=en_US.UTF-8` when it shells out
  # to initdb (paperclip's own `initdbFlags` are `--encoding=UTF8 --locale=C`,
  # and a later flag does NOT rescue the earlier bad one). The paperclip image
  # is Debian glibc 2.41 carrying only `C`, `C.utf8` and `POSIX`, so initdb
  # exits 1 with `invalid locale name "en_US.UTF-8"` on any FRESH data
  # directory. The library forwards only initdb's stdout to its log and drops
  # stderr, so the container just crash-loops with two banner lines and
  # "The data directory might already exist" — naming neither the locale nor
  # the real error. An install whose cluster already exists is unaffected,
  # which is why this hid: initdb never runs again.
  #
  # The fix is the smallest thing that makes the name resolve: alias the
  # image's OWN `C.utf8` under the name initdb demands, and mount it at glibc's
  # DEFAULT lookup path. Not `LOCPATH`: the library spawns initdb with
  # `env: { LC_MESSAGES }` and nothing else, wiping the container environment,
  # so no variable set here can reach the process that needs it — the locale
  # has to be somewhere glibc looks without being told. Copying the image's own
  # locale keeps it byte-compatible with the glibc that will read it — no
  # generated locale, no vendored binaries, no rebuilt image (this file does
  # not rebuild upstream images, and must not start). It only ever affects
  # `--lc-messages`, the language of initdb's own messages, which paperclip
  # already asks to be `C` anyway.
  #
  # Idempotent, and NOT a persistent service: it exits 0 and paperclip waits on
  # that. Remove this once upstream stops demanding a locale it does not ship.
  paperclip-locale:
    profiles: ["addon.paperclip"]
    image: ghcr.io/paperclipai/paperclip:sha-59e29af@sha256:048034718f9922e3c1eb168f21c3fc6f4d3e1689ad7e1dd13322a331217d8457
    restart: "no"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        target=/paperclip/.locale/en_US.UTF-8
        if [ ! -d "$$target" ]; then
          mkdir -p /paperclip/.locale
          cp -r /usr/lib/locale/C.utf8 "$$target"
          echo "materialized en_US.UTF-8 from the image's C.utf8 at $$target"
        else
          echo "en_US.UTF-8 already present at $$target"
        fi
    volumes:
      - ${OP_HOME}/data/paperclip:/paperclip
    networks: [addon_net]

  paperclip:
    profiles: ["addon.paperclip"]
    depends_on:
      paperclip-locale:
        condition: service_completed_successfully
    # Upstream image, digest-pinned — the same third-party pattern as ollama and
    # tunnel above. OpenPalm does NOT rebuild it. Paperclip's OpenCode adapter
    # gets AKM through user-owned OpenCode config and the published plugin; the
    # small compatibility launcher there reuses OpenCode's embedded Bun runtime.
    # Upstream publishes no semver tag, so the digest is the pin and the
    # `sha-` tag records which upstream commit it came from.
    image: ghcr.io/paperclipai/paperclip:sha-59e29af@sha256:048034718f9922e3c1eb168f21c3fc6f4d3e1689ad7e1dd13322a331217d8457
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    ports:
      - "127.0.0.1:${OP_PAPERCLIP_PORT:-3840}:3100"
    volumes:
      - ${OP_HOME}/data/paperclip:/paperclip
      # The `en_US.UTF-8` alias the paperclip-locale one-shot materialized, at
      # glibc's default lookup path so initdb resolves it with no environment.
      - ${OP_HOME}/data/paperclip/.locale/en_US.UTF-8:/usr/lib/locale/en_US.UTF-8:ro
      # User settings, read-only managed bootstrap, and a mutable regenerable
      # runtime config. OpenCode may install exact-pinned plugin dependencies,
      # but it never writes into lifecycle-owned system/.
      - ${OP_HOME}/config/paperclip/opencode:/paperclip/.config/opencode:ro
      - ${OP_HOME}/system/paperclip:/opt/openpalm/paperclip:ro
      - ${OP_HOME}/cache/paperclip-opencode/runtime:/etc/opencode
      - ${OP_HOME}/config/paperclip/akm:/etc/akm
      # Paperclip shares ordinary knowledge, but its nested mounts obscure the
      # assistant's canonical /stash/secrets and /stash/env directories.
      - ${OP_HOME}/knowledge:/stash
      - ${OP_HOME}/knowledge/paperclip/secrets:/stash/secrets
      - ${OP_HOME}/knowledge/paperclip/env:/stash/env
      - ${OP_HOME}/data/paperclip-akm/cache:/opt/akm/cache
      - ${OP_HOME}/data/paperclip-akm/data:/opt/akm/data
    env_file:
      - ${OP_HOME}/private/env/paperclip.env
    # HOST/PORT/SERVE_UI/PAPERCLIP_HOME/PAPERCLIP_CONFIG are baked upstream with
    # these exact values and are purely operational, so they are not restated
    # here. The two below ARE restated even though upstream also sets them:
    # they are the security posture (login required, not internet-facing), and
    # that must not silently depend on a third-party image's ENV default across
    # a digest bump. The compose contract test asserts them here.
    environment:
      # Paperclip's model preflight can normalize HOME from passwd. XDG keeps
      # that preflight and the eventual OpenCode run on the same global config.
      XDG_CONFIG_HOME: /paperclip/.config
      OPENCODE_CONFIG_DIR: /etc/opencode
      OPENCODE_STRICT_CONFIG_DEPS: "1"
      AKM_BUNDLE_DIR: /stash
      AKM_CONFIG_DIR: /etc/akm
      AKM_CACHE_DIR: /opt/akm/cache
      AKM_DATA_DIR: /opt/akm/data
      AKM_STATE_DIR: /opt/akm/data/state
      # The read-only managed launchers remain authoritative. OpenCode installs
      # exact-pinned config dependencies and the akm shim into node_modules.
      PATH: "/opt/openpalm/paperclip/bin:/etc/opencode/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/games:/usr/games"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      # Loopback-only publication means the browser origin is always localhost.
      PAPERCLIP_PUBLIC_URL: http://localhost:${OP_PAPERCLIP_PORT:-3840}
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:${OP_PAPERCLIP_PORT:-3840},http://localhost:${OP_PAPERCLIP_PORT:-3840}
      # Telemetry is OFF unless the operator opts in. The interpolation
      # default is "1" (disabled) so an install predating this key, or a
      # hand-run `docker compose` without the generated row, still gets
      # telemetry off — the unset case is never the permissive one.
      PAPERCLIP_TELEMETRY_DISABLED: ${OP_TELEMETRY_DISABLED:-1}
      DO_NOT_TRACK: ${OP_TELEMETRY_DISABLED:-1}
    networks: [addon_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  ollama:
    profiles: ["addon.ollama.cpu"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      # Bind the data dir at ollama's native data path ($HOME/.ollama), not a
      # generic /data root. HOME drives that path; ollama persists its models,
      # blobs, manifests, and server key there. The host dir is created owned by
      # the operator UID (the container's `user:`), so the non-root process can
      # write — incl. on OrbStack, which preserves real UIDs (issue #452).
      HOME: /home/ollama
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    # Per-service exception: the assistant reaches ollama as its LLM provider over
    # ollama:11434, so ollama needs assistant_net reachability (S.6b / D3(b)).
    networks: [assistant_net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  ollama-cuda:
    profiles: ["addon.ollama.cuda"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      # Native data path ($HOME/.ollama), not a generic /data root — HOME drives
      # it so models + server key persist in the bind mount (issue #452).
      HOME: /home/ollama
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    networks:
      assistant_net:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: NVIDIA (CUDA)
      openpalm.profile.requires: nvidia-container-toolkit

  ollama-rocm:
    profiles: ["addon.ollama.rocm"]
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      # Native data path ($HOME/.ollama), not a generic /data root — HOME drives
      # it so models + server key persist in the bind mount (issue #452).
      HOME: /home/ollama
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    volumes:
      - ${OP_HOME}/data/ollama:/home/ollama/.ollama
    networks:
      assistant_net:
        aliases: [ollama]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      openpalm.profile.label: AMD (ROCm)
      openpalm.profile.requires: amdgpu kernel module

  voice:
    profiles: ["addon.voice.cpu"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-cpu
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
    # Loopback ONLY, as a literal — never a variable. Voice serves an
    # OpenAI-compatible API (no UI) that the UI process reaches through its
    # same-origin /voice pass-through, so no host port ever needs opening for
    # it. Under the retired cascade a hand-set global bind published a GPU
    # inference API to the LAN as a side effect.
    ports:
      - "127.0.0.1:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network: voice is reached only by the UI
    # host over its published loopback port (127.0.0.1:8880), never in-container by
    # the assistant, so it needs no assistant reachability (S.6b / D3(b)).
    networks: [addon_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: CPU
      openpalm.profile.default: "true"

  voice-cuda:
    profiles: ["addon.voice.cuda"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-cu121
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    runtime: nvidia
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # Loopback ONLY, as a literal — never a variable. Voice serves an
    # OpenAI-compatible API (no UI) that the UI process reaches through its
    # same-origin /voice pass-through, so no host port ever needs opening for
    # it. Under the retired cascade a hand-set global bind published a GPU
    # inference API to the LAN as a side effect.
    ports:
      - "127.0.0.1:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network (S.6b / D3(b)); reached only by the
    # UI host over the published loopback port 127.0.0.1:8880.
    networks:
      addon_net:
        aliases: [voice]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: NVIDIA (CUDA 12.1)
      openpalm.profile.requires: nvidia-container-toolkit

  voice-rocm:
    profiles: ["addon.voice.rocm"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/voice:${OP_VOICE_VERSION:-latest}-rocm6
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      OP_VOICE_PORT: "8880"
      OP_VOICE_WHISPER_MODEL: "${OP_VOICE_WHISPER_MODEL:-base.en}"
      OP_VOICE_KOKORO_VOICE: "${OP_VOICE_KOKORO_VOICE:-bf_isabella}"
      OP_VOICE_LOG_LEVEL: "${OP_VOICE_LOG_LEVEL:-info}"
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    # Loopback ONLY, as a literal — never a variable. Voice serves an
    # OpenAI-compatible API (no UI) that the UI process reaches through its
    # same-origin /voice pass-through, so no host port ever needs opening for
    # it. Under the retired cascade a hand-set global bind published a GPU
    # inference API to the LAN as a side effect.
    ports:
      - "127.0.0.1:${OP_VOICE_PORT_HOST:-8880}:8880"
    volumes:
      - ${OP_HOME}/data/voice/models:/models
    # Segmented off the assistant trust network (S.6b / D3(b)); reached only by the
    # UI host over the published loopback port 127.0.0.1:8880.
    networks:
      addon_net:
        aliases: [voice]
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      openpalm.profile.label: AMD (ROCm 6.x)
      openpalm.profile.requires: amdgpu kernel module

  tunnel:
    # PROVIDER VARIANT of the `remote` addon (was the bare `addon.remote`
    # profile): remote access is one capability with mutually-exclusive
    # provider variants, selected by OP_REMOTE_PROFILE — see
    # packages/lib/src/control-plane/remote-providers.ts. Tailscale is the
    # DEFAULT variant: resolveActiveProfiles (compose-args.ts) falls back to
    # this profile for an enabled `remote` with no stored selection, so a
    # hand-edited OP_ENABLED_ADDONS=remote still deploys this service. The
    # labels below are display metadata for the provider selector, not what
    # decides deployment.
    profiles: ["addon.remote.tailscale"]
    labels:
      openpalm.profile.label: Tailscale
      openpalm.profile.default: "true"
    # Pinned to a specific release PLUS its multi-arch manifest-list digest
    # (same convention as ollama above), never `:latest` and never the
    # `:stable` floating tag Tailscale itself recommends for this image — a
    # floating tag means a plain `docker compose pull` silently re-points this
    # INGRESS path at whatever Tailscale shipped that week, with no changelog
    # review and no way to roll back to a known-good build. v1.98.10 was the
    # newest tagged release at the time this was pinned; the digest was
    # resolved from Docker Hub's registry API (not invented).
    image: tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Rootless, like every other service in the shipped stack (a convention
    # portal-rootless.test.ts pins). The upstream image ships no USER
    # directive and defaults to root, so this is a deliberate downgrade, and
    # it needs TS_SOCKET below to work — see that comment. containerboot has
    # no euid/setuid gate of its own; TS_USERSPACE=true is what removes
    # tailscaled's need for CAP_NET_ADMIN/CAP_NET_RAW and /dev/net/tun, which
    # are the only things that would genuinely force root here. Both bind
    # mounts below are created operator-owned by ensureHomeDirs, the same
    # precondition ollama's HOME dir relies on above.
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    # Becomes the tailnet node name — what shows up in `tailscale status` and
    # what resolves at https://<hostname>.<tailnet>.ts.net. Sourced from
    # OP_REMOTE_HOSTNAME so resolveRemoteHostname's project-name derivation
    # (remote-access.ts) and this container's actual registered name can never
    # drift apart from each other.
    #
    # The `:-openpalm` fallback is a LAST RESORT that should never be reached:
    # reconcileRemoteAccess (remote-apply.ts) pins OP_REMOTE_HOSTNAME into
    # state/stack.env during applyHome, before any compose command runs, and it
    # pins the PROJECT-NAME-derived value. Registering under a bare "openpalm"
    # here instead would be worse than cosmetic — a second stack on the same
    # host would collide with the first, and Tailscale resolves a node-name
    # collision by permanently appending "-1", so the control plane would
    # advertise a URL that belongs to the wrong stack (or to nothing at all).
    hostname: ${OP_REMOTE_HOSTNAME:-openpalm}
    environment:
      # `file:` is resolved by `tailscale up` itself, at the moment it reads
      # this var — the key is read from the mounted secret file and used once,
      # so it never lands in stack.env, container argv, or `docker inspect`'s
      # environment dump the way a literal value would.
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      # Tailscale's ipn.ServeConfig JSON document (resolveServeConfig in
      # remote-access.ts derives its contents), inside the mounted /config
      # directory — see the volumes comment below for why /config has to be a
      # directory mount, not a file mount, for this path to actually work.
      TS_SERVE_CONFIG: /config/serve.json
      # Tailnet node identity + keys, persisted across restarts — see the
      # volumes comment below for why /var/lib/tailscale also has to be a
      # directory mount.
      TS_STATE_DIR: /var/lib/tailscale
      # REQUIRED because of the rootless `user:` above. tailscaled's default
      # LocalAPI socket is /var/run/tailscale/tailscaled.sock, and /var/run is
      # root-owned, so a non-root tailscaled cannot create that directory and
      # fails to start. containerboot threads TS_SOCKET straight through as
      # `--socket=` to both tailscaled AND every `tailscale` CLI call it makes
      # (cmd/containerboot/tailscaled.go), so pointing it at a writable path
      # is the whole fix. containerboot still tries to symlink this back to
      # the default location for CLI convenience and only warns when it
      # cannot — non-fatal, and expected here.
      #
      # CONSEQUENCE FOR CALLERS: anything shelling into this container must
      # pass the socket explicitly, e.g.
      #   docker compose exec -T tunnel tailscale --socket=/tmp/tailscaled.sock status --json
      # A bare `tailscale status` looks at the default path, finds nothing,
      # and reports the tunnel as down even when it is healthy.
      TS_SOCKET: /tmp/tailscaled.sock
      # The default, stated explicitly (so a future Tailscale default change
      # can't silently flip this addon's operating mode). Keeps this sidecar
      # off /dev/net/tun and away from NET_ADMIN entirely: zero extra Linux
      # capabilities, zero device mounts. That is also what makes the tunnel
      # work unmodified on Docker Desktop for Mac/Windows, where there is no
      # real host network namespace to grant a TUN device into.
      TS_USERSPACE: "true"
      # Turns on containerboot's built-in HTTP health endpoint so container
      # health is observable the same way every other service in this file is
      # (`docker compose ps`, `docker inspect`) instead of "process is still
      # running" being the only signal available.
      TS_ENABLE_HEALTH_CHECK: "true"
      # The health endpoint is consumed only by this container's Compose
      # healthcheck, so keep it off both Docker networks.
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    volumes:
      # Both mounts MUST be DIRECTORIES, never a bind of a single file at its
      # final path, for two independent reasons:
      #   1. containerboot registers an fsnotify watch on the DIRECTORY
      #      holding TS_SERVE_CONFIG and hard-fails at startup if that watch
      #      cannot be added — there is no directory to watch if /config
      #      itself is a single-file mount.
      #   2. The control plane rewrites serve.json with the same atomic
      #      temp-file + rename pattern (writeFileAtomic) used everywhere else
      #      in this codebase. A single-file bind mount pins the CONTAINER's
      #      view to the inode that existed at container-create time; a
      #      rename-based rewrite replaces that inode on the HOST side, and a
      #      container that mounted the old file directly keeps reading the
      #      stale, now-unlinked copy forever. Mounting the parent directory
      #      instead means the container resolves the path fresh on every
      #      read and sees the rename.
      #
      # NOTE the /config source is under state/, NOT beside these compose files
      # in system/stack/. system/ is the managed tree and is replaced wholesale
      # from the release skeleton on every update; a generated config kept
      # there would be deleted by the next update, taking the directory
      # containerboot watches with it (see remoteServeConfigDir in home.ts).
      - ${OP_HOME}/state/remote:/config
      - ${OP_HOME}/data/tunnel:/var/lib/tailscale
    secrets: [ts_authkey]
    # Reaches BOTH possible targets — the per-service trust-boundary exception
    # explained at the top of this file, restated here: assistant_net to dial
    # http://assistant:3000, and portal_net because guardian (the OTHER
    # possible target, at http://guardian:3830) lives on portal_net, not on
    # assistant_net — see portals.compose.yml. Which target(s) are actually
    # proxied at runtime is decided by OP_REMOTE_TARGET / resolveServeConfig
    # (remote-access.ts), not by network membership; this line only grants the
    # reachability either choice might need.
    networks: [assistant_net, portal_net]
    # NO ports: block, deliberately. This sidecar publishes NOTHING on the
    # host — it only dials OUT to Tailscale's coordination servers and relays
    # inbound tailnet traffic back over that same outbound connection. LAN
    # exposure (OP_UI_BIND_ADDRESS / OP_GUARDIAN_BIND_ADDRESS) and tailnet/
    # internet exposure (this addon) are meant to compose independently, and
    # never publishing a host port here is what keeps them orthogonal: turning
    # `remote` on can never widen what is reachable on the LAN, because it
    # changes nothing about the host's published bind addresses.
    #
    # NO depends_on: either. guardian is profile-gated (portals.compose.yml,
    # profiles: addon.chat/addon.api/addon.discord/addon.slack/addon.gateway)
    # and is routinely excluded from a given `--profile` selection. A
    # depends_on naming a service that the active profile set excludes is a
    # project-level Compose PARSE error — it breaks `docker compose ps` and
    # `docker compose down` for the ENTIRE stack, not just this service. tunnel
    # dials out and retries its connection to whichever target(s) are
    # configured on its own, so it does not need to wait on either one being
    # up first.
    healthcheck:
      # v1.98.10's containerboot endpoint returns 200 only after the node has
      # a tailnet IP; an unauthenticated container therefore cannot report
      # ready merely because containerboot is still running.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # containerboot's startup context is 60s; do not count its startup
      # failures while it is authenticating and applying serve config.
      start_period: 60s

secrets:
  # `ts_authkey` is a DELEGATED secret (packages/lib/src/control-plane/
  # secrets-files.ts DELEGATED_SECRET_NAMES) — it lives under private/secrets/,
  # NOT knowledge/secrets/, because it is a tailnet JOIN credential: anything
  # that can read it can enroll an arbitrary device onto the operator's own
  # tailnet, which reaches every other device the operator has signed in
  # there, not just this assistant. It must stay out of the assistant-visible
  # /stash tree the same way the guardian/portal secrets do. Declared here
  # (not only referenced) so this file stands alone for `docker compose
  # config` when services.compose.yml is the only file naming the secret in a
  # given invocation — same reasoning as opencode_server_password in
  # portals.compose.yml.
  ts_authkey:
    file: ${OP_HOME}/private/secrets/ts_authkey
