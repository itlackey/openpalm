# OpenPalm first-party portal services.
# Services are gated by Compose profiles (addon.chat, addon.api,
# addon.discord, addon.slack). Enable profiles through the OpenPalm CLI/UI or
# by passing --profile manually.

services:
  discord:
    profiles: ["addon.discord"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/portal:${OP_PORTAL_VERSION:?OP_PORTAL_VERSION is required}
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      PORT: "8184"
      PORTAL_NAME: "Discord Bot"
      OPENCODE_BASE_URL: ${DISCORD_OPENCODE_BASE_URL:-http://guardian:8080/oc}
      PRINCIPAL_ID: ${DISCORD_PRINCIPAL_ID:-discord}
      PRINCIPAL_SECRET_FILE: ${DISCORD_PRINCIPAL_SECRET_FILE:-/run/secrets/portal_discord_secret}
      PORTAL_PACKAGE: "@openpalm/discord-portal"
      # Rich-UX streaming (live tokens + tool reactions + interactive prompts via
      # the guardian /oc proxy) is ON by default. Set DISCORD_STREAMING=false to
      # fall back to the buffered single-response path.
      DISCORD_STREAMING: "${DISCORD_STREAMING:-true}"
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_ALLOWED_GUILDS: ${DISCORD_ALLOWED_GUILDS:-}
      DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_BLOCKED_USERS: ${DISCORD_BLOCKED_USERS:-}
      DISCORD_REGISTER_COMMANDS: ${DISCORD_REGISTER_COMMANDS:-}
      DISCORD_THREAD_TTL_HOURS: ${DISCORD_THREAD_TTL_HOURS:-}
      DISCORD_FORWARD_TIMEOUT_MS: ${DISCORD_FORWARD_TIMEOUT_MS:-}
    secrets: [portal_discord_secret, discord_bot_token]
    networks: [portal_net]
    depends_on:
      guardian:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8184' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  slack:
    profiles: ["addon.slack"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/portal:${OP_PORTAL_VERSION:?OP_PORTAL_VERSION is required}
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      PORT: "8185"
      PORTAL_NAME: "Slack Bot"
      OPENCODE_BASE_URL: ${SLACK_OPENCODE_BASE_URL:-http://guardian:8080/oc}
      PRINCIPAL_ID: ${SLACK_PRINCIPAL_ID:-slack}
      PRINCIPAL_SECRET_FILE: ${SLACK_PRINCIPAL_SECRET_FILE:-/run/secrets/portal_slack_secret}
      PORTAL_PACKAGE: "@openpalm/slack-portal"
      # Rich-UX streaming is ON by default. Set SLACK_STREAMING=false to fall
      # back to the buffered single-response path.
      SLACK_STREAMING: "${SLACK_STREAMING:-true}"
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
      SLACK_BOT_NAME: ${SLACK_BOT_NAME:-}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      SLACK_BLOCKED_USERS: ${SLACK_BLOCKED_USERS:-}
    secrets: [portal_slack_secret, slack_bot_token, slack_app_token]
    networks: [portal_net]
    depends_on:
      guardian:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8185' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  guardian:
    profiles: ["addon.chat", "addon.api", "addon.discord", "addon.slack", "addon.gateway"]
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:${OP_GUARDIAN_VERSION:?OP_GUARDIAN_VERSION is required}
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    environment:
      HOME: /opt/openpalm/guardian
      PORT: "8080"
      GUARDIAN_DIRECT_PORT: "3830"
      GUARDIAN_ADMIN_PORT: "3831"
      OP_ASSISTANT_URL: http://assistant:4096
      # The guardian npm package version is baked into the image at build time
      # (GUARDIAN_VERSION), so no version env is required to boot. Set
      # OP_GUARDIAN_NPM_VERSION only to override the npm package version — e.g. to
      # pin a private package or a version that differs from the image's baked
      # version (semver ranges are supported here). Empty resolves to the baked
      # GUARDIAN_VERSION in the entrypoint. The Docker image tag is controlled
      # separately by OP_GUARDIAN_VERSION on the `image:` line above.
      OP_GUARDIAN_NPM_VERSION: ${OP_GUARDIAN_NPM_VERSION:-}
      # MANAGED guardian config (instructions/server/permission) lives in
      # OP_HOME/system/guardian, bind-mounted here as OPENCODE_CONFIG_DIR.
      OPENCODE_CONFIG_DIR: /etc/opencode
      # Content validation (LLM-assisted moderation of inbound messages).
      # ON by default: fail-closed policy blocks suspicious traffic when the
      # moderator is unreachable. The operator-tunable moderation model lives in
      # config/guardian/opencode.json. The moderator runs on loopback :4097.
      GUARDIAN_CONTENT_VALIDATION: ${GUARDIAN_CONTENT_VALIDATION:-1}
      GUARDIAN_MODERATION_URL: http://127.0.0.1:4097
      GUARDIAN_MODERATION_PORT: "4097"
      GUARDIAN_MODERATION_TIMEOUT_MS: ${GUARDIAN_MODERATION_TIMEOUT_MS:-4000}
      GUARDIAN_MODERATION_THRESHOLD: ${GUARDIAN_MODERATION_THRESHOLD:-3}
      GUARDIAN_AUDIT_PATH: /opt/openpalm/logs/guardian-audit.log
      GUARDIAN_DIRECT_INGRESS: ${GUARDIAN_DIRECT_INGRESS:-false}
      # TLS/mTLS termination for the direct listener (3830), if wanted, is an
      # operator infrastructure concern — front the guardian with a reverse
      # proxy. The guardian itself serves plain HTTP and does not terminate TLS.
      # Guardian rejects wildcard origins. Browser deployments must opt in
      # their exact origin when direct ingress is enabled.
      GUARDIAN_CORS_ALLOWED_ORIGINS: ${GUARDIAN_CORS_ALLOWED_ORIGINS:-}
      GUARDIAN_MCP: ${GUARDIAN_MCP:-false}
      # S4 lifecycle-aware session eviction (#586). The two row-count caps
      # (GUARDIAN_OWNERSHIP_MAX_ROWS, GUARDIAN_EVICTION_LOG_MAX_ROWS) stay
      # compile-time internals — only the activity grace window and the sweep
      # cadence are operator-tunable. GUARDIAN_SESSION_ACTIVE_GRACE_MS is how
      # recently a session must have been used (through the guardian, or
      # verified upstream by the sweep) to be exempt from eviction; default
      # 24h. GUARDIAN_RECONCILE_INTERVAL_MS is the sweep interval that
      # deletes/archives evicted sessions upstream; '0' disables it.
      GUARDIAN_SESSION_ACTIVE_GRACE_MS: ${GUARDIAN_SESSION_ACTIVE_GRACE_MS:-86400000}
      GUARDIAN_RECONCILE_INTERVAL_MS: ${GUARDIAN_RECONCILE_INTERVAL_MS:-300000}
      # Upstream credential for assistant_net calls when direct Assistant
      # access enables OpenCode Basic auth.
      # The moderator's own loopback OpenCode spawn pins OPENCODE_AUTH=false
      # separately (containers/guardian/entrypoint.sh) — unaffected by this.
      OPENCODE_AUTH: ${OPENCODE_AUTH:-false}
      OPENCODE_SERVER_PASSWORD_FILE: /run/secrets/opencode_server_password
      GUARDIAN_ADMIN_TOKEN_FILE: /run/secrets/op_guardian_admin_token
      GUARDIAN_MCP_TOKEN_FILE: /run/secrets/op_guardian_mcp_token
      PORTAL_CHAT_SECRET_FILE: /run/secrets/portal_chat_secret
      PORTAL_API_SECRET_FILE: /run/secrets/portal_api_secret
      PORTAL_DISCORD_SECRET_FILE: /run/secrets/portal_discord_secret
      PORTAL_SLACK_SECRET_FILE: /run/secrets/portal_slack_secret
      # OpenAI-compatible API server runs inside this container on its own port.
      # Forwards to the gateway server on localhost:8080 (same process group).
      GUARDIAN_OPENAI_PORT: "8182"
      OPENCODE_BASE_URL: ${API_OPENCODE_BASE_URL:-http://localhost:8080/oc}
      # The OpenAI/Anthropic-compatible edge authenticates to /oc as the seeded
      # `api` principal (PORTAL_API_SECRET_FILE above seeds it), so it must present
      # the SAME secret as that principal's token. Without this the edge sends
      # `Basic api:<empty>` and every request 401s.
      PRINCIPAL_ID: api
      PRINCIPAL_SECRET_FILE: /run/secrets/portal_api_secret
      # The API key end users paste into OpenAI-compatible clients. A dedicated
      # secret (not the principal secret) so the two are rotated and audited
      # independently. No key configured ⇒ the edge fails closed (401).
      OPENAI_COMPAT_API_KEY_FILE: /run/secrets/op_api_key
      # G1: shared OpenCode provider credentials via a compose secret (NOT a
      # knowledge/ bind mount — see the `secrets:` block below and the
      # removed volumes entry). Compose secrets always land at
      # /run/secrets/<name>, never at an arbitrary path, so the entrypoint
      # copies this into place at $HOME/.local/share/opencode/auth.json
      # (HOME=/opt/openpalm/guardian) before OpenCode starts.
      GUARDIAN_AUTH_JSON_FILE: /run/secrets/guardian_auth_json
    ports:
      # Generated from the access toggles; flat, never a cascade.
      - "${OP_GUARDIAN_BIND_ADDRESS:-127.0.0.1}:${OP_GUARDIAN_PORT:-3830}:3830"
      # The admin listener is loopback-only, permanently — it mints principals.
      - "127.0.0.1:${OP_GUARDIAN_ADMIN_PORT:-3831}:3831"
      # ONE host port onto the OpenAI-compatible listener. This used to be two
      # separate chat/api host ports mapping to the same container port 8182 —
      # two knobs, two bind addresses and two firewall holes for one service.
      - "${OP_API_BIND_ADDRESS:-127.0.0.1}:${OP_API_PORT:-3821}:8182"
    volumes:
      - ${OP_HOME}/data/guardian:/opt/openpalm/guardian
      # S1: see core.compose.yml — regenerable cache on a pre-created host
      # bind outside durable data/, not a named volume nested in the HOME bind.
      - ${OP_HOME}/cache/guardian:/opt/openpalm/guardian/.cache
      - ${OP_HOME}/data/logs:/opt/openpalm/logs
      # MANAGED guardian config (moderation instructions/server/permission) →
      # OPENCODE_CONFIG_DIR. USER config (moderation model) → the operator's
      # OpenCode global config at ~/.config/opencode (HOME=/opt/openpalm/guardian).
      - ${OP_HOME}/system/guardian:/etc/opencode
      - ${OP_HOME}/config/guardian:/opt/openpalm/guardian/.config/opencode
      # G1: NO bind mount from knowledge/ — the guardian mounts nothing from
      # that tree. Shared OpenCode provider credentials (same file the
      # assistant mounts, so any OpenCode instance uses the same provider
      # configuration) arrive via the `guardian_auth_json` compose secret
      # below instead; the entrypoint copies it to
      # $HOME/.local/share/opencode/auth.json (HOME=/opt/openpalm/guardian).
    secrets:
      - portal_chat_secret
      - portal_api_secret
      - portal_discord_secret
      - portal_slack_secret
      - op_guardian_admin_token
      - op_guardian_mcp_token
      - op_api_key
      - opencode_server_password
      - guardian_auth_json
    networks: [portal_net, assistant_net]
    depends_on:
      assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

secrets:
  # G1: every secret below except `guardian_auth_json` is a DELEGATED secret —
  # consumed only by the guardian/portals, never by the assistant agent — so
  # it lives under private/secrets/, NOT knowledge/secrets/ (bind-mounted
  # wholesale into the assistant at /stash and agent-reachable). The canonical
  # delegated-name list is packages/lib/src/control-plane/secrets-files.ts.
  portal_chat_secret:
    file: ${OP_HOME}/private/secrets/portal_chat_secret
  portal_api_secret:
    file: ${OP_HOME}/private/secrets/portal_api_secret
  portal_discord_secret:
    file: ${OP_HOME}/private/secrets/portal_discord_secret
  discord_bot_token:
    file: ${OP_HOME}/private/secrets/discord_bot_token
  portal_slack_secret:
    file: ${OP_HOME}/private/secrets/portal_slack_secret
  slack_bot_token:
    file: ${OP_HOME}/private/secrets/slack_bot_token
  slack_app_token:
    file: ${OP_HOME}/private/secrets/slack_app_token
  op_guardian_admin_token:
    file: ${OP_HOME}/private/secrets/op_guardian_admin_token
  op_guardian_mcp_token:
    file: ${OP_HOME}/private/secrets/op_guardian_mcp_token
  op_api_key:
    file: ${OP_HOME}/private/secrets/op_api_key
  # #563 — declared here too (not only in core.compose.yml) so this file
  # stands alone for `docker compose config` when portals.compose.yml is the
  # only file naming the secret in a given invocation.
  opencode_server_password:
    file: ${OP_HOME}/private/secrets/op_opencode_password
  # G1: the guardian's shared OpenCode provider credentials, delivered as a
  # compose secret instead of a knowledge/ bind mount so the guardian mounts
  # NOTHING from knowledge/ (see the guardian service's volumes above and
  # containers/guardian/entrypoint.sh, which copies this into place). This
  # file is NOT delegated/relocated — it stays at knowledge/secrets/auth.json,
  # the same file the assistant bind-mounts (read-write) for its own OpenCode
  # process; only the DELIVERY mechanism to the guardian changes.
  guardian_auth_json:
    file: ${OP_HOME}/knowledge/secrets/auth.json
