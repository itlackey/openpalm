# OpenPalm — Core Services
#
# This file defines the core infrastructure. Optional first-party services are
# defined in services.compose.yml and portals.compose.yml, then activated with
# Compose profiles. User customizations live in custom.compose.yml.
#
# Docker Compose reads non-secret stack config (ports, image tags, enabled
# addons) from the app-owned state/stack.env via --env-file.
# Portal and bot secrets are mounted per service via Compose secrets in
# addon overlays and exposed to containers as *_FILE variables.
#
# User-managed env config lives in the akm `env:user` file at
# knowledge/env/user.env (akm-cli >= 0.8.0 layout). The assistant entrypoint
# deliberately does not source that file into the OpenCode server process;
# agent tools load it on demand in a scoped subprocess.
# OpenCode provider credentials live in knowledge/secrets/auth.json. The file is
# bind-mounted into the Assistant; Guardian receives it as one named secret.
#
# Directory model:
#   ~/.openpalm/system/       — managed release assets, including system/stack/
#                               core/services/portals compose files
#   ~/.openpalm/config/       — user-editable config, including only the
#                               config/stack/custom.compose.yml stack overlay
#   ~/.openpalm/data/         — persistent service data, logs, backups, rollback
#   ~/.openpalm/knowledge/    — AKM knowledge (skills, env, tasks, agents) plus
#                               provider secrets/auth.json
#   ~/.openpalm/private/      — delegated service credentials outside /stash
#   ~/.openpalm/cache/        — regenerable Assistant and Guardian caches
#   ~/.openpalm/workspace/    — shared work area

services:
  # ── Assistant (opencode runtime — NO docker socket) ────────────────
  assistant:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/assistant:${OP_ASSISTANT_VERSION:?OP_ASSISTANT_VERSION is required}
    restart: unless-stopped
    # IMG-7: cap json-file logs (30 MB/service ceiling). Docker's default
    # driver is unbounded, which contributed to the production disk incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${OP_UID:-1000}:${OP_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # MANAGED OpenCode config (plugins/permissions/instructions) lives in
      # OP_HOME/system/assistant, mounted here as the global OPENCODE_CONFIG_DIR
      # (overwritten on update; plugin node_modules install here, never in the
      # user tree). The USER's model/provider config is OpenCode's own global
      # config under HOME (~/.config/opencode), so no extra mount is needed.
      OPENCODE_CONFIG_DIR: /etc/opencode
      OPENCODE_PORT: "4096"
      # Auth is off by default because the assistant is only reachable via the
      # internal assistant_net Docker network and the host port binding
      # defaults to 127.0.0.1 (loopback-only). Guardian communicates with the
      # assistant over assistant_net without credentials in that default
      # posture, and the scheduler runs as a co-process inside this container
      # so it reaches OpenCode via http://localhost:4096.
      #
      # Generated: auth is on iff the assistant API is PUBLISHED (the
      # "assistantDirect" access toggle). When it is not published there is no
      # network-reachable surface to authenticate, and the UI's /oc proxy and
      # the guardian both reach it over loopback / assistant_net. The key is
      # system-generated into the op_opencode_password secret, which BOTH this
      # service (serves Basic auth) and the guardian (attaches it upstream, see
      # portals.compose.yml) read. Never a password the operator invents.
      OPENCODE_AUTH: ${OPENCODE_AUTH:-false}
      # The OpenCode server password, read from the compose secret
      # below. Never a raw OPENCODE_SERVER_PASSWORD env value (secret-audit.ts
      # forbids *_PASSWORD-suffixed compose environment keys).
      OPENCODE_SERVER_PASSWORD_FILE: /run/secrets/opencode_server_password
      TERM: xterm-256color
      HOME: /home/opencode
      # akm-cli layout: user-managed config and stash are separate from
      # operational cache/data, which live under OP_HOME/data.
      AKM_STASH_DIR: /stash
      AKM_CONFIG_DIR: /etc/akm
      AKM_CACHE_DIR: /opt/akm/cache
      AKM_DATA_DIR: /opt/akm/data
      APPRISE_NOTIFY_CONFIG: /stash/env/apprise.conf
      OP_UID: ${OP_UID:-1000}
      OP_GID: ${OP_GID:-1000}
      OPENCODE_API_URL: http://localhost:4096
      # @openpalm/ui co-process ("One UI, delete the split" Phase 4). The
      # assistant container serves the image-baked SvelteKit adapter-node UI
      # build as a supervised co-process alongside OpenCode. NOTE:
      # OP_ENABLE_ADMIN is deliberately NOT set — the
      # container-served UI runs the NON-admin build (Electron/CLI-only admin
      # boundary), so its /host routes 404.
      # The entrypoint writes the UI's runtime-config.json seeding the browser's
      # locked connection with the ROOT-RELATIVE "/oc" path — the UI's own
      # same-origin proxy. The browser resolves it against whatever origin it
      # loaded, which is exactly what this process cannot know at startup.
      # Interpolation fallback matches the SHIPPED contract: OpenCode 3810, UI
      # 3800. Fresh and migrated stack.env files materialize both explicitly,
      # and every deploy path runs migrateLegacyDefaultPorts() before compose
      # (lifecycle.applyHome, cli-compose.runComposeWithPreflight,
      # install.ts, the UI supervisor hook), so a pre-migration stack.env can
      # no longer reach this line. These fallbacks therefore only serve the
      # manual `docker compose` path documented in
      # docs/operations/manual-compose-runbook.md — where the RETIRED pair
      # (assistant 3800 / UI 3810) silently inverted the layout every doc,
      # the CLI, the setup system-check, and the wizard's own links describe.
      OP_ASSISTANT_PORT: ${OP_ASSISTANT_PORT:-3810}
      # NOTE: OP_UI_HOST_PORT and OP_HOST_UI_PORT are deliberately NOT passed.
      # They existed solely so the entrypoint could assemble OpenCode's --cors
      # origin list. The browser now reaches OpenCode through the UI's own
      # same-origin /oc proxy, so there is no cross-origin request and no
      # origin to allow.
      # The served UI's session login uses the SAME UI login password as the
      # host UI (route contract: /api/auth is deliberately outside /api/host so
      # a served non-admin deployment can authenticate). Without this secret
      # the co-process has no password source (no OP_HOME in-container), login
      # can never mint a session, and the published UI dead-ends at /login.
      # File-based like OPENCODE_SERVER_PASSWORD_FILE (secret-audit forbids raw
      # *_PASSWORD compose env keys); the entrypoint resolves it for the UI
      # child only. Setup fail-closes before deploy if no password exists.
      OP_UI_LOGIN_PASSWORD_FILE: /run/secrets/ui_login_password
      # Used only to label the browser's automatically seeded local connection.
      OP_PROJECT_NAME: ${OP_PROJECT_NAME:-openpalm}
      # Generated from the access toggles (packages/lib access-toggles.ts) and
      # written explicitly to stack.env on every deploy. FLAT: there is no
      # cascade, so an absent value means loopback and nothing else. The
      # previous nesting meant "unset" inherited a global bind for four
      # listeners and meant loopback for one, in this same file.
      OP_ASSISTANT_BIND_ADDRESS: ${OP_ASSISTANT_BIND_ADDRESS:-127.0.0.1}
      # The EFFECTIVE host bind for the UI co-process, mirroring the port line
      # below exactly. The container cannot otherwise know it: the UI child is
      # always started with HOST=0.0.0.0 (Docker requires binding all
      # interfaces INSIDE the container), so its own listener says nothing
      # about whether the port is published to the LAN or only to loopback.
      # The UI's Host-header allowlist reads this to decide whether it is
      # allowed to be reached by a name other than localhost.
      OP_UI_BIND_ADDRESS: ${OP_UI_BIND_ADDRESS:-127.0.0.1}
      # Provider credentials live in OpenCode's auth.json (bind-mounted
      # below) — NOT in this env block. The Connections tab and the setup
      # wizard both call OpenCode's PUT /auth/{providerID}; ai-sdk picks
      # the key up via OpenCode at call time.
    ports:
      - "${OP_ASSISTANT_BIND_ADDRESS:-127.0.0.1}:${OP_ASSISTANT_PORT:-3810}:4096"
      # UI co-process (@openpalm/ui adapter-node, in-container port 3000).
      # THE one listener a home install publishes: OpenCode is reached through
      # this process's same-origin /oc proxy, not directly. Voice is NOT: the
      # entrypoint sets OP_UI_NO_LOCAL_VOICE=1 (this co-process reaches only
      # its own loopback, never the sibling voice container), so /voice 503s
      # here by design — voice is host-UI-only (docs/troubleshooting.md).
      # OP_UI_PORT is the HOST-facing port only; it is deliberately NOT passed
      # into the container env (the UI always serves on 3000 in-container).
      - "${OP_UI_BIND_ADDRESS:-127.0.0.1}:${OP_UI_PORT:-3800}:3000"
    volumes:
      # data/assistant is HOME (runtime). config/assistant is the power-user's
      # OpenCode GLOBAL config, mounted at ~/.config/opencode (nested over HOME).
      # system/assistant is the MANAGED config (OPENCODE_CONFIG_DIR) — plugins,
      # permissions, instructions; overwritten on update.
      - ${OP_HOME}/data/assistant:/home/opencode
      # S1: regenerable caches (bun/npm/opencode) live OUTSIDE durable data/,
      # in a purgeable cache/ tree. This is a host BIND, not a named volume:
      # the first attempt (921412b1) nested a named volume inside the HOME bind
      # and Docker created the mountpoint root-owned, failing the rootless
      # smoke. ensureHomeDirs pre-creates cache/assistant operator-owned, so
      # Docker never has to create it. Purge with `openpalm doctor
      # --clean-caches`; excluded from backups.
      - ${OP_HOME}/cache/assistant:/home/opencode/.cache
      - ${OP_HOME}/config/assistant:/home/opencode/.config/opencode
      - ${OP_HOME}/system/assistant:/etc/opencode
      - ${OP_HOME}/knowledge/secrets/auth.json:/home/opencode/.local/share/opencode/auth.json
      # Primary stash + config are ALWAYS OpenPalm-managed.
      - ${OP_HOME}/knowledge:/stash
      - ${OP_HOME}/config/akm:/etc/akm
      - ${OP_HOME}/data/akm/cache:/opt/akm/cache
      - ${OP_HOME}/data/akm/data:/opt/akm/data
      # Host AKM secondary stash. ALWAYS mounted: when the host has AKM,
      # OP_HOST_AKM_STASH points at the user's personal stash (e.g. ~/akm) and
      # "sharing" = a writable secondary source entry named host-akm in
      # config/akm/config.json. When absent, OP_HOST_AKM_STASH is unset and this
      # falls back to an always-present empty dir, so compose never errors and
      # akm simply never walks it (it is not a configured source). The container
      # NEVER chowns this mount (see entrypoint.sh).
      - ${OP_HOST_AKM_STASH:-${OP_HOME}/data/akm/empty-host-stash}:/host-stash
      - ${OP_HOME}/workspace:/work
      # Escape hatch for prefix-style global installs that cannot cleanly live
      # under $HOME. Prefer $HOME/.local when possible; use /opt/persistent for
      # tools that require an explicit non-home prefix.
      - assistant-persistent:/opt/persistent
    secrets:
      - opencode_server_password
      - ui_login_password
    networks: [ assistant_net ]
    # Probe the UI co-process too, not just OpenCode — a boot-time
    # UI startup failure would otherwise leave the published UI port with
    # nothing listening while this healthcheck still reported healthy.
    # Skipped (not failed) when the UI build is missing or its supervisor gives
    # up after a crash loop (marker file /tmp/openpalm-ui-skip).
    #
    # The UI probe targets the LITERAL in-container port 3000 — the target of the
    # port mapping above, which cannot vary. It used to read `$${OP_UI_PORT:-3000}`
    # (container-side expansion, since OP_UI_PORT is never passed in), which was
    # correct only by omission: an operator who added OP_UI_PORT to
    # custom.compose.yml's `environment:` made this probe follow it to a port
    # nothing listens on. A literal cannot drift. The UI's /health route is
    # exempt from the login/setup wall (packages/ui hooks.server.ts).
    # #564 P1-1: the /health probe authenticates iff the container-side
    # OPENCODE_AUTH is truthy. OpenCode enables Basic auth whenever the
    # assistant API is published, and an unauthenticated `curl -f` then
    # 401s forever — guardian's `depends_on: assistant: condition:
    # service_healthy` blocks on that and the whole stack never deploys. The
    # gate mirrors the entrypoint's opencode_auth_enabled truthy set exactly
    # so probe and server can never disagree about the posture. The username
    # defaults to OpenCode's own default `opencode` (an overlay-injected
    # OPENCODE_SERVER_USERNAME is honored); the password is `cat`ed from the
    # same OPENCODE_SERVER_PASSWORD_FILE the entrypoint reads — a Docker
    # healthcheck process only ever sees the container's created env, never
    # variables the entrypoint exports later, so reading the file directly is
    # the only correct source here. Gated on the operator's requested posture
    # rather than on file non-emptiness, so a stale-secret regression (the
    # secret file is always materialized non-empty by ensureSecrets) fails
    # this healthcheck loudly instead of being silently masked.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${OPENCODE_AUTH:-false}" in
          true|TRUE|True|1|yes|YES)
          curl -sf -u "$${OPENCODE_SERVER_USERNAME:-opencode}:$$(cat "$${OPENCODE_SERVER_PASSWORD_FILE:-/run/secrets/opencode_server_password}")"
          http://localhost:4096/health || exit 1 ;;
          *)
          curl -sf http://localhost:4096/health || exit 1 ;;
          esac;
          if [ ! -f /tmp/openpalm-ui-skip ]; then curl -sf http://localhost:3000/health >/dev/null || exit 1; fi
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── mDNS service discovery ───────────────────────────────────────────
  # mDNS is no longer published by avahi sidecars. The PRIMARY LAN advertiser
  # (#488) is the HOST control-plane responder (packages/lib mdns-responder.ts,
  # started from the host UI process) — it actually reaches the LAN, gated by
  # OP_GUARDIAN_BIND_ADDRESS (guardian, <name>-guardian.local) /
  # OP_UI_BIND_ADDRESS (the UI front door, <name>.local); loopback opens no socket;
  # OP_MDNS=off disables it. OpenCode's native in-process mDNS responder
  # (server.mdns / server.mdnsDomain in the assistant + guardian opencode.jsonc
  # files) remains a manual/advanced in-container path — bridge-network
  # multicast never reaches the physical LAN, so it is off by default. See
  # docs/technical/network-partitioning-d5a.md for both mechanisms.

# Portal-style ingress services join portal_net to reach the guardian.
networks:
  portal_net:
  assistant_net:
  # Addon trust boundary (S.6b / D3(b)). Optional addon services that do NOT need
  # to talk to the assistant OpenCode API join addon_net instead of assistant_net,
  # so a third-party addon image cannot reach the assistant's :4096 over a shared
  # bridge. Addons that genuinely need the assistant (e.g. ollama, the assistant's
  # LLM provider) are granted assistant_net PER SERVICE, not by default membership.
  addon_net:

# The OpenCode server password. Each managed compose file stands alone
# for `docker compose config`, so this same top-level secret is also declared
# in portals.compose.yml (the guardian's grant).
#
# G1: op_opencode_password and op_ui_login_password are DELEGATED secrets —
# consumed only by the guardian/portals and this service's own server process,
# never by the assistant agent — so they live under private/secrets/, NOT
# knowledge/secrets/ (which is bind-mounted wholesale into the assistant at
# /stash and is agent-reachable). The canonical delegated-name list is
# packages/lib/src/control-plane/secrets-files.ts DELEGATED_SECRET_NAMES.
secrets:
  opencode_server_password:
    file: ${OP_HOME}/private/secrets/op_opencode_password
  # UI login password for the container-served @openpalm/ui co-process.
  # Guaranteed present before any shipped deploy: setup fail-closes without it
  # (setup.ts security.uiLoginPassword), and the dev/smoke fixtures seed it.
  # Manual-compose users: see docs/operations/manual-compose-runbook.md.
  ui_login_password:
    file: ${OP_HOME}/private/secrets/op_ui_login_password

volumes:
  assistant-persistent:
