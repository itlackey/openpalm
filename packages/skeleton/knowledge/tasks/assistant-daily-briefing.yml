version: 4
name: assistant-daily-briefing
description: Ask the assistant for a daily system health summary
tags:
  - openpalm
  - assistant
timeout: 120000
uses: akm/command
with:
  content: >-
    Good morning. Give me a brief summary of system health, any recent
    errors in the audit log, and open tasks.
schedule:
  - cron: '0 8 * * *'
    enabled: false
