appId: com.openpalm.admin
productName: OpenPalm Admin

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/admin-main.js
  - dist/admin-preload.cjs
  - admin/**/*
  - package.json

publish: null
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.png

linux:
  executableName: openpalm-admin
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: assets/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

nsis:
  artifactName: OpenPalm-Admin-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
