appId: com.openpalm.app
productName: OpenPalm
copyright: "Copyright © 2025 OpenPalm Contributors"

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/main.js
  - dist/preload.cjs
  - assets/**/*
  - package.json

extraResources:
  - from: ../../packages/ui/build
    to: ui-build
    filter: "**/*"
  # The `@openpalm/admin-tools-plugin` workspace (packages/electron/admin-tools)
  # used to ship its dist/index.js here as extraResources, but nothing under
  # src/*.ts ever read it back out of resourcesPath — its intended consumer, an
  # Electron-spawned ephemeral OpenCode server loading this as a plugin, was
  # never wired up. Confirmed genuinely dead (no runtime reference anywhere in
  # the repo, including CI and dynamic path construction) and removed entirely:
  # the workspace, its build step, and its test invocation.
  - from: ../../packages/skeleton
    to: openpalm-skeleton
    filter: "**/*"
  - from: ../../LICENSE
    to: LICENSE

# Update feed (#572). electron-updater reads its metadata (latest.yml /
# latest-linux.yml) from the GitHub release for this repo, so the desktop app
# updates as ONE complete artifact — shell and bundled UI together. Only the
# targets that can self-install publish that metadata; see the per-platform
# notes below.
#
# `releaseType: release` keeps prereleases out of the stable feed. A beta-channel
# user gets prereleases because electron-updater asks for the `beta` channel
# (see updaterChannel in src/updater.ts), not because the feed mixes them.
publish:
  - provider: github
    owner: itlackey
    repo: openpalm
    releaseType: release

# NOTE: OpenPalm desktop builds are UNSIGNED (no Apple/Windows code-signing certs).
#
# Windows and Linux still auto-update: NSIS and AppImage both replace the app
# in place without a signature, so those two carry the updater feed.
#
# macOS does NOT. electron-updater's macOS path verifies the code signature, and
# an unsigned in-place replacement leaves an app Gatekeeper refuses to launch —
# so macOS stays a plain .zip of the .app on the manual download path until
# Developer ID signing and notarization are enforced. macOS shows a one-time
# Gatekeeper prompt for unsigned apps — right-click the app → Open the first time
# (or `xattr -dr com.apple.quarantine OpenPalm.app`). electron-builder ad-hoc
# signs the macOS app by default, which keeps Apple Silicon from refusing it as
# "damaged"; do NOT set `identity: null`.

mac:
  # No updater feed for macOS: electron-updater's macOS path requires a signed,
  # notarized app, so publishing latest-mac.yml would advertise an update the
  # app cannot install. macOS downloads a new build by hand from the releases
  # page. scripts/validate-updater-feed.mjs fails the release if this regresses.
  publish: null
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.png
  # Microphone access on macOS needs BOTH of the following or capture is denied
  # without any prompt and the app never appears under Privacy → Microphone:
  #
  # 1. NSMicrophoneUsageDescription in Info.plist — the string macOS shows in
  #    the permission prompt. Without it askForMediaAccess() crashes/denies.
  # 2. com.apple.security.device.audio-input in the signing entitlements —
  #    electron-builder signs with the Hardened Runtime flag BY DEFAULT (even
  #    for the ad-hoc identity), and the hardened runtime blocks mic capture
  #    before TCC unless this entitlement is present. Its default entitlements
  #    file does NOT include it, which is why 0.11.3 showed "Microphone access
  #    denied" while OpenPalm was absent from the Settings list. We therefore
  #    ship our own entitlements (Electron baseline + audio-input).
  extendInfo:
    NSMicrophoneUsageDescription: OpenPalm uses the microphone for voice input — speaking to your assistant.
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

linux:
  # electron-builder ≥26.15 validates executableName; the default derived from
  # the package name (@openpalm/electron → "@openpalmelectron") fails it.
  executableName: openpalm
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: assets/icon.png

win:
  target:
    # NSIS is the updater-capable target: electron-updater can only replace a
    # Windows install in place through an installer, so this is what makes
    # "Restart and update" work on Windows.
    - target: nsis
      arch: [x64]
    # The portable .zip stays for people who want extract-and-run with no
    # installer and no admin prompt. It is MANUAL-ONLY: a portable app has no
    # install location to update, so electron-updater does not manage it.
    - target: zip
      arch: [x64]
  icon: assets/icon.png

nsis:
  # Per-user install needs no admin rights, which keeps unattended updates
  # working: a machine-wide install would prompt for elevation on every update.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
