appId: com.openpalm.app
productName: OpenPalm
copyright: "Copyright © 2025 OpenPalm Contributors"

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/main.js
  - dist/preload.cjs
  - assets/**/*
  - package.json

extraResources:
  - from: ../../packages/ui/build
    to: ui-build
    filter: "**/*"
  - from: admin-tools/dist/index.js
    to: admin-tools/index.js
  - from: ../../.openpalm
    to: openpalm-skeleton
    filter: "**/*"

# NOTE: OpenPalm desktop builds are UNSIGNED (no Apple/Windows code-signing certs).
# To keep install as frictionless as possible we ship plain archives, not OS
# installers: a .zip of the .app on macOS and a portable .zip on Windows. This
# trades away in-app auto-update (which on macOS requires a signed app anyway) for
# the simplest possible "download → extract → run". macOS still shows a one-time
# Gatekeeper prompt for unsigned apps — right-click the app → Open the first time
# (or `xattr -dr com.apple.quarantine OpenPalm.app`). electron-builder ad-hoc
# signs the macOS app by default, which keeps Apple Silicon from refusing it as
# "damaged"; do NOT set `identity: null`.

mac:
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.png
  # macOS refuses microphone access (and never lists the app under Privacy →
  # Microphone) unless the Info.plist declares why it needs the mic. Without
  # this, the navbar mic captures a SILENT stream and Whisper transcribes a
  # phantom "You". The string is shown in the OS permission prompt.
  extendInfo:
    NSMicrophoneUsageDescription: OpenPalm uses the microphone for voice input — speaking to your assistant.

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: assets/icon.png

win:
  target:
    # Portable .zip only — extract and run, no installer, no admin, and no
    # "Windows protected your PC" install-time SmartScreen step. (SmartScreen may
    # still warn on first run of an unsigned .exe → "More info" → "Run anyway".)
    - target: zip
      arch: [x64]
  icon: assets/icon.png

npmRebuild: false
