appId: com.openpalm.app
productName: OpenPalm
copyright: "Copyright © 2025 OpenPalm Contributors"

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # icon: assets/icon.icns  # Uncomment when icon assets are added

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  # icon: assets/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  # icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null
