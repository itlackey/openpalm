appId: com.openpalm.app
productName: OpenPalm
copyright: "Copyright © 2025 OpenPalm Contributors"

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/main.js
  - dist/preload.cjs
  - assets/**/*
  - package.json

extraResources:
  - from: ../../packages/ui/build
    to: ui-build
    filter: "**/*"
  - from: admin-tools/dist/index.js
    to: admin-tools/index.js

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: assets/icon.png

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: assets/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: itlackey
  repo: openpalm
  releaseType: release
