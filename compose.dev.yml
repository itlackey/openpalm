# Local development override — builds images from source instead of pulling
#
# Preferred usage:
#   bun run dev:build
#
# Manual equivalent (from project root):
#   docker compose --project-directory . \
#     -f .openpalm/config/stack/core.compose.yml \
#     -f compose.dev.yml \
#     --env-file .dev/config/stack/stack.env \
#     --env-file .dev/stash/vaults/user.env \
#     build openpalm-base \
#   && docker compose --project-directory . \
#        -f .openpalm/config/stack/core.compose.yml \
#        -f compose.dev.yml \
#        --env-file .dev/config/stack/stack.env \
#        --env-file .dev/stash/vaults/user.env \
#        up --build -d
#
# The --project-directory . flag is REQUIRED when the core compose file lives
# in a different directory (.openpalm/stack/ or .dev/stack/). Without it,
# Docker Compose resolves build contexts relative to the first -f file's
# directory, which breaks builds.
#
# openpalm-base MUST be built before assistant — it uses `FROM openpalm-base`
# and Docker Compose's parallel builder has no dependency awareness for FROM.
# It lives under the `build` profile so `up` never tries to start it (the image
# has no entrypoint).

services:
  # Shared foundation image: Bun + OpenCode + akm-cli at pinned versions.
  # See core/base/Dockerfile for the single source of truth on those versions.
  openpalm-base:
    build:
      context: .
      dockerfile: core/base/Dockerfile
    image: openpalm-base
    profiles: ["build"]
    # No command/restart — this service exists only so `docker compose build
    # openpalm-base` resolves the image. It is never started by `up`.
    command: ["true"]

  guardian:
    build:
      context: .
      dockerfile: core/guardian/Dockerfile
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/guardian:dev
    # Dev override: publish guardian to host for integration tests.
    # Uses OP_GUARDIAN_PORT (default 8180) to avoid conflict with the legacy
    # ingress port 8080 (which tests expect to be ECONNREFUSED).
    ports:
      - "${OP_GUARDIAN_BIND_ADDRESS:-127.0.0.1}:${OP_GUARDIAN_PORT:-8180}:8080"

  assistant:
    build:
      context: .
      dockerfile: core/assistant/Dockerfile
      # See openpalm-base service above for rationale on additional_contexts.
      additional_contexts:
        openpalm-base: docker-image://openpalm-base
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/assistant:dev
    # Dev override: blank cloud keys to prevent host env leakage.
    # OpenCode uses its own provider detection and auth store.
    # LMSTUDIO vars are NOT blanked — lmstudio is the Ollama-compatible provider
    # used for local models (socat proxy in entrypoint.sh forwards 127.0.0.1:1234 → Ollama).
    environment:
      GROQ_API_KEY: ""
      MISTRAL_API_KEY: ""
      GOOGLE_API_KEY: ""

  channel:
    build:
      context: .
      dockerfile: core/channel/Dockerfile
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/channel:dev

  # Voice channel dev override: standalone static file server (no channel SDK entrypoint).
  channel-voice:
    image: ${OP_IMAGE_NAMESPACE:-openpalm}/channel:dev
    ports:
      - "${OP_VOICE_BIND_ADDRESS:-127.0.0.1}:${OP_VOICE_PORT:-8186}:8186"
    volumes:
      - ./packages/channel-voice:/app/channel-voice:ro
    environment:
      PORT: "8186"
    command: ["bun", "run", "/app/channel-voice/src/index.ts"]
    networks: [channel_lan]
